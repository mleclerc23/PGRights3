    if(submitted) return;
    submitted = true;
    onAddNote(addInput.value, addDateInput.value || null);
  };
  addInput.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); submitNote(); } });
  addInput.addEventListener("blur", () => { if(addInput.value.trim()) submitNote(); });
  return block;
}

function addStepNote(item, field, label, text, date){
  const value = text.trim();
  if(!value) return;
  migrateStepNotes(item);
  // stored as HTML downstream (rendered directly, and reopened in the rich
  // editor) — escape this plain-input value so it's safe either way.
  item.stepNotes[field].push({ id: uid("sn"), text: escapeHtml(value), date: date || null, createdAt: new Date().toISOString() });
  recordChange(item.id, "item", item.id, item.name, field + "Note", label + " note added", "", value);
  scheduleSave();
  render();
}
function removeStepNote(item, field, label, idx){
  migrateStepNotes(item);
  const removed = item.stepNotes[field][idx];
  item.stepNotes[field].splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, field + "Note", label + " note removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function updateStepNoteText(item, field, label, idx, value){
  migrateStepNotes(item);
  const note = item.stepNotes[field][idx];
  if(!note) return;
  const old = note.text || "";
  if(old === value) return;
  note.text = value;
  recordChange(item.id, "item", item.id, item.name, field + "NoteText", label + " note", old, value);
  scheduleSave();
  render();
}
function updateStepNoteDate(item, field, label, idx, value){
  migrateStepNotes(item);
  const note = item.stepNotes[field][idx];
  if(!note) return;
  const old = note.date || "";
  const next = value || "";
  if(old === next) return;
  note.date = next || null;
  recordChange(item.id, "item", item.id, item.name, field + "NoteDate", label + " note date", old, next);
  scheduleSave();
  render();
}
function updateCustomStepField(item, id, key, value){
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === id);
  if(!cs) return;
  const old = cs[key] || "";
  if(old === value) return;
  cs[key] = value;
  recordChange(item.id, "item", item.id, item.name, "customStep." + key, cs.label + " " + key, old, value);
  scheduleSave();
  render();
}
function removeCustomStep(item, id){
  migrateCustomSteps(item);
  const idx = item.customSteps.findIndex(c => c.id === id);
  if(idx === -1) return;
  const removed = item.customSteps[idx];
  item.customSteps.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "customStep", "Custom step removed", removed.label, "");
  scheduleSave();
  render();
}
function addCustomStepNote(item, csId, text, date){
  const value = (text || "").trim();
  if(!value) return;
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === csId);
  if(!cs) return;
  if(!Array.isArray(cs.notes)) cs.notes = [];
  cs.notes.push({ id: uid("sn"), text: escapeHtml(value), date: date || null, createdAt: new Date().toISOString() });
  recordChange(item.id, "item", item.id, item.name, "customStepNote", cs.label + " note added", "", value);
  scheduleSave();
  render();
}
function removeCustomStepNote(item, csId, idx){
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === csId);
  if(!cs) return;
  const removed = cs.notes[idx];
  cs.notes.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "customStepNote", cs.label + " note removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function updateCustomStepNoteText(item, csId, idx, value){
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === csId);
  if(!cs) return;
  const note = cs.notes[idx];
  if(!note) return;
  const old = note.text || "";
  if(old === value) return;
  note.text = value;
  recordChange(item.id, "item", item.id, item.name, "customStepNoteText", cs.label + " note", old, value);
  scheduleSave();
  render();
}
function updateCustomStepNoteDate(item, csId, idx, value){
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === csId);
  if(!cs) return;
  const note = cs.notes[idx];
  if(!note) return;
  const old = note.date || "";
  const next = value || "";
  if(old === next) return;
  note.date = next || null;
  recordChange(item.id, "item", item.id, item.name, "customStepNoteDate", cs.label + " note date", old, next);
  scheduleSave();
  render();
}

function migrateTitleDetails(item){
  if(Array.isArray(item.titleDetails)) return;
  const hasLegacy = item.logline !== undefined || item.originalOrAdapted !== undefined || item.episodeCount !== undefined || item.rightsAdaptations !== undefined;
  if(hasLegacy && (item.logline || item.originalOrAdapted || item.episodeCount || item.rightsAdaptations)){
    item.titleDetails = [{
      id: uid("td"),
      title: (item.titles && item.titles[0]) || "",
      logline: item.logline || "",
      originalOrAdapted: item.originalOrAdapted || "",
      episodeCount: item.episodeCount || "",
      rightsAdaptations: item.rightsAdaptations || "",
    }];
  }else{
    item.titleDetails = [];
  }
}
function renderTitleDetailsPanel(item){
  migrateTitleDetails(item);
  const panel = el(`<div class="panel"><div class="panel-head"><div><h2>Titles</h2></div></div><div class="panel-pad" id="td-list"></div></div>`);
  const list = panel.querySelector("#td-list");
  item.titleDetails.forEach((td, idx) => {
    list.appendChild(td.posted ? renderPostedTitleBlock(item, td, idx) : renderEditableTitleBlock(item, td, idx));
  });
  const addBtn = el(`<button class="btn btn-sm" id="td-add">+ Add title</button>`);
  addBtn.onclick = () => addTitleDetail(item);
  list.appendChild(addBtn);
  return panel;
}
function renderEditableTitleBlock(item, td, idx){
  const block = el(`
    <div class="td-block">
      <div class="td-top">
        <div id="td-title-holder" style="flex:1;"></div>
        <button class="btn btn-sm" data-role="finish">Lock</button>
        <button class="ec-remove" title="Remove title" data-role="remove">×</button>
      </div>
      <span class="field-label">Logline</span>
      <div data-holder="logline"></div>
      <div style="margin-top:12px;">
        <span class="field-label">Genre</span>
        <div id="td-genre-holder"></div>
      </div>
      <div style="margin-top:12px;">
        <span class="field-label">Original Run</span>
        <div id="td-run-holder"></div>
      </div>
      <div style="margin-top:12px;">
        <span class="field-label"># of Episodes</span>
        <input type="number" min="0" class="text-input" data-field="episodeCount" value="${escapeHtml(String(td.episodeCount || ""))}" placeholder="e.g. 8" />
      </div>
      <div style="margin-top:12px;">
        <span class="field-label">Broadcaster</span>
        <div id="td-broadcaster-holder"></div>
      </div>
      <div style="margin-top:12px;">
        <span class="field-label">Original or Adapted</span>
        <select class="text-input" data-field="originalOrAdapted">
          <option value="">—</option>
          <option value="Original" ${td.originalOrAdapted==="Original"?"selected":""}>Original</option>
          <option value="Adapted" ${td.originalOrAdapted==="Adapted"?"selected":""}>Adapted</option>
        </select>
      </div>
      ${td.originalOrAdapted === "Adapted" ? `
      <div style="margin-top:12px;">
        <span class="field-label">Based On</span>
        <div id="td-basedon-holder"></div>
      </div>` : ""}
      <div style="margin-top:12px;">
        <span class="field-label">Adaptations</span>
        <div class="step-notes-list" data-holder="adaptations-list"></div>
        <div class="step-note-add">
          <input type="text" class="step-note-input" placeholder="Add an adaptation…" data-role="add-adaptation" />
        </div>
      </div>
      <div style="margin-top:12px;">
        <span class="field-label">Additional Notes</span>
        <div data-holder="notes"></div>
      </div>
    </div>
  `);
  const titleField = createRichTextLine(td.title || "", "Title name", "td-title-input");
  block.querySelector("#td-title-holder").appendChild(titleField);
  bindCommitRich(titleField, v => updateTitleDetail(item, idx, "title", v));
  const genreField = createRichTextLine(td.genre || "", "e.g. Mystery, Drama", "text-input");
  block.querySelector("#td-genre-holder").appendChild(genreField);
  bindCommitRich(genreField, v => updateTitleDetail(item, idx, "genre", v));
  const runField = createRichTextLine(td.originalRun || "", "e.g. 1998–2003", "text-input");
  block.querySelector("#td-run-holder").appendChild(runField);
  bindCommitRich(runField, v => updateTitleDetail(item, idx, "originalRun", v));
  const broadcasterField = createRichTextLine(td.broadcaster || "", "e.g. BBC One", "text-input");
  block.querySelector("#td-broadcaster-holder").appendChild(broadcasterField);
  bindCommitRich(broadcasterField, v => updateTitleDetail(item, idx, "broadcaster", v));
  if(td.originalOrAdapted === "Adapted"){
    const basedOnField = createRichTextLine(td.basedOn || "", "Source material (book, article, etc.)", "text-input");
    block.querySelector("#td-basedon-holder").appendChild(basedOnField);
    bindCommitRich(basedOnField, v => updateTitleDetail(item, idx, "basedOn", v));
  }
  const loglineEditor = createRichTextEditor(td.logline || "", "", 36);
  block.querySelector('[data-holder="logline"]').appendChild(loglineEditor.wrap);
  bindCommitRich(loglineEditor.editable, v => updateTitleDetail(item, idx, "logline", v));
  const notesEditor = createRichTextEditor(td.notes || "", "", 36);
  block.querySelector('[data-holder="notes"]').appendChild(notesEditor.wrap);
  bindCommitRich(notesEditor.editable, v => updateTitleDetail(item, idx, "notes", v));
  migrateAdaptations(td);
  const adaptList = block.querySelector('[data-holder="adaptations-list"]');
  td.adaptations.forEach((ad, adIdx) => {
    const row = el(`<div class="step-note-line adaptation-row"><div class="adaptation-rich" data-holder="adapt-rich"></div><button class="ec-remove" title="Remove adaptation" data-role="remove-adaptation">×</button></div>`);
    const adaptEditor = createRichTextEditor(ad.text || "", "", 22);
    row.querySelector('[data-holder="adapt-rich"]').appendChild(adaptEditor.wrap);
    bindCommitRich(adaptEditor.editable, v => updateAdaptationText(item, idx, adIdx, v));
    row.querySelector('[data-role="remove-adaptation"]').onclick = () => removeAdaptation(item, idx, adIdx);
    adaptList.appendChild(row);
  });
  const addAdaptInput = block.querySelector('[data-role="add-adaptation"]');
  let adaptSubmitted = false;
  const submitAdaptation = () => {
    if(adaptSubmitted) return;
    adaptSubmitted = true;
    addAdaptation(item, idx, addAdaptInput.value);
  };
  addAdaptInput.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); submitAdaptation(); } });
  addAdaptInput.addEventListener("blur", () => { if(addAdaptInput.value.trim()) submitAdaptation(); });
  block.querySelectorAll("[data-field]").forEach(fieldEl => {
    const field = fieldEl.getAttribute("data-field");
    if(fieldEl.tagName === "SELECT"){
      fieldEl.onchange = (e) => updateTitleDetail(item, idx, field, e.target.value);
    }else{
      bindCommit(fieldEl, v => updateTitleDetail(item, idx, field, v));
    }
  });
  block.querySelector('[data-role="remove"]').onclick = () => removeTitleDetail(item, idx);
  block.querySelector('[data-role="finish"]').onclick = () => setTitleDetailPosted(item, idx, true);
  return block;
}
/** Splits sanitized rich-text HTML on its <br> line breaks into separate items. */
function splitRichLines(html){
  return (html || "")
    .split(/<br\s*\/?>/i)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}
function htmlToPlainText(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return (d.textContent || "").trim();
}
/** Adaptations used to be one rich-text blob; now it's a proper list of
 * items. Migrates any existing blob (splitting on its line breaks, and
 * stripping bold/italic markup down to plain text) into that list. */
function migrateAdaptations(td){
  if(Array.isArray(td.adaptations)) return;
  if(td.rightsAdaptations){
    const lines = splitRichLines(td.rightsAdaptations);
    td.adaptations = lines.map(l => ({ id: uid("ad"), text: escapeHtml(htmlToPlainText(l)) }));
  }else{
    td.adaptations = [];
  }
}
function addAdaptation(item, tdIdx, text){
  const value = (text || "").trim();
  if(!value) return;
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  // stored as HTML downstream (rendered directly, and re-opened in the rich
  // editor) — escape this plain-input value so it's safe either way.
  td.adaptations.push({ id: uid("ad"), text: escapeHtml(value) });
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation added", "", value);
  scheduleSave();
  render();
}
function removeAdaptation(item, tdIdx, adIdx){
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  const removed = td.adaptations[adIdx];
  td.adaptations.splice(adIdx, 1);
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function updateAdaptationText(item, tdIdx, adIdx, value){
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  const ad = td.adaptations[adIdx];
  if(!ad) return;
  const trimmed = value.trim();
  const old = ad.text || "";
  if(old === trimmed) return;
  ad.text = trimmed;
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation edited", old, trimmed);
  scheduleSave();
  render();
}
function renderPostedTitleBlock(item, td, idx){
  migrateAdaptations(td);
  const meta = [];
  if(td.genre) meta.push(["Genre", td.genre]);
  if(td.originalRun) meta.push(["Original Run", td.originalRun]);
  if(td.episodeCount) meta.push(["# of Episodes", escapeHtml(String(td.episodeCount))]);
  if(td.broadcaster) meta.push(["Broadcaster", td.broadcaster]);
  if(td.originalOrAdapted) meta.push(["Original or Adapted", escapeHtml(td.originalOrAdapted)]);
  if(td.originalOrAdapted === "Adapted" && td.basedOn) meta.push(["Based On", td.basedOn]);
  const block = el(`
    <div class="td-block td-posted">
      <div class="td-top">
        <div class="td-title-display">${td.title || "Untitled"}</div>
        <button class="btn btn-sm" data-role="edit">Edit</button>
      </div>
      ${td.logline ? `<div class="td-readonly-text">${td.logline}</div>` : ""}
      ${meta.length ? `<div class="td-readonly-meta">${meta.map(([label, value]) => `<span><span class="td-meta-label">${label}:</span> ${value}</span>`).join("")}</div>` : ""}
      ${td.adaptations.length ? `<div class="td-readonly-block"><span class="field-label">Adaptations</span><ul class="td-adaptations-list">${td.adaptations.map(ad => `<li>${ad.text}</li>`).join("")}</ul></div>` : ""}
      ${td.notes ? `<div class="td-readonly-block"><span class="field-label">Additional Notes</span><div class="td-readonly-text">${td.notes}</div></div>` : ""}
    </div>
  `);
  block.querySelector('[data-role="edit"]').onclick = () => setTitleDetailPosted(item, idx, false);
  return block;
}
function setTitleDetailPosted(item, idx, posted){
  migrateTitleDetails(item);
  const td = item.titleDetails[idx];
  if(!td) return;
  td.posted = posted;
  recordChange(item.id, "item", item.id, item.name, "titleDetails.posted", (td.title || "Title") + (posted ? " finished" : " reopened for editing"), "", "");
  scheduleSave();
  render();
}
function addTitleDetail(item){
  migrateTitleDetails(item);
  item.titleDetails.push({ id: uid("td"), title:"", logline:"", genre:"", originalOrAdapted:"", episodeCount:"", basedOn:"", originalRun:"", broadcaster:"", adaptations:[], notes:"", posted:false });
  recordChange(item.id, "item", item.id, item.name, "titleDetails", "Title added", "", "");
  scheduleSave();
  render();
}
function removeTitleDetail(item, idx){
  migrateTitleDetails(item);
  const removed = item.titleDetails[idx];
  item.titleDetails.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "titleDetails", "Title removed", (removed && removed.title) || "", "");
  scheduleSave();
  render();
}
function updateTitleDetail(item, idx, key, value){
  migrateTitleDetails(item);
  const td = item.titleDetails[idx];
  if(!td) return;
  const old = td[key] || "";
  if(old === value) return;
  td[key] = value;
  recordChange(item.id, "item", item.id, item.name, "titleDetails." + idx + "." + key, "Title " + key, old, value);
  scheduleSave();
  render();
}

function renderNotesPanel(item){
  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><h2>Additional Notes</h2></div></div>
      <div class="panel-pad">
        <div id="f-notes-holder"></div>
      </div>
    </div>
  `);
  const notes = createRichTextEditor(item.notes, "", 60);
  panel.querySelector("#f-notes-holder").appendChild(notes.wrap);
  bindCommitRich(notes.editable, v => updateItemField(item, "notes", v));
  return panel;
}

function renderChangeRow(c, showItemName){
  const item = STATE.data.items.find(i=>i.id===c.itemId);
  const when = (() => {
    try{
      const d = new Date(c.changedAt);
      const month = new Intl.DateTimeFormat("en-US", { month:"short" }).format(d);
      const day = String(d.getDate()).padStart(2, "0");
      return `${month}. ${day}, ${d.getFullYear()}`;
    }catch(e){ return "—"; }
  })();
  const isDate = ISO_DATE.test(c.oldValue) || ISO_DATE.test(c.newValue);
  const delta = c.oldValue && c.newValue
    ? `${isDate ? fmtDateShort(c.oldValue) : escapeHtml(c.oldValue)} → ${isDate ? fmtDateShort(c.newValue) : escapeHtml(c.newValue)}`
    : (c.newValue ? escapeHtml(c.newValue) : "");
  const revertible = canRevertChange(c);
  const row = el(`
    <div class="change-row">
      <div class="change-time">${when}</div>
      <div class="change-body">
        ${showItemName && item ? `<b>${escapeHtml(item.name)}</b> — ` : ""}${escapeHtml(c.fieldLabel || c.field)}
        ${delta ? `<div class="change-delta">${delta}</div>` : ""}
        ${c.note ? `<div class="kv-sub" style="margin-top:2px;">${escapeHtml(c.note)}</div>` : ""}
      </div>
      ${revertible ? `<button class="btn btn-ghost btn-sm change-revert" data-role="revert">↺ Revert</button>` : ""}
    </div>
  `);
  if(revertible){
    row.querySelector('[data-role="revert"]').onclick = () => revertChange(c);
  }
  return row;
}

/* ---- New item modal -------------------------------------------------------- */
function renderNewItemModal(){
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h3>New item</h3>
        <span class="field-label">Name</span>
        <input class="text-input" id="m-name" placeholder="e.g. Rearview — feature rights" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="m-cancel">Cancel</button>
          <button class="btn btn-primary" id="m-create">Create item</button>
        </div>
      </div>
    </div>
  `);
  backdrop.querySelector("#m-cancel").onclick = () => { STATE.modal = null; render(); };
  backdrop.addEventListener("click", (e) => { if(e.target === backdrop){ STATE.modal = null; render(); } });
  backdrop.querySelector("#m-create").onclick = () => {
    const name = backdrop.querySelector("#m-name").value.trim();
    if(!name) return;
    const now = new Date().toISOString();
    const item = {
      id: uid("itm"), name, owner: "", currentPhase: "Found Estate Contact", status: "",
      summary: "", notes: "",
      target_found_contact:"", target_contacted_estate:"",
      target_rights_secured:"", stepNotes:{}, stepActuals:{}, customSteps:[], removedPresetSteps:[], stepPending:{}, stepLabelOverrides:{}, todo:{stepRef:"",text:"",priority:false,assignee:""}, titles:[], estateContacts:[],
      titleDetails:[], createdAt: now, updatedAt: now,
    };
    STATE.data.items.push(item);
    recordChange(item.id, "item", item.id, item.name, "created", "Item created", "", name);
    STATE.modal = null;
    STATE.currentItemId = item.id;
    STATE.view = "detail";
    scheduleSave();
    render();
  };
  return backdrop;
}

/* =========================================================================
   ACCESS GATE — client-side only. This is a static HTML file with no
   server, so this cannot be real security (anyone can view source and
   read the password below); it's a casual "don't wander in by accident"
   gate, not access control for sensitive data.
   ========================================================================= */
const ACCESS_PASSWORD = "PGrights26";
function showAccessGate(onUnlock){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const gate = el(`
    <div class="access-gate">
      <div class="access-gate-card">
        <span class="mark" style="margin-bottom:14px;">PG</span>
        <h1 class="page-title" style="font-size:22px; margin:0 0 6px;">Playground Rights Initiative</h1>
        <div class="access-gate-sub">Enter the password to continue.</div>
        <input type="password" class="text-input" id="access-password" placeholder="Password" autocomplete="off" />
        <div class="access-gate-error" id="access-error" style="display:none;">Incorrect password — try again.</div>
        <button class="btn btn-primary" id="access-submit" style="width:100%; justify-content:center; margin-top:10px;">Unlock</button>
      </div>
    </div>
  `);
  app.appendChild(gate);
  const input = gate.querySelector("#access-password");
  const errorEl = gate.querySelector("#access-error");
  const attempt = () => {
    if(input.value === ACCESS_PASSWORD){
      onUnlock();
    }else{
      errorEl.style.display = "";
      input.value = "";
      input.focus();
    }
  };
  gate.querySelector("#access-submit").onclick = attempt;
  input.addEventListener("keydown", (e) => { if(e.key === "Enter") attempt(); });
  input.focus();
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  showAccessGate(async () => {
    document.getElementById("app").innerHTML = `<div class="empty">Loading…</div>`;
    STATE.data = await loadData();
    render();
  });
})();

})();
