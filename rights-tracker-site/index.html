<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playground — Phase Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF8F3;
    --panel: #FFFFFF;
    --panel-alt: #F5F2EA;
    --panel-raised: #EFEAdd;
    --ink: #16160f;
    --border: #16160f2b;
    --border-soft: #16160f18;
    --text: #17170f;
    --text-dim: #55554a;
    --text-faint: #8c8a78;
    --green: #3f8a5b;
    --green-bg: #3f8a5b1a;
    --amber: #b8791a;
    --amber-bg: #f4c65c33;
    --gold: #f2c14e;
    --gold-deep: #e0a92c;
    --red: #c2483c;
    --red-bg: #c2483c1a;
    --slate: #6b7280;
    --slate-bg: #6b72801a;
    --indigo: #3a3a2f;
    --indigo-bg: #16160f0f;
    --radius: 10px;
    --radius-lg: 18px;
    --shadow-hard: 5px 5px 0 var(--ink);
    --shadow-hard-sm: 3px 3px 0 var(--ink);
    --font-display: 'Space Grotesk', ui-sans-serif, sans-serif;
    --font-body: 'Inter', ui-sans-serif, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--gold); color: var(--ink); }
  a{ color: inherit; }
  button{ font-family: inherit; }
  input, select, textarea{ font-family: inherit; font-size: inherit; }

  #app{ max-width: 1280px; margin: 0 auto; padding: 0 28px 90px; }

  /* ---- Top nav ---- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding: 18px 0; border-bottom: 1.5px solid var(--ink); margin-bottom: 34px; flex-wrap:wrap;
  }
  .topnav-left{ display:flex; align-items:center; gap:34px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap: 11px; }
  .brand .mark{
    width: 38px; height:38px; border-radius: 9px; background: var(--ink);
    display:inline-flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size:14px; font-weight:700; color: var(--gold);
    flex-shrink:0;
  }
  .brand h1{ font-family: var(--font-display); font-size: 18px; font-weight:700; margin:0; letter-spacing: -0.01em;}
  .brand .sub{ color: var(--text-faint); font-size: 10.5px; font-family: var(--font-mono); letter-spacing:0.06em; text-transform:uppercase; }
  .nav-tabs{ display:flex; align-items:center; gap:26px; }
  .nav-tab{
    font-size:13.5px; font-weight:600; color: var(--text-faint); cursor:pointer; padding-bottom:6px;
    border-bottom: 2.5px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .nav-tab.active{ color: var(--ink); border-bottom-color: var(--gold); }
  .nav-tab:hover{ color: var(--ink); }
  .nav-tab .count{ background: var(--panel-raised); color: var(--text-dim); font-family:var(--font-mono); font-size:10.5px; padding:1px 6px; border-radius:100px; }
  .topnav-right{ display:flex; align-items:center; gap:16px; }
  .search-box{
    display:flex; align-items:center; gap:6px; background: var(--panel-alt); border:1.5px solid var(--border);
    border-radius: 100px; padding: 7px 14px; min-width: 200px;
  }
  .search-box input{ border:none; background:transparent; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color: var(--text-faint); }
  .updated-pill{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-dim); white-space:nowrap; font-family: var(--font-mono);}
  .updated-pill .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); flex-shrink:0; }
  .updated-pill.saving .dot{ background: var(--amber); }
  .avatar{
    width:32px; height:32px; border-radius:50%; background: var(--gold); color: var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family: var(--font-display);
    border: 1.5px solid var(--ink);
  }

  .btn{
    background: var(--panel); color: var(--text); border: 1.5px solid var(--ink);
    padding: 9px 16px; border-radius: 100px; cursor:pointer; font-size: 13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition: transform .1s, box-shadow .1s;
  }
  .btn:hover{ transform: translate(-1px,-1px); box-shadow: var(--shadow-hard-sm); }
  .btn-primary{ background: var(--gold); border-color: var(--ink); color: var(--ink); }
  .btn-primary:hover{ background: var(--gold-deep); }
  .btn-ghost{ background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; border-radius:8px;}
  .btn-ghost:hover{ background: var(--panel-alt); color: var(--text); transform:none; box-shadow:none; }
  .btn-sm{ padding: 6px 12px; font-size:12px; }
  .btn-danger{ color: var(--red); }

  .panel{ background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); }
  .panel + .panel{ margin-top: 18px; }
  .panel-pad{ padding: 20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px;
    border-bottom: 1.5px solid var(--ink);
  }
  .panel-head h2{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0; }
  .panel-head .eyebrow{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; display:block; margin-bottom:2px; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding: 4px 10px; border-radius: 100px;
    font-size: 11.5px; font-weight:700; font-family: var(--font-mono); letter-spacing: 0.01em;
    white-space: nowrap; border:1px solid transparent;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; }
  .badge-green{ background: var(--green-bg); color: var(--green); }
  .badge-green .dot{ background: var(--green); }
  .badge-yellow{ background: var(--amber-bg); color: var(--amber); }
  .badge-yellow .dot{ background: var(--amber); }
  .badge-red{ background: var(--red-bg); color: var(--red); }
  .badge-red .dot{ background: var(--red); }
  .badge-completed{ background: var(--slate-bg); color: var(--slate); }
  .badge-completed .dot{ background: var(--slate); }

  .pill{ font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius:100px; font-weight:600; }
  .pill-late{ background: var(--red-bg); color: var(--red); }
  .pill-move{ background: var(--panel-alt); color: var(--text-dim); border:1px solid var(--border); }
  .pill-onplan{ background: var(--panel-alt); color: var(--text-faint); }
  .pill-priority{ background: var(--gold); color: var(--ink); border:1px solid var(--ink); }
  .pill-pending{ background: var(--slate-bg); color: var(--slate); }

  /* ---- Header block ---- */
  .page-head{ margin-bottom: 26px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .page-head h1.page-title{ font-family: var(--font-display); font-size: 42px; font-weight:700; margin: 4px 0 8px; letter-spacing:-0.02em; }
  .page-head .page-sub{ color: var(--text-dim); font-size: 14.5px; max-width: 520px; }
  .page-head-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---- Item cards ---- */
  .item-card{
    background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); padding: 18px 20px;
    cursor:pointer; transition: transform .12s;
  }
  .item-card:hover{ transform: translate(-2px,-2px); box-shadow: var(--shadow-hard); }
  .item-card + .item-card{ margin-top: 12px; }
  .item-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; margin-bottom: 12px;}
  .item-title-block h3{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0 0 3px; }
  .item-meta{ color: var(--text-faint); font-size: 12.5px; }
  .item-meta .sep{ margin: 0 6px; opacity:.5; }
  .item-progress{ color: var(--text-dim); font-size: 12.5px; margin-top:4px; }
  .item-badges{ display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}

  .empty{ padding: 40px 20px; text-align:center; color: var(--text-faint); }
  .empty .big{ font-family: var(--font-display); color: var(--text-dim); font-size:15px; margin-bottom:4px; }

  /* ---- Slate timeline (shared axis, overview) ---- */
  .slate-legend{ display:flex; align-items:center; gap:16px; font-size:12px; color: var(--text-dim); }
  .slate-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .slate-legend .dot{ width:7px; height:7px; border-radius:50%; }
  .slate-nav{ display:flex; gap:8px; }
  .slate-timeline{ padding: 20px; overflow-x:auto; }
  .slate-axis{ position:relative; height: 26px; border-bottom: 1px solid var(--border); margin-bottom:6px; min-width: 640px; }
  .slate-axis .month{ position:absolute; top:0; border-left:1px solid var(--border); font-size:11px; font-family: var(--font-mono); color: var(--text-faint); padding-left:6px; height:100%; }
  .slate-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); min-width: 640px; cursor:pointer; }
  .slate-row:hover .slate-row-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
  .slate-row:last-child{ border-bottom:none; }
  .slate-row-label{ width: 190px; flex-shrink:0; display:flex; align-items:flex-start; gap:9px; }
  .slate-row-label .dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .slate-row-name{ font-weight:700; font-size:13.5px; }
  .slate-row-track{ position:relative; flex:1; height: 22px; }
  .slate-bar{ position:absolute; top:4px; height:14px; border-radius:100px; }
  .slate-today{ position:absolute; top:-11px; bottom:-11px; border-left: 1.5px dashed var(--ink); }

  /* ---- Detail timeline ---- */
  .timeline-wrap{ overflow-x:auto; padding-top: 4px; }
  .timeline{ position:relative; }
  .timeline-grid{ position:relative; height: 1px; }
  .timeline-track{ position:relative; height: 22px; margin-bottom: 5px; }
  .timeline-track:last-child{ margin-bottom:0; }
  .tl-bar{ position:absolute; top:4px; height:14px; border-radius:4px; }
  .tl-ghost{ position:absolute; top:4px; height:14px; border-radius:4px; border: 1.5px dashed; background:transparent; opacity:.6; }
  .tl-milestone{ position:absolute; top:2px; width:14px; height:14px; transform: translateX(-50%) rotate(45deg); border-radius:3px; }
  .tl-label{ position:absolute; top:4px; font-size:10.5px; font-family: var(--font-mono); color: var(--text-faint); white-space:nowrap; transform: translateX(4px); line-height:14px;}
  .tl-month{ position:absolute; top:0; bottom:0; border-left: 1px dashed var(--border); font-size: 9.5px; color: var(--text-faint); font-family: var(--font-mono); padding-left:3px;}
  .tl-today{ position:absolute; top:-6px; bottom:-6px; border-left: 1.5px solid var(--ink); }
  .tl-today::after{ content:'today'; position:absolute; top:-14px; left:3px; font-size:9px; color: var(--ink); font-family: var(--font-mono); }

  /* ---- Production pulse ---- */
  .pulse-row{ display:flex; align-items:center; justify-content:space-between; padding: 10px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
  .pulse-row:last-child{ border-bottom:none; }
  .pulse-row:hover .pulse-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .pulse-left{ display:flex; align-items:center; gap:9px; cursor:pointer; }
  .pulse-left .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pulse-name{ font-weight:700; font-size:13px; }
  .pulse-sub{ color: var(--text-faint); font-size:11px; margin-top:1px; }

  /* ---- To-do ---- */
  .todo-item{ border-bottom:1px solid var(--border-soft); }
  .todo-item:last-child{ border-bottom:none; }
  .todo-row{ display:flex; align-items:center; gap:12px; padding:10px 0; }
  .todo-check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink); background: var(--panel);
    cursor:pointer; flex-shrink:0; padding:0; transition: background .12s;
  }
  .todo-check:hover{ background: var(--gold); }
  .todo-star{
    background:none; border:none; color: var(--border); cursor:pointer; font-size:16px; line-height:1;
    padding:0; flex-shrink:0; transition: color .12s;
  }
  .todo-star:hover{ color: var(--gold); }
  .todo-star.active{ color: var(--gold); }
  .todo-body{ flex:1; cursor:pointer; min-width:0; }
  .todo-body:hover .todo-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .todo-name{ font-weight:700; font-size:13px; }
  .todo-step{ font-weight:500; color: var(--text-dim); }
  .todo-sub{ color: var(--text-faint); font-size:11px; margin-top:1px; font-family: var(--font-mono); }
  .todo-edit{
    flex-shrink:0; background:none; border:1px solid transparent; color: var(--text-faint); cursor:pointer;
    font-size:12px; padding:4px 6px; border-radius:6px;
  }
  .todo-edit:hover{ border-color: var(--border); color: var(--text); background: var(--panel-alt); }
  .todo-config{ padding:0 0 12px 32px; }
  .todo-config-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .todo-config-form .text-input{ flex:1; min-width:140px; }
  .todo-group-label{
    font-family: var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color: var(--text-faint); margin:16px 0 4px; font-weight:700;
  }
  .todo-group-label:first-child{ margin-top:0; }
  .todo-group-label-pending{ margin-top:22px; padding-top:14px; border-top:1.5px solid var(--ink); color: var(--slate); font-weight:600; }
  .todo-group-label-complete{ margin-top:22px; padding-top:14px; border-top:1.5px solid var(--ink); color: var(--green); font-weight:600; }
  .todo-complete-check{
    width:20px; height:20px; border-radius:6px; background: var(--green-bg); color: var(--green);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
  }

  /* ---- Detail view ---- */
  .back-link{ display:inline-flex; align-items:center; gap:6px; color: var(--text-dim); font-size:13px; cursor:pointer; margin-bottom:16px; font-weight:600;}
  .back-link:hover{ color: var(--text); }
  .detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom: 18px; flex-wrap:wrap;}
  .detail-title{ font-family: var(--font-display); font-size: 30px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em; background:transparent; border:none; color:var(--text); width:100%; padding:2px 0;}
  .detail-title:focus{ outline: none; border-bottom: 1.5px solid var(--gold); }
  .titles-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .title-tag{
    display:inline-flex; align-items:center; gap:6px; background: var(--panel-alt); border:1.5px solid var(--border);
    border-radius:100px; padding:4px 6px 4px 12px; font-size:12px; font-weight:500; color: var(--text-dim);
  }
  .title-tag button{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:14px; line-height:1; padding:2px 6px; border-radius:50%; }
  .title-tag button:hover{ background: var(--red-bg); color: var(--red); }
  .title-tag-add{ background:transparent; border-style:dashed; padding:4px 10px; }
  .title-tag-add input{ border:none; background:transparent; outline:none; color:var(--text); font-size:12px; width:100px; }
  .title-tag-add input::placeholder{ color: var(--text-faint); }
  .estate-contact-row{ margin-bottom:14px; }
  .estate-contact-row .field-label{ margin:0 0 6px; }
  .ec-contacts-row{ display:flex; flex-wrap:wrap; gap:0; }
  .ec-contact-block{ width:220px; flex:0 0 auto; padding:0 20px 0 0; margin:0 20px 10px 0; border-right:1px solid var(--border-soft); }
  .ec-contact-block:last-child{ border-right:none; padding-right:0; margin-right:0; }
  .ec-contact-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .ec-contact-index{ font-size:9.5px; color: var(--text-faint); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.05em; }
  .ec-remove{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:14px; line-height:1; padding:2px 6px; border-radius:50%; }
  .ec-remove:hover{ background: var(--red-bg); color: var(--red); }
  .pending-toggle{
    background:none; border:1px solid var(--border); color: var(--text-faint); cursor:pointer; font-size:12px;
    line-height:1; padding:5px 7px; border-radius:6px; flex-shrink:0;
  }
  .pending-toggle:hover{ border-color: var(--ink); color: var(--text); }
  .pending-toggle.active{ background: var(--slate-bg); border-color: var(--slate); color: var(--slate); }
  .step-block-pending{ opacity:.85; }
  .td-block{ padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--border-soft); }
  .td-block:last-of-type{ border-bottom:none; margin-bottom:10px; padding-bottom:0; }
  .td-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .td-title-input{ flex:1; background:transparent; border:none; border-bottom:1px dashed var(--border); font-family: var(--font-display); font-weight:600; font-size:14px; color: var(--text); padding:2px 2px; }
  .td-title-input:focus{ outline:none; border-bottom-color: var(--gold); }
  .td-title-input::placeholder{ color: var(--text-faint); font-weight:500; }
  .td-block.td-posted .td-top{ margin-bottom:8px; }
  .td-title-display{ flex:1; font-family: var(--font-display); font-weight:600; font-size:14px; color: var(--text); }
  .td-readonly-text{ font-size:13px; color: var(--text-dim); line-height:1.55; margin-bottom:8px; }
  .td-readonly-block{ margin-top:8px; }
  .td-readonly-block .field-label{ margin-bottom:4px; }
  .td-readonly-meta{ display:flex; flex-direction:column; gap:4px; font-size:13px; color: var(--text-dim); font-family: var(--font-mono); margin-bottom:4px; }
  .td-meta-label{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--text-faint); }
  .td-adaptations-list{ margin:0; padding-left:18px; font-size:13px; color: var(--text-dim); line-height:1.55; }
  .td-adaptations-list li{ margin-bottom:3px; }
  .td-adaptations-list li:last-child{ margin-bottom:0; }
  .ec-lines{ display:flex; flex-direction:column; gap:10px; max-width:300px; }
  .ec-line{ display:flex; align-items:center; gap:8px; min-height:20px; }
  .ec-line-label{ width:56px; flex-shrink:0; font-size:9.5px; color: var(--text-faint); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.05em; }
  .ec-line-input{
    flex:1; background:transparent; border:none; border-bottom:1px dashed var(--border); color: var(--text-dim);
    font-size:12px; font-family: inherit; padding:2px 2px; min-width:0; resize:none; overflow:hidden;
    white-space:pre-wrap; word-break:break-word; line-height:1.4;
  }
  .ec-line-input:focus{ outline:none; border-bottom-color: var(--gold); color: var(--text); }
  .ec-rich-holder{ flex:1; min-width:0; }
  .ec-line-rich .adaptation-rich{ flex:1; }
  .field-row{ display:flex; gap:10px; align-items:center; margin-bottom: 6px; flex-wrap:wrap;}
  .inline-input{ background: transparent; border:none; border-bottom: 1px dashed var(--border); color: var(--text-dim); font-size: 13px; padding: 2px 2px; }
  .inline-input:focus{ outline:none; border-bottom-color: var(--gold); color: var(--text); }

  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--text-faint); font-family: var(--font-mono); margin-bottom:5px; display:block;}
  textarea.freeform{
    width:100%; background: var(--panel-alt); border:1.5px solid var(--border); border-radius:9px; color:var(--text);
    padding:10px 12px; font-size:13px; resize: vertical; min-height:56px;
  }
  textarea.freeform:focus{ outline:none; border-color: var(--ink); }
  .rich-field{ width:100%; }
  div.rich-editable.freeform{
    width:100%; background: var(--panel-alt); border:1.5px solid var(--border); border-radius:9px; color:var(--text);
    padding:10px 12px; font-size:13px; overflow-y:auto;
  }
  div.rich-editable.freeform:focus{ outline:none; border-color: var(--ink); }
  div.rich-editable.freeform:empty::before{ content: attr(data-placeholder); color: var(--text-faint); }
  input.text-input, select.text-input, div.text-input{
    background: var(--panel-alt); border:1.5px solid var(--border); border-radius:9px; color:var(--text);
    padding:8px 10px; font-size:13px; width:100%;
  }
  input.date-input{
    background: var(--panel-alt); border:1.5px solid var(--border); border-radius:8px; color:var(--text);

<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   DATES — ported from dates.ts. Guarded: never throws, degrades to null/—.
   ========================================================================= */
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function isValidDate(value){
  if(!value || !ISO_DATE.test(value)) return false;
  const t = new Date(`${value}T12:00:00Z`).getTime();
  return !Number.isNaN(t);
}
function parseDate(value, utc){
  if(!isValidDate(value)) return null;
  const d = new Date(`${value}T12:00:00${utc ? "Z" : ""}`);
  return Number.isNaN(d.getTime()) ? null : d;
}
function todayISO(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}
// Guarded formatter — a bad date must never blank the page (see LESSONS.md).
// Canonical display format across the app: Mon. DD, YYYY (e.g. Aug. 14, 2026).
function fmtDate(value){
  try{
    const d = parseDate(value, true);
    if(!d) return "—";
    const month = new Intl.DateTimeFormat("en-US", { month:"short" }).format(d);
    const day = String(d.getUTCDate()).padStart(2, "0");
    const year = d.getUTCFullYear();
    return `${month}. ${day}, ${year}`;
  }catch(e){ return "—"; }
}
function fmtDateShort(value){
  return fmtDate(value);
}
/** Wraps a native <input type="date"> with a formatted, click-through display
 * span (see the .date-field CSS) so the visible text reads in our own format
 * instead of the browser's locale-default rendering. */
function wrapDateField(inputEl, value){
  const wrapper = document.createElement("div");
  wrapper.className = "date-field";
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const display = document.createElement("span");
  const valid = isValidDate(value);
  display.className = "date-field-display" + (valid ? "" : " placeholder");
  display.textContent = valid ? fmtDate(value) : "Select date";
  wrapper.appendChild(display);
  return wrapper;
}
function daysBetween(start, end){
  const a = parseDate(start, true), b = parseDate(end, true);
  if(!a || !b) return 0;
  return Math.max(0, Math.round((b.getTime() - a.getTime()) / 86400000));
}

  if(!d) return value;
  d.setUTCDate(d.getUTCDate() + n);

}

  const first = parseDate(start, true);
  if(!first || !isValidDate(end)) return [];
  const markers = [start];
  const cursor = new Date(first);
  cursor.setUTCDate(1);
  cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  while(cursor.toISOString().slice(0,10) < end){
    markers.push(cursor.toISOString().slice(0,10));
    cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  }
  if(markers.at(-1) !== end) markers.push(end);
  return markers;
}

/* =========================================================================
   SCHEDULE / VARIANCE — ported + generalised from schedule.ts.
   One derivation path: itemScheduleItems() is the only function that turns
   stored rows into bars. Every view (overview + detail) calls this and
   nothing else — see LESSONS.md "the overview and the detail page disagreed".
   ========================================================================= */

// [field, label while unfinished (no actual date yet), label once completed]
const STEP_FIELDS = [
  ["target_found_contact", "Find Estate Contact", "Found Estate Contact"],
  ["target_contacted_estate", "Contact Estate", "Contacted Estate"],
  ["target_rights_secured", "Secure Rights", "Rights Secured"],
];
/** Per-item rename of a preset step — overrides the tensed default below. */
function migrateStepLabelOverrides(item){
  if(!item.stepLabelOverrides || typeof item.stepLabelOverrides !== "object") item.stepLabelOverrides = {};
}
function updateStepLabelOverride(item, field, value){
  migrateStepLabelOverrides(item);
  const trimmed = (value || "").trim();
  const old = item.stepLabelOverrides[field] || "";
  const defaultLabel = defaultStepLabel(item, field);
  if(trimmed === old) return;
  if(!trimmed || trimmed === defaultLabel){
    delete item.stepLabelOverrides[field];
  }else{
    item.stepLabelOverrides[field] = trimmed;
  }
  recordChange(item.id, "item", item.id, item.name, "stepLabel", "Step renamed", old || defaultLabel, trimmed || defaultLabel);
  scheduleSave();
  render();
}
/** The tensed default label, ignoring any override — used as the fallback
 * and to detect when a rename just matches the default (no override needed). */
function defaultStepLabel(item, field){
  const entry = STEP_FIELDS.find(f => f[0] === field);
  if(!entry) return field;
  const done = Boolean(item && item.stepActuals && item.stepActuals[field]);
  return done ? entry[2] : entry[1];
}
/** The label for a step: a per-item rename if one exists, otherwise the
 * default, tensed to whether it's been marked done on this item. */
function stepLabel(item, field){
  migrateStepLabelOverrides(item);
  if(item.stepLabelOverrides[field]) return item.stepLabelOverrides[field];
  return defaultStepLabel(item, field);
}

const STATUS_RANK = { green:0, completed:0, yellow:1, red:2 };
function worseStatus(a, b){
  if(!a) return b; if(!b) return a;
  return STATUS_RANK[b] > STATUS_RANK[a] ? b : a;
}

/** Derived (auto) health: worst of real lateness and confirmed movement across the steps (rule 3.3). */
function autoHealth(data, item){
  let worst = "green";
  const late = itemLateness(data, item);
  if(late !== null){
    if(late >= 7) worst = worseStatus(worst, "red");
    else if(late >= 1) worst = worseStatus(worst, "yellow");
  }
  const slip = itemSlip(data, item);
  if(slip !== null && slip > 0){
    if(slip >= 21) worst = worseStatus(worst, "red");
    else if(slip >= 7) worst = worseStatus(worst, "yellow");
  }
  return worst;
}
/** item.status is a manual override; '' / null means "derive it" (see schema comment). */
function itemHealth(data, item){
  return item.status || autoHealth(data, item);
}

const STEP_BAR_LABELS = { "step-1-2": "Outreach", "step-2-3": "Finalizing" };

/** Canonical list of bars + milestones for one item. Malformed dates are simply not drawn. */
function itemScheduleItems(data, item){
  const health = itemHealth(data, item);
  const rightsSecuredActual = item.stepActuals && item.stepActuals.target_rights_secured;
  const out = [
    { id: "step-1-2", label: STEP_BAR_LABELS["step-1-2"], start: item.target_found_contact, end: item.target_contacted_estate, health },
    { id: "step-2-3", label: STEP_BAR_LABELS["step-2-3"], start: item.target_contacted_estate, end: item.target_rights_secured, health },
    { id: "rights-secured", label: stepLabel(item, "target_rights_secured"), start: item.target_rights_secured, end: item.target_rights_secured, health: rightsSecuredActual ? "completed" : health, milestone: true },
  ];
  return out.filter(i => isValidDate(i.start) && isValidDate(i.end));
}

function latestBaseline(data, entityId, field){
  const rows = data.baselines.filter(b => b.entityId === entityId && b.field === field);
  if(!rows.length) return null;
  return rows.reduce((best, r) => r.generation > best.generation ? r : best, rows[0]);
}
/** Movement is only meaningful once a human acknowledges it (rule 3.2). Silent otherwise. */
function slipDays(data, entityId, field, currentDate){
  if(!currentDate) return null;
  const b = latestBaseline(data, entityId, field);
  if(!b || !b.acknowledged) return null;
  const cur = parseDate(currentDate, true), base = parseDate(b.baselineDate, true);
  if(!cur || !base) return null;
  return Math.round((cur.getTime() - base.getTime()) / 86400000);
}
function ghostBaselineDate(data, entityId, field){
  const b = latestBaseline(data, entityId, field);
  return (b && b.acknowledged) ? b.baselineDate : null;
}
function itemSlip(data, item){
  migrateRemovedPresetSteps(item);
  const slips = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => slipDays(data, item.id, field, item[field]))
    .filter(v => v !== null);
  if(!slips.length) return null;
  return slips.reduce((worst, v) => v > worst ? v : worst, slips[0]);
}
/** Actual vs target, per step. Real lateness — always shown, never needs interpretation. */
function latenessDays(actual, target){
  const a = parseDate(actual, true), t = parseDate(target, true);
  if(!a || !t) return null;
  return Math.round((a.getTime() - t.getTime()) / 86400000);
}
function stepLateness(item, field){
  const actual = item.stepActuals && item.stepActuals[field];
  return latenessDays(actual, item[field]);
}
/** Worst real lateness across a item's steps — the "actual" half of rule 3.3. Includes custom steps. */
function itemLateness(data, item){
  migrateCustomSteps(item);
  migrateRemovedPresetSteps(item);
  const presetValues = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => stepLateness(item, field));
  const customValues = item.customSteps.map(cs => latenessDays(cs.actual, cs.target));
  const values = [...presetValues, ...customValues].filter(v => v !== null && v > 0);
  if(!values.length) return null;
  return Math.max(...values);
}
function formatSlip(slip){
  if(slip === null || slip === undefined) return "";
  if(slip === 0) return "on plan";
  return `${slip > 0 ? "+" : "\u2212"}${Math.abs(slip)}d`;
}
/** The free-text "current stage" the item owner sets themselves — see the header field. */
function progressLabel(data, item){
  return item.currentPhase || "Not started";
}
function migrateTodoConfig(item){
  if(!item.todo || typeof item.todo !== "object") item.todo = { stepRef: "", text: "", priority: false, assignee: "" };
  if(item.todo.stepRef === undefined) item.todo.stepRef = "";
  if(item.todo.text === undefined) item.todo.text = "";
  if(item.todo.priority === undefined) item.todo.priority = false;
  if(item.todo.assignee === undefined) item.todo.assignee = "";
}
/** item.stepPending maps a step ref (preset field name or custom step id) to
 * the ISO date it was marked "waiting on a response". Presence = pending. */
function migratePendingSteps(item){
  if(!item.stepPending || typeof item.stepPending !== "object") item.stepPending = {};
}
function isPending(item, ref){
  migratePendingSteps(item);
  return Boolean(item.stepPending[ref]);
}
function pendingSinceDate(item, ref){
  migratePendingSteps(item);
  return item.stepPending[ref] || null;
}
function pendingDays(item, ref){
  const since = pendingSinceDate(item, ref);
  return since ? daysBetween(since, todayISO()) : null;
}
/** The notes recorded against one specific step, whether preset or custom. */
function getStepNotesByRef(item, ref){
  if(STEP_FIELDS.some(f => f[0] === ref)){
    migrateStepNotes(item);
    return item.stepNotes[ref] || [];
  }
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === ref);
  return (cs && cs.notes) || [];
}
/** Most recent dated note on a step — stands in for "the date of the event"
 * (e.g. when an email was actually sent) rather than whenever someone
 * happens to flip the pending toggle. */
function latestStepNoteDate(notes){
  let best = null;
  for(const n of (notes || [])){
    if(n.date && isValidDate(n.date) && (!best || n.date > best)) best = n.date;
  }
  return best;
}
function togglePending(item, ref, label){
  migratePendingSteps(item);
  if(item.stepPending[ref]){
    delete item.stepPending[ref];
    recordChange(item.id, "item", item.id, item.name, "pending", label + " no longer pending", "pending", "");
  }else{
    // Default the clock to the most recent dated note on this step (the
    // actual event — e.g. when the email went out), not today, since those
    // can be days apart. Still adjustable afterward.
    const eventDate = latestStepNoteDate(getStepNotesByRef(item, ref)) || todayISO();
    item.stepPending[ref] = eventDate;
    recordChange(item.id, "item", item.id, item.name, "pending", label + " marked pending", "", "waiting since " + eventDate);

  render();

  migratePendingSteps(item);
  if(!item.stepPending[ref]) return;
  const old = item.stepPending[ref];
  const next = value || todayISO();
  if(old === next) return;
  item.stepPending[ref] = next;
  recordChange(item.id, "item", item.id, item.name, "pendingSince", label + " pending since", old, next);

  render();

const PENDING_FOLLOWUP_DAYS = 14;

 * true if it just expired (the caller may want to react, e.g. by setting
 * the item's to-do text to "Follow Up"). */

  migratePendingSteps(item);
  const since = item.stepPending[ref];
  if(!since) return false;
  if(daysBetween(since, todayISO()) < PENDING_FOLLOWUP_DAYS) return false;

  recordChange(item.id, "item", item.id, item.name, "pending", "Pending expired after " + PENDING_FOLLOWUP_DAYS + " days with no update", "pending", "");

function seqEntryRef(entry){ return entry.kind === "preset" ? entry.field : entry.custom.id; }
function seqEntryLabel(item, entry){ return entry.kind === "preset" ? stepLabel(item, entry.field) : entry.custom.label; }
function seqEntryTarget(item, entry){ return entry.kind === "preset" ? item[entry.field] : entry.custom.target; }
function seqEntryActual(item, entry){ return entry.kind === "preset" ? (item.stepActuals && item.stepActuals[entry.field]) : entry.custom.actual; }
/** The featured to-do step for an item: whichever step is currently pending
 * (waiting on a response) takes priority, since that's the most actionable
 * state to surface — otherwise whichever the user has pinned
 * (item.todo.stepRef), or — by default — the first step in the full
 * sequence (presets + custom steps) with no actual date yet. */
function computeNextStep(item){
  migrateTodoConfig(item);
  const seq = buildStepSequence(item);
  let chosen = seq.find(e => isPending(item, seqEntryRef(e))) || null;
  if(!chosen && item.todo.stepRef){
    chosen = seq.find(e => seqEntryRef(e) === item.todo.stepRef) || null;
  }
  if(!chosen){
    chosen = seq.find(e => !seqEntryActual(item, e)) || null;
  }
  if(!chosen) return null;
  const ref = seqEntryRef(chosen);
  return {
    ref,
    label: seqEntryLabel(item, chosen),
    target: seqEntryTarget(item, chosen),
    text: item.todo.text || "",
    priority: Boolean(item.todo.priority),
    assignee: item.todo.assignee || "",
    pending: isPending(item, ref),
    pendingDays: pendingDays(item, ref),
  };
}
/** Marks whichever step a to-do ref points to (preset or custom) as done today. */
function markStepDoneByRef(item, ref, doneDate){
  const isPreset = STEP_FIELDS.some(f => f[0] === ref);
  if(isPreset){
    if(!item.stepActuals) item.stepActuals = {};
    const old = item.stepActuals[ref] || "";
    item.stepActuals[ref] = doneDate;
    const label = stepLabel(item, ref);
    recordChange(item.id, "item", item.id, item.name, ref + "Actual", label + " actual date", old, doneDate, "Marked done from the to-do list.");
    const late = stepLateness(item, ref);
    if(late && late > 0) checkKnockOnFromLateness(item.id, ref, late, label);
  }else{
    migrateCustomSteps(item);
    const cs = item.customSteps.find(c => c.id === ref);
    if(!cs) return;
    const old = cs.actual || "";
    cs.actual = doneDate;
    recordChange(item.id, "item", item.id, item.name, "customStep.actual", cs.label + " actual date", old, doneDate, "Marked done from the to-do list.");
  }
}
function updateTodoConfig(item, key, value){
  migrateTodoConfig(item);
  const old = item.todo[key] || "";
  if(old === value) return;
  item.todo[key] = value;
  recordChange(item.id, "item", item.id, item.name, "todo." + key, "To-do " + key, old, value);
  scheduleSave();
  renderOverviewInPlace();
}
function toggleTodoPriority(item){
  migrateTodoConfig(item);
  const next = !item.todo.priority;
  item.todo.priority = next;
  recordChange(item.id, "item", item.id, item.name, "todo.priority", "To-do priority", String(!next), String(next));
  scheduleSave();
  renderOverviewInPlace();
}

const STATE = {

  view: "overview",        // overview | detail
  tab: "overview",         // overview | timeline | todo | changes  (top-nav tab, only meaningful in overview)
  currentItemId: null,
  pendingDecision: null,    // {itemId, entity, entityId, field, fieldLabel, oldValue, newValue}

  modal: null,              // 'new-item' | null
  search: "",
  slateOffsetMonths: 0,     // Earlier / Today / Later paging on the slate timeline
  toast: null,
};

function uid(prefix){
  return prefix + "_" + Math.random().toString(36).slice(2, 10);
}

function recordChange(itemId, entity, entityId, label, field, fieldLabel, oldValue, newValue, note){
  STATE.data.changes.unshift({
    id: uid("ch"), itemId, entity, entityId, label, field, fieldLabel,
    oldValue: oldValue == null ? "" : String(oldValue),
    newValue: newValue == null ? "" : String(newValue),
    changedBy: "You", changedAt: new Date().toISOString(), note: note || "",
  });
}

/* ---- Revert (Changes tab) --------------------------------------------
 * Supported only where the log entry unambiguously identifies a single
 * settable value — a step's target date, a step's actual date, a plain
 * item field (name/notes/status), a to-do config field, or a title tag.
 * Everything else (notes by list position, custom-step edits, additions/
 * removals that don't carry the full removed object, knock-on summaries)
 * isn't offered a Revert button, rather than risk silently corrupting
 * data on a guess. */
function isStepFieldKey(field){
  return STEP_FIELDS.some(f => f[0] === field);
}
function canRevertChange(c){
  if(c.entity === "system") return false;
  if(!STATE.data.items.some(i => i.id === c.itemId)) return false;
  if(isStepFieldKey(c.field)) return true;
  if(c.field.endsWith("Actual") && isStepFieldKey(c.field.slice(0, -"Actual".length))) return true;
  if(c.field === "name" || c.field === "notes" || c.field === "status") return true;
  if(c.field.startsWith("todo.")) return true;
  if(c.field === "titles") return true;
  return false;
}
function applyRevertChange(c){
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!item) return false;
  if(isStepFieldKey(c.field)){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.endsWith("Actual")){
    const key = c.field.slice(0, -"Actual".length);
    if(isStepFieldKey(key)){
      if(!item.stepActuals) item.stepActuals = {};
      item.stepActuals[key] = c.oldValue || null;
      return true;
    }
  }
  if(c.field === "name" || c.field === "notes" || c.field === "status"){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.startsWith("todo.")){
    migrateTodoConfig(item);
    const key = c.field.slice("todo.".length);
    if(key === "priority") item.todo.priority = c.oldValue === "true";
    else item.todo[key] = c.oldValue || "";
    return true;
  }
  if(c.field === "titles"){
    if(!Array.isArray(item.titles)) item.titles = [];
    if(c.newValue && !c.oldValue){
      const idx = item.titles.indexOf(c.newValue);
      if(idx !== -1) item.titles.splice(idx, 1);
    }else if(c.oldValue && !c.newValue){
      item.titles.push(c.oldValue);
    }
    return true;
  }
  return false;
}
function revertChange(c){
  if(!canRevertChange(c)) return;
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!applyRevertChange(c)) return;
  recordChange(c.itemId, "item", c.itemId, item.name, c.field, c.fieldLabel, c.newValue, c.oldValue, "Reverted a previous change.");
  scheduleSave();
  render();
}

/* ---- baseline-aware step update (rule 3.2) ------------------------- */
function beginMilestoneUpdate(itemId, entity, entityId, field, fieldLabel, label, newValue){
  const container = STATE.data.items.find(i=>i.id===entityId);
  const oldValue = container[field];
  if(oldValue === newValue) return;
  if(!isValidDate(newValue)){
    // still allow clearing/typo entry to fail safe — just ignore malformed input
    return;
  }
  const existingBaseline = latestBaseline(STATE.data, entityId, field);
  if(!existingBaseline){
    // first time this step is ever set — becomes its own baseline, no prompt needed.
    container[field] = newValue;
    STATE.data.baselines.push({
      id: uid("bl"), itemId, entity, entityId, field, baselineDate: newValue,
      generation: 1, acknowledged: false, setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(itemId, entity, entityId, label, field, fieldLabel, oldValue, newValue, "Baseline set.");
    scheduleSave();
    render();
    return;
  }
  // A baseline already exists — this is a genuine moved date. Ask.
  STATE.pendingDecision = { itemId, entity, entityId, field, fieldLabel, label, oldValue, newValue };
  render();
}
function resolveDecision(kind){
  const d = STATE.pendingDecision;
  if(!d) return;
  const container = STATE.data.items.find(i=>i.id===d.entityId);
  container[d.field] = d.newValue;

  if(kind === "delay"){
    const b = latestBaseline(STATE.data, d.entityId, d.field);
    b.acknowledged = true;
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Confirmed as a delay against baseline.");
    STATE.pendingDecision = null;
    checkKnockOn(d.itemId, d.field, d.oldValue, d.newValue, d.fieldLabel);
    scheduleSave();
    render();
    return;
  }else if(kind === "replan"){
    const prev = latestBaseline(STATE.data, d.entityId, d.field);
    STATE.data.baselines.push({
      id: uid("bl"), itemId: d.itemId, entity: d.entity, entityId: d.entityId, field: d.field,
      baselineDate: d.newValue, generation: (prev ? prev.generation : 0) + 1, acknowledged: false,
      setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Revised plan — new baseline set.");
  }else if(kind === "cancel"){
    STATE.pendingDecision = null;
    render();
    return;
  }
  STATE.pendingDecision = null;
  scheduleSave();
  render();
}

/* ---- knock-on proposal (rule 3.4: propose, never apply) -----------------
 * Triggered two ways: a step move confirmed as a delay, or a step's actual
 * date landing after its target (real lateness). Either way, offers to
 * shift the steps still downstream by the same number of days. */
function checkKnockOn(itemId, field, oldValue, newValue, fieldLabel){
  const shiftDays = daysBetween(oldValue, newValue);
  if(!shiftDays) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays: shiftDays, referenceLabel: fieldLabel };
}
function checkKnockOnFromLateness(itemId, field, lateDays, fieldLabel){
  if(!lateDays || lateDays <= 0) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays, referenceLabel: fieldLabel };
}
function resolveKnockOn(kind){
  const k = STATE.pendingKnockOn;
  if(!k) return;
  const item = STATE.data.items.find(i=>i.id===k.itemId);
  if(kind === "shift"){
    for(const field of k.downstream){
      const old = item[field];
      if(!isValidDate(old)) continue;
      const next = addDaysISO(old, k.lateDays);
      const prevBaseline = latestBaseline(STATE.data, item.id, field);
      item[field] = next;
      STATE.data.baselines.push({
        id: uid("bl"), itemId: item.id, entity:"item", entityId:item.id, field,
        baselineDate: next, generation: (prevBaseline ? prevBaseline.generation : 0) + 1,
        acknowledged: false, setAt: new Date().toISOString(), setBy: "knock-on", note: "",
      });
      recordChange(item.id, "item", item.id, item.name, field, stepLabel(item, field), old, next, `Shifted +${k.lateDays}d after ${k.referenceLabel} slipped.`);
    }
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "shifted", `${k.referenceLabel} slipped ${k.lateDays}d — remaining steps shifted +${k.lateDays}d.`);
  }else if(kind === "manual"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "manual", `${k.referenceLabel} slipped ${k.lateDays}d — left for manual adjustment.`);
  }else if(kind === "leave"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "declined", `${k.referenceLabel} slipped ${k.lateDays}d — dates left as planned.`);
  }
  STATE.pendingKnockOn = null;
  scheduleSave();
  render();
}

   RENDER — full-panel re-render on commit (change/blur), never mid-keystroke.
   Free-text fields commit on blur so a rerender never fights an active edit
   (see LESSONS.md "a background refresh ate what someone was typing").
   ========================================================================= */
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function badgeHtml(status, label){
  const cls = status === "completed" ? "completed" : (status || "green");
  return `<span class="badge badge-${cls}"><span class="dot"></span>${label || (status==="completed" ? "Completed" : cls[0].toUpperCase()+cls.slice(1))}</span>`;
}

function renderTodoPanel(items){
  const today = todayISO();
  // Expire any stale pending (14+ days, no update) on each item's featured
  // step before building rows, so it falls back into the To-Do list with a
  // "Follow Up" prompt instead of sitting in Pending forever.
  let anyExpired = false;
  const rows = [];
  const completeItems = [];
  for(const item of items){
    if(item.stepActuals && item.stepActuals.target_rights_secured){
      completeItems.push(item);
      continue;
    }
    let next = computeNextStep(item);
    if(!next) continue;
    if(next.pending && expireStalePending(item, next.ref)){
      migrateTodoConfig(item);
      item.todo.text = "Follow Up";
      anyExpired = true;
      next = computeNextStep(item);
    }
    rows.push({ item, next });
  }
  if(anyExpired) scheduleSave();

  const pendingRows = rows.filter(r => r.next.pending);
  const activeRows = rows.filter(r => !r.next.pending);

  const sortRows = (arr) => arr.sort((a, b) => {
    if(a.next.priority !== b.next.priority) return a.next.priority ? -1 : 1;
    const aOverdue = isValidDate(a.next.target) && a.next.target < today;
    const bOverdue = isValidDate(b.next.target) && b.next.target < today;
    if(aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    const aT = isValidDate(a.next.target) ? a.next.target : "9999-99-99";
    const bT = isValidDate(b.next.target) ? b.next.target : "9999-99-99";
    return aT < bT ? -1 : aT > bT ? 1 : 0;
  });

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><h2>To-Do</h2></div></div>
      <div class="panel-pad" id="todo-list"></div>
    </div>
  `);
  const list = panel.querySelector("#todo-list");
  if(!rows.length && !completeItems.length){
    list.appendChild(el(`<div class="section-note">Nothing outstanding yet.</div>`));
    return panel;
  }

  if(!activeRows.length && !pendingRows.length){
    list.appendChild(el(`<div class="section-note">Nothing outstanding — everything else has wrapped up below.</div>`));
  }

  // Group by assignee, "Unassigned" last, everyone else alphabetically.
  const groups = new Map();
  for(const r of activeRows){
    const person = r.next.assignee.trim() || "Unassigned";
    if(!groups.has(person)) groups.set(person, []);
    groups.get(person).push(r);
  }
  const people = [...groups.keys()].sort((a, b) => {
    if(a === "Unassigned") return 1;
    if(b === "Unassigned") return -1;
    return a.localeCompare(b);
  });

  for(const person of people){
    list.appendChild(el(`<div class="todo-group-label">${escapeHtml(person)}</div>`));
    for(const { item, next } of sortRows(groups.get(person))){
      list.appendChild(renderTodoRow(item, next, today, false));
    }
  }

  if(pendingRows.length){
    list.appendChild(el(`<div class="todo-group-label todo-group-label-pending">Pending — Awaiting Response</div>`));
    pendingRows.sort((a, b) => (b.next.pendingDays || 0) - (a.next.pendingDays || 0));
    for(const { item, next } of pendingRows){
      list.appendChild(renderTodoRow(item, next, today, true));
    }
  }

  if(completeItems.length){
    list.appendChild(el(`<div class="todo-group-label todo-group-label-complete">Complete — Rights Secured</div>`));
    completeItems.sort((a, b) => {
      const aD = a.stepActuals.target_rights_secured, bD = b.stepActuals.target_rights_secured;
      return aD < bD ? 1 : aD > bD ? -1 : 0; // most recently secured first
    });
    for(const item of completeItems){
      list.appendChild(renderTodoCompleteRow(item));
    }
  }
  return panel;
}

  const row = el(`

        <div class="todo-body" data-role="open">

function renderTodoRow(item, next, today, isPendingRow){
  const overdue = isValidDate(next.target) && next.target < today;
  let subLine;
  if(isPendingRow){
    const d = next.pendingDays || 0;
    subLine = `Waiting ${d} day${d === 1 ? "" : "s"} — follow up at ${PENDING_FOLLOWUP_DAYS}`;
  }else if(next.text){
    subLine = escapeHtml(next.text);
  }else if(isValidDate(next.target)){
    subLine = `Target ${fmtDateShort(next.target)}`;

  const row = el(`

/** Shared-axis timeline: every row plots against the SAME month scale, unlike
 * the per-item detail timeline. One bar per item (its overall footprint),
 * coloured by derived health — see itemHealth(). */
function buildSlateTimeline(items){
  const windowStart = addDaysISO(todayISO(), -35 + STATE.slateOffsetMonths*30);
  const windowEnd = addDaysISO(todayISO(), 150 + STATE.slateOffsetMonths*30);
  const totalDays = Math.max(1, daysBetween(windowStart, windowEnd));
  const pct = (dateStr) => Math.min(100, Math.max(0, (daysBetween(windowStart, dateStr) / totalDays) * 100));

  const wrap = el(`<div></div>`);
  const axis = el(`<div class="slate-axis"></div>`);
  for(const m of timelineMarkers(windowStart, windowEnd)){
    if(m === windowStart) continue;
    const d = parseDate(m, true);
    if(!d) continue;
    const label = new Intl.DateTimeFormat("en-US",{month:"short", year:"2-digit"}).format(d);
    axis.appendChild(el(`<div class="month" style="left:${pct(m)}%">${label}</div>`));
  }
  wrap.appendChild(axis);

  if(!items.length){
    wrap.appendChild(el(`<div class="section-note" style="padding:16px 0;">No items match.</div>`));
    return wrap;
  }

  for(const item of items){
    const span = computeItemSpan(item);
    const health = itemHealth(STATE.data, item);
    const colorVar = health === "completed" ? "var(--slate)" : `var(--${health})`;
    const row = el(`
      <div class="slate-row">
        <div class="slate-row-label">
          <span class="dot" style="background:${colorVar}"></span>
          <div>
            <div class="slate-row-name">${escapeHtml(item.name)}</div>
          </div>
        </div>
        <div class="slate-row-track" data-track></div>
      </div>
    `);
    const track = row.querySelector("[data-track]");
    const today = todayISO();
    if(today >= windowStart && today <= windowEnd){
      track.appendChild(el(`<div class="slate-today" style="left:${pct(today)}%"></div>`));
    }
    if(span){
      const left = pct(span.start), width = Math.max(1, pct(span.end) - left);
      track.appendChild(el(`<div class="slate-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
    }
    row.onclick = () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
    wrap.appendChild(row);
  }
  return wrap;
}

/* ---- Timeline visualization (shared by overview + detail) --------------- */
function buildTimelineViz(item, bars, tall){
  if(!bars.length){
    return el(`<div class="section-note">No usable target dates yet — add step dates to see the timeline.</div>`);
  }
  const starts = bars.map(b=>b.start), ends = bars.map(b=>b.end);
  let min = starts.reduce((a,b)=> a<b?a:b);
  let max = ends.reduce((a,b)=> a>b?a:b);
  // pad range a little
  min = addDaysISO(min, -7);
  max = addDaysISO(max, 10);
  const totalDays = Math.max(1, daysBetween(min, max));
  const pct = (dateStr) => (daysBetween(min, dateStr) / totalDays) * 100;

  const markers = timelineMarkers(min, max);
  const wrap = el(`<div class="timeline"></div>`);
  const grid = el(`<div class="timeline-grid" style="height:${tall?14:12}px;"></div>`);
  for(const m of markers){
    if(m === min || m === max) continue;
    const d = parseDate(m, true);
    const label = d ? new Intl.DateTimeFormat("en-US",{month:"short"}).format(d) : "";
    grid.appendChild(el(`<div class="tl-month" style="left:${pct(m)}%">${label}</div>`));
  }
  const today = todayISO();
  if(today >= min && today <= max){
    grid.appendChild(el(`<div class="tl-today" style="left:${pct(today)}%"></div>`));
  }
  wrap.appendChild(grid);

  for(const bar of bars){
    const track = el(`<div class="timeline-track"></div>`);
    const colorVar = bar.health === "completed" ? "var(--slate)" : `var(--${bar.health || "green"})`;
    if(bar.milestone){
      const left = pct(bar.start);
      track.appendChild(el(`<div class="tl-milestone" style="left:${left}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left}%;">${escapeHtml(bar.label)}</div>`));
    }else{
      const left = pct(bar.start), width = Math.max(0.6, pct(bar.end) - pct(bar.start));
      track.appendChild(el(`<div class="tl-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left+width}%;">${escapeHtml(bar.label)}</div>`));
    }
    // ghost baseline — only ever shown when acknowledged (rule 3.2)
    if(item){
      const field = ITEM_BASELINE_FIELD_BY_BAR[bar.id];
      if(field){
        const ghost = ghostBaselineDate(STATE.data, item.id, field);
        if(ghost && ghost !== bar.start && ghost !== bar.end){
          const gLeft = pct(ghost);
          track.appendChild(el(`<div class="tl-ghost" style="left:${gLeft}%; width:${bar.milestone?0:Math.max(0.6, pct(bar.end)-gLeft)}%; border-color:${colorVar};"></div>`));
        }
      }
    }
    wrap.appendChild(track);
  }
  return wrap;
}

  "step-1-2": "target_found_contact",
  "step-2-3": "target_contacted_estate",
  "rights-secured": "target_rights_secured",
};

function bindCommit(inputEl, onCommit){
  let committed = inputEl.value;
  inputEl.addEventListener("blur", () => {
    if(inputEl.value !== committed){ committed = inputEl.value; onCommit(inputEl.value); }
  });
  inputEl.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); inputEl.blur(); } });
}

/* ---- Minimal rich text (bold/italic only) --------------------------------
 * A contenteditable div with a two-button toolbar, standing in for
 * textarea.freeform wherever bold/italic emphasis is useful (loglines,
 * rights notes, summary/notes). Content is stored as sanitized HTML,
 * restricted to <b>/<strong>/<i>/<em>/<br> — nothing else survives a commit. */
function sanitizeRichHTML(html){
  const allowedInline = new Set(["B", "STRONG", "I", "EM", "BR"]);
  const container = document.createElement("div");
  container.innerHTML = html;
  function walk(node){
    const frag = document.createDocumentFragment();
    node.childNodes.forEach(child => {
      if(child.nodeType === Node.TEXT_NODE){
        frag.appendChild(document.createTextNode(child.textContent));
      }else if(child.nodeType === Node.ELEMENT_NODE){
        const tag = child.tagName;
        if(allowedInline.has(tag)){
          const clean = document.createElement(tag);
          clean.appendChild(walk(child));
          frag.appendChild(clean);
        }else if(tag === "DIV" || tag === "P"){
          if(frag.lastChild) frag.appendChild(document.createElement("br"));
          frag.appendChild(walk(child));
        }else{
          frag.appendChild(walk(child)); // unwrap anything else, keep its text/inline content
        }
      }
    });
    return frag;
  }
  const out = document.createElement("div");
  out.appendChild(walk(container));
  return out.innerHTML;
}
function createRichTextEditor(initialHTML, placeholder, minHeight){
  const wrap = el(`
    <div class="rich-field">
      <div class="rich-editable freeform" contenteditable="true" data-placeholder="${escapeHtml(placeholder || "")}" style="min-height:${minHeight || 44}px;">${initialHTML || ""}</div>
    </div>
  `);
  const editable = wrap.querySelector(".rich-editable");
  // Browsers already bind Cmd/Ctrl+B and Cmd/Ctrl+I natively on contenteditable,
  // but handle it explicitly too so bold/italic work reliably with no visible
  // toolbar button to trigger them.
  editable.addEventListener("keydown", (e) => {
    if(!(e.metaKey || e.ctrlKey)) return;
    const key = e.key.toLowerCase();
    if(key === "b"){ e.preventDefault(); document.execCommand("bold", false, null); }
    else if(key === "i"){ e.preventDefault(); document.execCommand("italic", false, null); }
  });
  return { wrap, editable };
}
/** Single-line counterpart of createRichTextEditor — a contenteditable div
 * standing in for a plain <input>/<textarea> wherever bold/italic should be
 * available. className lets the caller reuse an existing input's look
 * (text-input, td-title-input, detail-title, ec-line-input, inline-input…).
 * Enter commits (blurs) instead of inserting a line break, matching how a
 * real single-line input behaves. */
function createRichTextLine(initialHTML, placeholder, className){
  const div = document.createElement("div");
  div.className = "rich-line" + (className ? " " + className : "");
  div.contentEditable = "true";
  if(placeholder) div.setAttribute("data-placeholder", placeholder);
  div.innerHTML = initialHTML || "";
  div.addEventListener("keydown", (e) => {
    if((e.metaKey || e.ctrlKey)){
      const key = e.key.toLowerCase();
      if(key === "b"){ e.preventDefault(); document.execCommand("bold", false, null); return; }
      if(key === "i"){ e.preventDefault(); document.execCommand("italic", false, null); return; }
    }
    if(e.key === "Enter"){ e.preventDefault(); div.blur(); }
  });
  return div;
}
function bindCommitRich(editableEl, onCommit){
  let committed = sanitizeRichHTML(editableEl.innerHTML);
  editableEl.addEventListener("blur", () => {
    const clean = sanitizeRichHTML(editableEl.innerHTML);
    if(clean !== committed){ committed = clean; onCommit(clean); }
  });
}
function updateItemField(item, field, value){
  const old = item[field];
  if(old === value) return;
  item[field] = value;
  item.updatedAt = new Date().toISOString();
  recordChange(item.id, "item", item.id, item.name, field, field, old, value);
  scheduleSave();
  render();
}

function migrateStepNotes(item){
  if(!item.stepNotes) item.stepNotes = {};
  for(const [field] of STEP_FIELDS){
    const val = item.stepNotes[field];
    if(val === undefined || val === null){
      item.stepNotes[field] = [];
    }else if(typeof val === "string"){
      // legacy single-note shape — migrate into a one-entry list
      item.stepNotes[field] = val ? [{ id: uid("sn"), text: escapeHtml(val), createdAt: item.createdAt || new Date().toISOString() }] : [];
    }
  }
}
function migrateCustomSteps(item){
  if(!Array.isArray(item.customSteps)) item.customSteps = [];
}
/** Preset steps a user has deleted for this item — hidden but not wiped
 * (their target/actual dates and history stay put, in case of restore). */
function migrateRemovedPresetSteps(item){
  if(!Array.isArray(item.removedPresetSteps)) item.removedPresetSteps = [];
}
/** Most recently added note across every step (preset or custom) on an item. */
function findLatestNote(item){
  migrateStepNotes(item);
  migrateCustomSteps(item);
  let latest = null;
  const consider = (n) => {
    if(!n) return;
    if(!latest || new Date(n.createdAt) > new Date(latest.createdAt)) latest = n;
  };
  for(const [field] of STEP_FIELDS){
    for(const n of item.stepNotes[field] || []) consider(n);
  }
  for(const cs of item.customSteps){
    for(const n of cs.notes || []) consider(n);
  }
  return latest;
}
/** Presets (fixed order 0..3, minus any the user deleted) interleaved with
 * any custom steps, by sortOrder. */
function buildStepSequence(item){
  migrateCustomSteps(item);
  migrateRemovedPresetSteps(item);
  const seq = STEP_FIELDS
    .map(([field], idx) => ({ kind: "preset", order: idx, field }))
    .filter(entry => !item.removedPresetSteps.includes(entry.field));
  for(const cs of item.customSteps) seq.push({ kind: "custom", order: cs.sortOrder, custom: cs });
  seq.sort((a, b) => a.order - b.order);
  return seq;
}
function removePresetStep(item, field){
  migrateRemovedPresetSteps(item);
  if(item.removedPresetSteps.includes(field)) return;
  const label = stepLabel(item, field);
  item.removedPresetSteps.push(field);
  recordChange(item.id, "item", item.id, item.name, "removedStep", "Step removed", "", label);
  scheduleSave();
  render();
}
/** Clears a preset step's target date back to blank. Bypasses the baseline
 * decision-card flow (there's no "delay or replan" question to ask when
 * un-setting a date) — if a target is set again later, the existing
 * baseline will still prompt normally, since it's untouched by this. */
function clearStepTarget(item, field, label){
  const old = item[field] || "";
  if(!old) return;
  item[field] = "";
  recordChange(item.id, "item", item.id, item.name, field, label, old, "", "Target date cleared.");
  scheduleSave();
  render();
}

function renderStepsPanel(item){
  migrateStepNotes(item);
  migrateCustomSteps(item);
  migrateRemovedPresetSteps(item);
  if(!item.stepActuals) item.stepActuals = {};
  const panel = el(`<div class="panel"><div class="panel-head"><div><span class="eyebrow">Authoritative for ranges</span><h2>Steps</h2></div></div><div class="panel-pad" id="ms-list"></div></div>`);
  const list = panel.querySelector("#ms-list");
  const seq = buildStepSequence(item);

  list.appendChild(renderStepInsertRow(item, null, seq.length ? seq[0].order : 0));

  seq.forEach((entry, idx) => {
    const isLast = idx === seq.length - 1;
    if(entry.kind === "preset"){
      const field = entry.field;
      const label = stepLabel(item, field);
      expireStalePending(item, field);
      const slip = slipDays(STATE.data, item.id, field, item[field]);
      const late = stepLateness(item, field);
      const actual = item.stepActuals[field];
      const notes = item.stepNotes[field] || [];
      list.appendChild(renderStepBlock({
        label, isLast, slip, late, target: item[field], actual, notes, removable: true, labelEditable: true,
        pending: isPending(item, field), pendingSince: pendingSinceDate(item, field), pendingSinceDays: pendingDays(item, field),
        onLabelChange: (v) => updateStepLabelOverride(item, field, v),
        onTargetChange: (v) => beginMilestoneUpdate(item.id, "item", item.id, field, label, item.name, v),
        onClearTarget: () => clearStepTarget(item, field, label),
        onActualChange: (v) => {
          const old = item.stepActuals[field] || "";
          item.stepActuals[field] = v;
          const postLabel = stepLabel(item, field);
          recordChange(item.id, "item", item.id, item.name, field + "Actual", postLabel + " actual date", old, v);
          const nextLate = stepLateness(item, field);
          if(nextLate && nextLate > 0) checkKnockOnFromLateness(item.id, field, nextLate, postLabel);
          scheduleSave(); render();
        },
        onAddNote: (text, date) => addStepNote(item, field, label, text, date),
        onRemoveNote: (nIdx) => removeStepNote(item, field, label, nIdx),
        onNoteDateChange: (nIdx, v) => updateStepNoteDate(item, field, label, nIdx, v),
        onEditNote: (nIdx, v) => updateStepNoteText(item, field, label, nIdx, v),
        onRemove: () => removePresetStep(item, field),
        onTogglePending: () => togglePending(item, field, label),
        onPendingSinceChange: (v) => updatePendingSince(item, field, label, v),
      }));
    }else{
      const cs = entry.custom;
      expireStalePending(item, cs.id);
      const late = latenessDays(cs.actual, cs.target);
      list.appendChild(renderStepBlock({
        label: cs.label, isLast, slip: null, late, target: cs.target, actual: cs.actual, notes: cs.notes || [],
        removable: true, labelEditable: true,
        pending: isPending(item, cs.id), pendingSince: pendingSinceDate(item, cs.id), pendingSinceDays: pendingDays(item, cs.id),
        onLabelChange: (v) => updateCustomStepField(item, cs.id, "label", v || "New step"),
        onTargetChange: (v) => updateCustomStepField(item, cs.id, "target", v),
        onClearTarget: () => updateCustomStepField(item, cs.id, "target", ""),
        onActualChange: (v) => updateCustomStepField(item, cs.id, "actual", v),
        onAddNote: (text, date) => addCustomStepNote(item, cs.id, text, date),
        onRemoveNote: (nIdx) => removeCustomStepNote(item, cs.id, nIdx),
        onNoteDateChange: (nIdx, v) => updateCustomStepNoteDate(item, cs.id, nIdx, v),
        onEditNote: (nIdx, v) => updateCustomStepNoteText(item, cs.id, nIdx, v),
        onRemove: () => removeCustomStep(item, cs.id),
        onTogglePending: () => togglePending(item, cs.id, cs.label),
        onPendingSinceChange: (v) => updatePendingSince(item, cs.id, cs.label, v),
      }));
    }
    const nextOrder = isLast ? entry.order + 1 : seq[idx + 1].order;
    list.appendChild(renderStepInsertRow(item, entry.order, nextOrder));
  });
  return panel;
}

/** A thin "+ Add step" divider between two steps (or before the first / after the last). */
function renderStepInsertRow(item, afterOrder, beforeOrder){
  const row = el(`
    <div class="step-insert-row">
      <span class="step-insert-line"></span>
      <button type="button" class="step-insert-btn" data-role="open">+ Add step</button>
      <span class="step-insert-line"></span>
    </div>
  `);
  row.querySelector('[data-role="open"]').onclick = () => {
    const form = el(`
      <div class="step-insert-form">
        <input type="text" class="text-input" placeholder="Step name…" id="new-step-name" />
        <button class="btn btn-sm" data-role="confirm">Add</button>
        <button class="btn btn-ghost btn-sm" data-role="cancel">Cancel</button>
      </div>
    `);
    row.replaceWith(form);
    const input = form.querySelector("#new-step-name");
    input.focus();
    const commit = () => {
      const name = input.value.trim();
      if(!name) return;
      migrateCustomSteps(item);
      const newOrder = (afterOrder === null) ? (beforeOrder - 1 + beforeOrder) / 2 : (afterOrder + beforeOrder) / 2;
      item.customSteps.push({ id: uid("cs"), label: name, sortOrder: newOrder, target: "", actual: null, notes: [] });
      recordChange(item.id, "item", item.id, item.name, "customStep", "Custom step added", "", name);
      scheduleSave();
      render();
    };
    input.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); commit(); } });
    form.querySelector('[data-role="confirm"]').onclick = commit;
    form.querySelector('[data-role="cancel"]').onclick = () => form.replaceWith(row);
  };
  return row;
}

/** Shared block renderer for both preset and custom steps. */
function renderStepBlock(opts){
  const {
    label, isLast, slip, late, target, actual, notes, removable, labelEditable, pending, pendingSince, pendingSinceDays,
    onLabelChange, onTargetChange, onClearTarget, onActualChange, onAddNote, onRemoveNote, onNoteDateChange, onEditNote, onRemove, onTogglePending, onPendingSinceChange,
  } = opts;
  const block = el(`
    <div class="step-block ${isLast ? "step-block-last" : ""} ${pending ? "step-block-pending" : ""}">
      <div class="kv-row kv-row-flush">
        <div class="kv-left" data-role="label-holder">
        </div>
        <div class="kv-right">
          ${pending ? `<span class="pill pill-pending">pending${pendingSinceDays !== null ? " · " + pendingSinceDays + "d" : ""}</span>` : ""}
          ${late !== null && late > 0 ? `<span class="pill pill-late">${late}d late</span>` : ""}
          ${slip !== null ? `<span class="pill pill-move">${formatSlip(slip)}</span>` : ""}
          <div class="date-pair">
            ${pending ? `
            <div class="date-pair-item">
              <span class="date-pair-label">Since</span>
              <input type="date" class="date-input" value="${pendingSince && isValidDate(pendingSince) ? pendingSince : ""}" data-role="pending-since" />
            </div>` : `
            <div class="date-pair-item">
              <span class="date-pair-label">Target</span>
              <input type="date" class="date-input" value="${target && isValidDate(target) ? target : ""}" data-role="target" />
            </div>
            <div class="date-pair-item">
              <span class="date-pair-label">Actual</span>
              <input type="date" class="date-input" value="${actual && isValidDate(actual) ? actual : ""}" data-role="actual" />
            </div>`}
          </div>
          <button class="pending-toggle ${pending ? "active" : ""}" title="${pending ? "Clear pending" : "Mark pending — waiting on a response"}" data-role="pending">⏳</button>
          ${removable ? `<button class="ec-remove" title="Remove step" data-role="remove-step">×</button>` : ""}
        </div>
      </div>
      <div class="step-notes-list" data-notes-list></div>
      <div class="step-note-add">
        <input type="date" class="step-note-date-input" data-role="add-note-date" />
        <input type="text" class="step-note-input" placeholder="Add a note…" data-role="add-note" />
      </div>
    </div>
  `);
  const labelHolder = block.querySelector('[data-role="label-holder"]');
  if(labelEditable){
    const labelInput = el(`<input class="td-title-input" value="${escapeHtml(label || "")}" placeholder="Step name" />`);
    labelHolder.appendChild(labelInput);
    bindCommit(labelInput, onLabelChange);
  }else{
    labelHolder.appendChild(el(`<div class="kv-name">${escapeHtml(label)}</div>`));
  }
  if(removable){
    block.querySelector('[data-role="remove-step"]').onclick = onRemove;
  }
  block.querySelector('[data-role="pending"]').onclick = onTogglePending;
  const targetInput = block.querySelector('[data-role="target"]');
  if(targetInput){
    wrapDateField(targetInput, target);
    targetInput.onchange = (e) => {
      if(e.target.value) onTargetChange(e.target.value);
      else if(onClearTarget) onClearTarget();
    };
  }
  const actualInput = block.querySelector('[data-role="actual"]');
  if(actualInput){
    wrapDateField(actualInput, actual);
    actualInput.onchange = (e) => onActualChange(e.target.value || null);
  }
  const pendingSinceInput = block.querySelector('[data-role="pending-since"]');
  if(pendingSinceInput){
    wrapDateField(pendingSinceInput, pendingSince);
    pendingSinceInput.onchange = (e) => { if(e.target.value) onPendingSinceChange(e.target.value); };
  }
  const notesList = block.querySelector("[data-notes-list]");
  (notes || []).forEach((n, nIdx) => {
    const row = el(`
      <div class="step-note-line adaptation-row">
        <input type="date" class="step-note-date-input" value="${n.date && isValidDate(n.date) ? n.date : ""}" data-role="note-date" />
        <div class="adaptation-rich" data-holder="note-rich"></div>
        <button class="ec-remove" title="Remove note" data-role="remove-note">×</button>
      </div>
    `);
    const noteDateInput = row.querySelector('[data-role="note-date"]');
    wrapDateField(noteDateInput, n.date);
    noteDateInput.onchange = (e) => onNoteDateChange(nIdx, e.target.value || null);
    const noteEditor = createRichTextEditor(n.text || "", "", 20);
    row.querySelector('[data-holder="note-rich"]').appendChild(noteEditor.wrap);
    bindCommitRich(noteEditor.editable, v => onEditNote(nIdx, v));
    row.querySelector('[data-role="remove-note"]').onclick = () => onRemoveNote(nIdx);
    notesList.appendChild(row);
  });
  const addDateInput = block.querySelector('[data-role="add-note-date"]');
  wrapDateField(addDateInput, "");
  const addInput = block.querySelector('[data-role="add-note"]');
  let submitted = false;
