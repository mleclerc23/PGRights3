<style>
  :root{
    --bg: #EAF4FB;
    --panel: #FFFFFF;
    --panel-alt: #E3EFF8;
    --panel-raised: #D3E6F5;
    --ink: #10202E;
    --border: #10202e2b;
    --border-soft: #10202e18;
    --text: #10202E;
    --text-dim: #4C6579;
    --text-faint: #8CA4B5;
    --green: #3f8a5b;
    --green-bg: #3f8a5b1a;
    --amber: #b8791a;
    --amber-bg: #f4c65c33;
    --gold: #4FA8E0;
    --gold-deep: #2E86C7;
    --red: #C91828;
    --red-bg: #C918281a;
    --red-deep: #97121E;
    --slate: #6b7280;
    --slate-bg: #6b72801a;
    --indigo: #16324a;
    --indigo-bg: #10202e0f;
    --radius: 10px;
    --radius-lg: 18px;
    --shadow-hard: 5px 5px 0 var(--ink);
    --shadow-hard-sm: 3px 3px 0 var(--ink);
    --font-display: 'Space Grotesk', ui-sans-serif, sans-serif;
    --font-body: 'Inter', ui-sans-serif, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    zoom: 1.14;
  }
  ::selection{ background: var(--gold); color: var(--ink); }
  a{ color: inherit; }
  .rich-editable a, .rich-line a{ color: var(--gold); text-decoration:underline; }
  button{ font-family: inherit; }
  input, select, textarea{ font-family: inherit; font-size: inherit; }

  #app{ max-width: 1280px; margin: 0 auto; padding: 0 28px 90px; }

  /* ---- Top nav ---- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding: 18px 0; border-bottom: 1.5px solid var(--ink); margin-bottom: 34px; flex-wrap:wrap;
  }
  .topnav-left{ display:flex; align-items:center; gap:34px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap: 11px; }
  .mark{
    width: 38px; height:38px; border-radius: 9px; background: var(--ink);
    display:inline-flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size:14px; font-weight:700; color: var(--gold);
    flex-shrink:0;
  }
  .mark-lg{ width:64px; height:64px; border-radius:14px; font-size:22px; }
  .mark-outline{ background: var(--panel); border: 2px solid var(--red); border-radius:4px; }
  .mark-transparent{ background: transparent; border:none; }
  .mark-img{ height:62%; width:auto; display:block; }
  .brand-wordmark{ height:20px; width:auto; display:block; }
  .brand .sub{ color: var(--text-faint); font-size: 10.5px; font-family: var(--font-mono); letter-spacing:0.06em; text-transform:uppercase; margin-top:3px; }
  .nav-tabs{ display:flex; align-items:center; gap:26px; }
  .nav-tab{
    font-size:13.5px; font-weight:600; color: var(--text-faint); cursor:pointer; padding-bottom:6px;
    border-bottom: 2.5px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .nav-tab.active{ color: var(--ink); border-bottom-color: var(--ink); }
  .nav-tab:hover{ color: var(--ink); }
  .nav-tab .count{ background: var(--panel-raised); color: var(--text-dim); font-family:var(--font-mono); font-size:10.5px; padding:1px 6px; border-radius:100px; }
  .topnav-right{ display:flex; align-items:center; gap:16px; }
  .search-box{
    display:flex; align-items:center; gap:6px; background: var(--panel-alt); border:1.5px solid var(--border);
    border-radius: 100px; padding: 7px 14px; min-width: 200px;
  }
  .search-box input{ border:none; background:transparent; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color: var(--text-faint); }
  .updated-pill{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-dim); white-space:nowrap; font-family: var(--font-mono);}
  .updated-pill .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); flex-shrink:0; }
  .updated-pill.saving .dot{ background: var(--amber); }
  .avatar{
    width:32px; height:32px; border-radius:50%; background: var(--gold); color: var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family: var(--font-display);
    border: 1.5px solid var(--ink);
  }

  .btn{
    background: var(--panel); color: var(--text); border: 1.5px solid var(--ink);
    padding: 9px 16px; border-radius: 100px; cursor:pointer; font-size: 13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition: transform .1s, box-shadow .1s;
  }
  .btn:hover{ transform: translate(-1px,-1px); box-shadow: var(--shadow-hard-sm); }
  .btn-primary{ background: var(--red); border-color: var(--ink); color: #fff; }
  .btn-primary:hover{ background: var(--red-deep); }
  .btn-ghost{ background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; border-radius:8px;}
  .btn-ghost:hover{ background: var(--panel-alt); color: var(--text); transform:none; box-shadow:none; }
  .btn-sm{ padding: 6px 12px; font-size:12px; }
  .btn-danger{ color: var(--red); }

  .panel{ background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); }
  .panel + .panel{ margin-top: 18px; }
  .panel-pad{ padding: 20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px;
    border-bottom: 1.5px solid var(--ink);
  }
  .panel-head h2{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0; }
  .panel-head .eyebrow{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; display:block; margin-bottom:2px; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding: 4px 10px; border-radius: 100px;
    font-size: 11.5px; font-weight:700; font-family: var(--font-mono); letter-spacing: 0.01em;
    white-space: nowrap; border:1px solid transparent;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; }
  .badge-green{ background: var(--green-bg); color: var(--green); }
  .badge-green .dot{ background: var(--green); }
  .badge-yellow{ background: var(--amber-bg); color: var(--amber); }
  .badge-yellow .dot{ background: var(--amber); }
  .badge-red{ background: var(--red-bg); color: var(--red); }
  .badge-red .dot{ background: var(--red); }
  .badge-completed{ background: var(--slate-bg); color: var(--slate); }
  .badge-completed .dot{ background: var(--slate); }

  .pill{ font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius:100px; font-weight:600; }
  .pill-late{ background: var(--red-bg); color: var(--red); }
  .pill-move{ background: var(--panel-alt); color: var(--text-dim); border:1px solid var(--border); }
  .pill-onplan{ background: var(--panel-alt); color: var(--text-faint); }
  .pill-priority{ background: var(--red); color: #fff; border:1px solid var(--ink); }
  .pill-pending{ background: var(--slate-bg); color: var(--slate); }

  /* ---- Header block ---- */
  .page-head{ margin-bottom: 26px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .page-head h1.page-title{ font-family: var(--font-display); font-size: 42px; font-weight:700; margin: 4px 0 8px; letter-spacing:-0.02em; }
  .page-head .page-sub{ color: var(--text-dim); font-size: 14.5px; max-width: 520px; }
  .page-head-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---- Item cards ---- */
  .item-card{
    background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); padding: 18px 20px;
    cursor:pointer; transition: transform .12s;
  }
  .item-card:hover{ transform: translate(-2px,-2px); box-shadow: var(--shadow-hard); }
  .item-card + .item-card{ margin-top: 12px; }
  .item-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; margin-bottom: 12px;}
  .item-title-block h3{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0 0 3px; }
  .item-meta{ color: var(--text-faint); font-size: 12.5px; }
  .item-meta .sep{ margin: 0 6px; opacity:.5; }
  .item-progress{ color: var(--text-dim); font-size: 12.5px; margin-top:4px; }
  .item-badges{ display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}

  .empty{ padding: 40px 20px; text-align:center; color: var(--text-faint); }
  .empty .big{ font-family: var(--font-display); color: var(--text-dim); font-size:15px; margin-bottom:4px; }

  /* ---- Slate timeline (shared axis, overview) ---- */
  .slate-legend{ display:flex; align-items:center; gap:16px; font-size:12px; color: var(--text-dim); }
  .slate-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .slate-legend .dot{ width:7px; height:7px; border-radius:50%; }
  .slate-nav{ display:flex; gap:8px; }
  .slate-timeline{ padding: 20px; overflow-x:auto; }
  .slate-axis{ position:relative; height: 26px; border-bottom: 1px solid var(--border); margin-bottom:6px; min-width: 640px; }
  .slate-axis .month{ position:absolute; top:0; border-left:1px solid var(--border); font-size:11px; font-family: var(--font-mono); color: var(--text-faint); padding-left:6px; height:100%; }
  .slate-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); min-width: 640px; cursor:pointer; }
  .slate-row:hover .slate-row-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
  .slate-row:last-child{ border-bottom:none; }
  .slate-row-label{ width: 190px; flex-shrink:0; display:flex; align-items:flex-start; gap:9px; }
  .slate-row-label .dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .slate-row-name{ font-weight:700; font-size:13.5px; }
  .slate-row-track{ position:relative; flex:1; height: 22px; }
  .slate-bar{ position:absolute; top:4px; height:14px; border-radius:100px; }
  .slate-today{ position:absolute; top:-11px; bottom:-11px; border-left: 1.5px dashed var(--ink); }

  /* ---- Detail timeline ---- */
  .timeline-wrap{ overflow-x:auto; padding-top: 4px; }
  .timeline{ position:relative; }
  .timeline-grid{ position:relative; height: 1px; }
  .timeline-track{ position:relative; height: 22px; margin-bottom: 5px; }
  .timeline-track:last-child{ margin-bottom:0; }
  .tl-bar{ position:absolute; top:4px; height:14px; border-radius:4px; }
  .tl-ghost{ position:absolute; top:4px; height:14px; border-radius:4px; border: 1.5px dashed; background:transparent; opacity:.6; }
  .tl-milestone{ position:absolute; top:2px; width:14px; height:14px; transform: translateX(-50%) rotate(45deg); border-radius:3px; }
  .tl-label{ position:absolute; top:4px; font-size:10.5px; font-family: var(--font-mono); color: var(--text-faint); white-space:nowrap; transform: translateX(4px); line-height:14px;}
  .tl-month{ position:absolute; top:0; bottom:0; border-left: 1px dashed var(--border); font-size: 9.5px; color: var(--text-faint); font-family: var(--font-mono); padding-left:3px;}
  .tl-today{ position:absolute; top:-6px; bottom:-6px; border-left: 1.5px solid var(--ink); }
  .tl-today::after{ content:'today'; position:absolute; top:-14px; left:3px; font-size:9px; color: var(--ink); font-family: var(--font-mono); }

  /* ---- Production pulse ---- */
  .pulse-row{ display:flex; align-items:center; justify-content:space-between; padding: 10px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
  .pulse-row:last-child{ border-bottom:none; }
  .pulse-row:hover .pulse-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .pulse-left{ display:flex; align-items:center; gap:9px; cursor:pointer; }
  .pulse-left .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pulse-name{ font-weight:700; font-size:13px; }
  .pulse-sub{ color: var(--text-faint); font-size:11px; margin-top:1px; }
  .estate-categories{ display:flex; flex-direction:column; gap:20px; }

  /* ---- To-do ---- */
  .title-card{ padding:14px 0; border-bottom:1px solid var(--border-soft); }
  .title-card:last-child{ border-bottom:none; }
  .title-card-updates{ margin-top:12px; }
  .title-card-head{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
  .title-card-name{ font-weight:700; font-size:14px; }
  .title-card-link{ cursor:pointer; }
  .title-card-link:hover{ text-decoration:underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .title-page-head{ margin:6px 0 18px; }
  .title-page-name{ font-size:30px; font-weight:800; color:#2B6FAE; margin:0 0 2px; letter-spacing:-0.01em; }
  .title-page-star{ color: var(--red); font-size:20px; vertical-align:middle; }
  .title-card-estate{ font-size:12px; color: var(--text-dim); cursor:pointer; margin-top:1px; }
  .title-card-estate:hover{ text-decoration:underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .title-card-facts{ display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:8px; font-size:12px; color: var(--text-dim); }
  .title-card-facts b{ font-weight:600; color: var(--text-faint); font-family: var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; margin-right:3px; }
  .title-card-logline{ margin-top:8px; font-size:12.5px; color: var(--text-dim); line-height:1.5; }
  .todo-entry-titles, .todo-entry-name{ color: #2B6FAE; }
  .todo-text-row{ display:flex; align-items:center; gap:8px; }
  .todo-text-holder{ flex:0 1 auto; min-width:80px; }
  .todo-item-row:not(.is-done) .todo-task-input{ color: var(--red); }
  .urgent-toggle{
    flex:0 0 auto; background:none; border:1px dashed var(--border); color: var(--text-faint); font-family: var(--font-mono);
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 9px; border-radius:100px; cursor:pointer;
  }
  .urgent-toggle:hover{ border-color: var(--red); color: var(--red); }
  .urgent-toggle.on{ background: var(--red); border:1px solid var(--red); color:#fff; font-weight:700; }
  .todo-eyebrow{ font-size:11.5px; color: var(--text-dim); letter-spacing:0.01em; padding:2px 0; min-height:16px; }
  .todo-eyebrow:empty::before{ content: attr(data-placeholder); color: var(--text-faint); }
  .todo-item-notes{ margin-top:1px; }
  [data-role="list"] > .todo-entry:first-child{ padding-top:0; margin-top:-8px; }
  .progress-row{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px solid var(--border-soft); }
  .progress-row:first-child{ border-top:none; padding-top:0; }
  .progress-when{ flex:0 0 118px; font-family: var(--font-mono); font-size:11px; color: var(--text-faint); padding-top:2px; }
  .progress-body{ flex:1; min-width:0; }
  .progress-text{ font-weight:600; font-size:13px; }
  .progress-text.is-done{ color: var(--text-dim); }
  .progress-notes{ font-size:12px; color: var(--text-dim); margin-top:2px; }
  .pill-urgent{ background: var(--red); color:#fff; }
  .todo-heading-holder{ margin-bottom:10px; }
  .todo-heading-input{ font-weight:700; font-size:14px; border-bottom:1px dashed var(--border); padding:4px 0; }
  .todo-view-toggle{ display:flex; gap:6px; align-items:center; }
  .todo-lines{ margin-top:4px; }
  .rich-editable ul, .rich-editable ol, .todo-notes-live ul, .todo-notes-live ol, .progress-notes ul, .td-readonly-text ul{ margin:2px 0; padding-left:20px; list-style:disc; }
  .rich-editable ol, .todo-notes-live ol{ list-style:decimal; }
  .rich-editable li, .todo-notes-live li, .progress-notes li{ margin:1px 0; }
  .todo-entry-remove{ margin-left:auto; font-size:11px; opacity:.6; }
  .todo-entry-remove:hover{ opacity:1; }
  .todo-entry-remove.armed{ background: var(--red-bg); color: var(--red); opacity:1; }
  .todo-entry-titles{ outline:none; border-radius:3px; }
  .todo-entry-titles.editing{ cursor:text; background: var(--panel-alt); box-shadow:0 0 0 2px var(--panel-alt); }
  .todo-entry-titles .title-link{ cursor:pointer; }
  .todo-entry-titles .title-link:hover{ text-decoration:underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }

  display.textContent = valid ? fmtDate(value) : (placeholder || "Select date");
  wrapper.appendChild(display);
  inputEl.dataset.ph = placeholder || "Select date";
  // keep the visible date in step with what was picked (and fall back to the placeholder when cleared)
  const sync = () => {
    const v = inputEl.value, ok = isValidDate(v);
    display.className = "date-field-display" + (ok ? "" : " placeholder");

/** The tensed default label, ignoring any override — used as the fallback

const STATUS_RANK = { green:0, completed:0, yellow:1, red:2 };
function worseStatus(a, b){
  if(!a) return b; if(!b) return a;
  return STATUS_RANK[b] > STATUS_RANK[a] ? b : a;
}

/** Derived (auto) health: worst of real lateness and confirmed movement across the steps (rule 3.3). */
function autoHealth(data, item){
  let worst = "green";
  const late = itemLateness(data, item);
  if(late !== null){
    if(late >= 7) worst = worseStatus(worst, "red");
    else if(late >= 1) worst = worseStatus(worst, "yellow");
  }
  const slip = itemSlip(data, item);
  if(slip !== null && slip > 0){
    if(slip >= 21) worst = worseStatus(worst, "red");
    else if(slip >= 7) worst = worseStatus(worst, "yellow");
  }
  return worst;
}
/** item.status is a manual override; '' / null means "derive it" (see schema comment). */
function itemHealth(data, item){
  return item.status || autoHealth(data, item);
}

const STEP_BAR_LABELS = { "step-1-2": "Outreach", "step-2-3": "Pitching", "step-3-4": "Finalizing" };

/** Canonical list of bars + milestones for one item. Malformed dates are simply not drawn. */
function itemScheduleItems(data, item){
  const health = itemHealth(data, item);
  const rightsSecuredActual = item.stepActuals && item.stepActuals.target_rights_secured;
  const out = [
    { id: "step-1-2", label: STEP_BAR_LABELS["step-1-2"], start: item.target_call, end: item.target_pitch, health },
    { id: "step-2-3", label: STEP_BAR_LABELS["step-2-3"], start: item.target_pitch, end: item.target_proposal, health },
    { id: "step-3-4", label: STEP_BAR_LABELS["step-3-4"], start: item.target_proposal, end: item.target_rights_secured, health },
    { id: "rights-secured", label: stepLabel(item, "target_rights_secured"), start: item.target_rights_secured, end: item.target_rights_secured, health: rightsSecuredActual ? "completed" : health, milestone: true },
  ];
  return out.filter(i => isValidDate(i.start) && isValidDate(i.end));
}

function latestBaseline(data, entityId, field){
  const rows = data.baselines.filter(b => b.entityId === entityId && b.field === field);
  if(!rows.length) return null;
  return rows.reduce((best, r) => r.generation > best.generation ? r : best, rows[0]);
}
/** Movement is only meaningful once a human acknowledges it (rule 3.2). Silent otherwise. */
function slipDays(data, entityId, field, currentDate){
  if(!currentDate) return null;
  const b = latestBaseline(data, entityId, field);
  if(!b || !b.acknowledged) return null;
  const cur = parseDate(currentDate, true), base = parseDate(b.baselineDate, true);
  if(!cur || !base) return null;
  return Math.round((cur.getTime() - base.getTime()) / 86400000);
}

}
function itemSlip(data, item){
  migrateRemovedPresetSteps(item);
  const slips = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => slipDays(data, item.id, field, item[field]))
    .filter(v => v !== null);
  if(!slips.length) return null;
  return slips.reduce((worst, v) => v > worst ? v : worst, slips[0]);
}
/** Actual vs target, per step. Real lateness — always shown, never needs interpretation. */
function latenessDays(actual, target){
  const a = parseDate(actual, true), t = parseDate(target, true);
  if(!a || !t) return null;
  return Math.round((a.getTime() - t.getTime()) / 86400000);
}
function stepLateness(item, field){

}
/** Worst real lateness across a item's steps — the "actual" half of rule 3.3. Includes custom steps. */
function itemLateness(data, item){

  const presetValues = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => stepLateness(item, field));
  const customValues = item.customSteps.map(cs => latenessDays(cs.actual, cs.target));
  const values = [...presetValues, ...customValues].filter(v => v !== null && v > 0);
  if(!values.length) return null;
  return Math.max(...values);
}
function formatSlip(slip){

}
/** The free-text "current stage" the item owner sets themselves — see the header field. */
function progressLabel(data, item){

}
function migrateTodoConfig(item){

  if(item.todo.stepRef === undefined) item.todo.stepRef = "";
  if(item.todo.text === undefined) item.todo.text = "";
  if(item.todo.priority === undefined) item.todo.priority = false;
  if(item.todo.assignee === undefined) item.todo.assignee = "";
}
/** item.stepPending maps a step ref (preset field name or custom step id) to

function migratePendingSteps(item){

/** The notes recorded against one specific step, whether preset or custom. */

function latestStepNoteDate(notes){

/** Inserts a note into a notes list at the position its date calls for —

 * without disturbing the relative order of the other notes already there

function insertNoteSorted(list, note){
  if(note.date && isValidDate(note.date)){
    let i = 0;
    while(i < list.length){
      const other = list[i];
      if(!(other.date && isValidDate(other.date))) break; // reached the undated tail

function togglePending(item, ref, label){

function seqEntryRef(entry){ return entry.kind === "preset" ? entry.field : entry.custom.id; }

async function loadData(){

/* Undo / redo: every change that reaches scheduleSave() is remembered as a whole-data snapshot. */
const undoStack = [], redoStack = [];

function trackUndo(){
  if(undoRestoring) return;
  let now; try{ now = JSON.stringify(STATE.data); }catch(e){ return; }
  if(now === undoCur) return;
  if(undoCur !== null){ undoStack.push(undoCur); if(undoStack.length > 80) undoStack.shift(); redoStack.length = 0; }
  undoCur = now;
}
function undoToast(text){
  let t = document.getElementById("undo-toast");
  if(!t){ t = document.createElement("div"); t.id = "undo-toast"; t.className = "undo-toast"; document.body.appendChild(t); }
  t.textContent = text; t.classList.add("show");
  clearTimeout(undoToast._t); undoToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function applyHistory(fromStack, toStack, label){
  if(!fromStack.length){ undoToast("Nothing to " + label); return; }
  const target = fromStack.pop();
  if(undoCur !== null) toStack.push(undoCur);
  undoRestoring = true;
  try{
    STATE.data = JSON.parse(target);
    undoCur = target;
    if(STATE.view === "detail" && !STATE.data.items.some(i => i.id === STATE.currentItemId)) STATE.view = "overview";
    if(STATE.view === "title" && !(STATE.currentTitle && STATE.data.items.some(i => i.id === STATE.currentTitle.itemId))) STATE.view = "overview";
    scheduleSave();
    render();
  }finally{ undoRestoring = false; }
  undoToast(label === "undo" ? "Undone (⇧⌘Z to redo)" : "Redone");
}
document.addEventListener("input", (e) => { if(e.target) e.target.__dirty = true; }, true);
document.addEventListener("focusin", (e) => { if(e.target) e.target.__dirty = false; }, true);
document.addEventListener("keydown", (e) => {
  if(!(e.metaKey || e.ctrlKey) || e.altKey || e.key.toLowerCase() !== "z" || !STATE.data) return;
  const ae = document.activeElement;
  const editable = ae && (ae.isContentEditable || ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
  if(editable && ae.__dirty) return;           // mid-typing: let the browser undo the text
  e.preventDefault();

/** Keep estates and each estate's titles A-Z (ignoring a leading "The"); blank ones last. */
function normalizeOrder(boot){
  const d = STATE.data; if(!d || !Array.isArray(d.items)) return;
  // Estate names are always Capitalised Words, never ALL CAPS. Titles in ALL CAPS are fixed once (they show in capitals on the Action List anyway).
  for(const it of d.items){ const n = fixCaps(it.name); if(n !== it.name) it.name = n; }
  if(!d.__titleCapsFixed){
    d.__titleCapsFixed = true;
    for(const it of d.items) for(const t of (it.titles || []).slice()){ const n = fixCaps(t); if(n !== t) renameTitleData(it, t, n); }
  }
  // Estate notes carry a date: the one typed in, else the day they were first written (legacy notes: the estate's creation date).
  for(const it of d.items){
    if(!richIsEmpty(it.notes)){ if(!isValidDate(it.notesCreatedAt)) it.notesCreatedAt = (boot && typeof it.createdAt === "string" && isValidDate(it.createdAt.slice(0, 10))) ? it.createdAt.slice(0, 10) : todayISO(); }
    else if(it.notesCreatedAt || it.notesDate){ it.notesCreatedAt = ""; it.notesDate = ""; }
  }
  for(const it of d.items) if(typeof it.notes === "string" && it.notes.includes("Notes carried over from steps")) migrateCarriedStepNotes(it);
  // The Follow-Up panel is gone: notes that were written in it become ordinary notes on the estate.
  for(const it of d.items){
    const fl = it.stepNotes && it.stepNotes["__hold_followup__"];
    if(Array.isArray(fl) && fl.length){
      migrateTodos(it);
      for(const n of fl){ if(richIsEmpty(n.text)) continue; it.todos.push({ id: uid("tk"), text: n.text, date: isValidDate(n.date) ? n.date : "", notes: "", done: false, createdAt: (n.createdAt || "").slice(0, 10) || todayISO(), doneAt: "", title: "", kind: "note" }); }
      it.stepNotes["__hold_followup__"] = [];
    }
  }
  const cmp = (a, b) => { const ka = sortKey(a), kb = sortKey(b); return ka === kb ? 0 : !ka ? 1 : !kb ? -1 : ka.localeCompare(kb); };
  if(boot){   // one-time: to-dos already completed read as progress too (the original wording is kept for "Reopen")

      if(t.done && t.kind !== "note" && !t.pastDone){ t.pastDone = true; const nt = pastTenseTodo(t.text); if(nt !== t.text){ t.textOpen = t.text; t.text = nt; } }
    }
  }

  const tkey = (x) => stripTags(x).trim().toLowerCase().replace(/\s+/g, " ");
  for(const it of [...d.items, d.general].filter(Boolean)){
    const canon = new Map();
    for(const t of (it.titles || [])){ const k = tkey(t); if(k && !canon.has(k)) canon.set(k, t); }
    const fix = (x) => { if(!x.title) return; const k = tkey(x.title); if(!k) return; if(!canon.has(k)) canon.set(k, x.title); if(x.title !== canon.get(k)) x.title = canon.get(k); };
    for(const t of (it.todos || [])){ fix(t); if(typeof t.notes === "string" && t.notes && richIsEmpty(t.notes)) t.notes = ""; }
    for(const t of (it.documents || [])) fix(t);
    { // a title's details filed under a slightly different spelling ("Softly Softly" vs "Softly, Softly") belong to the estate's own title
      const lk = (x) => stripTags(x).replace(/&nbsp;|\u00a0/g, " ").toLowerCase().replace(/[^a-z0-9]+/g, "").replace(/^the/, "");
      const have = new Set((it.titleDetails || []).map(td => td.title));
      for(const td of (it.titleDetails || [])){
        if(!td.title || (it.titles || []).includes(td.title)) continue;
        const k = lk(td.title); if(!k) continue;
        const hit = (it.titles || []).find(t => lk(t) === k && !have.has(t));
        if(hit){ have.delete(td.title); td.title = hit; have.add(hit); }
      }
    }
    if(Array.isArray(it.actionTitles)){ const seen = new Set(); it.actionTitles = it.actionTitles.map(t => canon.get(tkey(t)) || t).filter(t => { const k = tkey(t); if(seen.has(k)) return false; seen.add(k); return true; }); }
  }
  d.items.sort((a, b) => cmp(a.name, b.name));
  for(const it of d.items) if(Array.isArray(it.titles)) it.titles.sort(cmp);

/* ---- Estates page: Pursuing / Hold for Now ------------- */
const ESTATE_CATEGORIES = [

];
function estateCategoryLabel(key){

}
function migrateEstateCategory(item){
  // Older categories (To Call / In the Works / Tracking Down Info) are all "Pursuing" now; Hold for Now stays as it was.
  if(!ESTATE_CATEGORIES.some(c => c[0] === item.estateCategory)) item.estateCategory = "pursuing";

const HOLD_FOLLOWUP_DAYS = 14;
/** Pursuing / Hold for Now for one title. A title with no setting of its own follows the estate. */
function titleCategoryOf(item, title){

  const c = (item.titleCategory || {})[title];
  return ESTATE_CATEGORIES.some(x => x[0] === c) ? c : item.estateCategory;

/** True when every title of the estate has the same Pursuing / Hold setting (so the estate itself can show one). */
function estateCategoriesAgree(item){

  for(const t of ts) if(!ESTATE_CATEGORIES.some(x => x[0] === item.titleCategory[t])) item.titleCategory[t] = item.estateCategory;

  item.titleCategory[title] = value;
  recordChange(item.id, "item", item.id, item.name, "titleCategory", "Status of " + stripTags(title), estateCategoryLabel(old), estateCategoryLabel(value));
  const set = new Set(ts.map(t => item.titleCategory[t]));
  if(set.size === 1){
    const only = Array.from(set)[0];
    if(item.estateCategory === only){ scheduleSave(); render(); return; }   // estate already shows this value: just redraw
    updateEstateCategory(item, only, { keepTitles: true }); return;
  }   // all agree: the estate follows

function updateEstateCategory(item, value, opts){

  item.estateCategory = value;
  if(!(opts && opts.keepTitles)) item.titleCategory = {};   // setting the whole estate sets every title

/** Once a step's card stops showing in To-Do (replaced by the single

 * into the general "Additional Notes" field too. Guarded so re-entering
 * hold later doesn't duplicate the copy. */
function consolidateStepNotesIntoGeneralNotes(item){
  // Moving to Hold for Now carries the steps' notes over as ordinary dated notes on the estate (once).
  if(item.stepNotesCarried) return;
  const seq = buildStepSequence(item);
  const allNotes = [];
  for(const entry of seq){
    const stepLbl = seqEntryLabel(item, entry);
    const notes = entry.kind === "preset"
      ? ((item.stepNotes && item.stepNotes[entry.field]) || [])
      : (entry.custom.notes || []);
    for(const n of notes){
      const d = isValidDate(n.date) ? n.date : (n.createdAt ? n.createdAt.slice(0, 10) : null);
      allNotes.push({ stepLabel: stepLbl, date: d, text: n.text });
    }
  }
  item.stepNotesCarried = true;
  if(!allNotes.length) return;
  allNotes.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0);
  migrateTodos(item);
  for(const n of allNotes){
    item.todos.push({ id: uid("tk"), text: `${escapeHtml(n.stepLabel)}: ${n.text}`, date: n.date || "", notes: "", done: false, createdAt: todayISO(), doneAt: "", title: "", kind: "note" });

/** One-time clean-up of the old "Notes carried over from steps (Hold for Now)" block that used to be pasted into the estate notes. */
function migrateCarriedStepNotes(item){
  const html = item.notes || "";
  const m = html.match(/(?:<br\s*\/?>\s*)*<b>\s*Notes carried over from steps \(Hold for Now\):?\s*<\/b>:?\s*(?:<br\s*\/?>)?([\s\S]*)$/i);
  if(!m) return;
  const months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const toISO = (txt) => { const x = txt.trim().match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),\s*(\d{4})$/); if(!x) return ""; const mi = months.indexOf(x[1].slice(0, 3).toLowerCase()); return mi < 0 ? "" : `${x[3]}-${String(mi + 1).padStart(2, "0")}-${String(+x[2]).padStart(2, "0")}`; };

  for(const ln of m[1].split(/<br\s*\/?>/i).map(x => x.trim()).filter(Boolean)){
    const p = ln.match(/^(.{3,16}?)\s+(?:—|&mdash;|-)\s+([\s\S]+)$/);
    const date = p ? toISO(p[1]) : "";
    const text = p && (date || /^no date$/i.test(p[1].trim())) ? p[2] : ln;
    if(richIsEmpty(text)) continue;
    item.todos.push({ id: uid("tk"), text, date, notes: "", done: false, createdAt: date || todayISO(), doneAt: "", title: "", kind: "note" });

/** An estate on Hold for Now with a follow-up date gets an ordinary to-do on the Action List once that date arrives. */

    if(!item.holdFollowUpManual && Array.isArray(item.todos) && item.todos.some(t => t.followUp && !t.done)){

/* ---- Revert (Changes tab) --------------------------------------------
 * Supported only where the log entry unambiguously identifies a single
 * settable value — a step's target date, a step's actual date, a plain
 * item field (name/notes/status), a to-do config field, or a title tag.
 * Everything else (notes by list position, custom-step edits, additions/
 * removals that don't carry the full removed object, knock-on summaries)
 * isn't offered a Revert button, rather than risk silently corrupting
 * data on a guess. */
function isStepFieldKey(field){
  return STEP_FIELDS.some(f => f[0] === field);
}
function canRevertChange(c){
  if(c.entity === "system") return false;
  if(!STATE.data.items.some(i => i.id === c.itemId)) return false;
  if(isStepFieldKey(c.field)) return true;
  if(c.field.endsWith("Actual") && isStepFieldKey(c.field.slice(0, -"Actual".length))) return true;
  if(c.field === "name" || c.field === "notes" || c.field === "status" || c.field === "todoTask") return true;
  if(c.field.startsWith("todo.")) return true;
  if(c.field === "titles") return true;
  return false;
}
function applyRevertChange(c){
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!item) return false;
  if(isStepFieldKey(c.field)){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.endsWith("Actual")){
    const key = c.field.slice(0, -"Actual".length);
    if(isStepFieldKey(key)){
      if(!item.stepActuals) item.stepActuals = {};
      item.stepActuals[key] = c.oldValue || null;
      return true;
    }
  }
  if(c.field === "name" || c.field === "notes" || c.field === "status"){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.startsWith("todo.")){
    migrateTodoConfig(item);
    const key = c.field.slice("todo.".length);
    if(key === "priority") item.todo.priority = c.oldValue === "true";
    else item.todo[key] = c.oldValue || "";
    return true;
  }
  if(c.field === "titles"){
    if(!Array.isArray(item.titles)) item.titles = [];
    if(c.newValue && !c.oldValue){
      const idx = item.titles.indexOf(c.newValue);
      if(idx !== -1) item.titles.splice(idx, 1);
    }else if(c.oldValue && !c.newValue){
      item.titles.push(c.oldValue);
    }
    return true;
  }
  return false;
}
function revertChange(c){
  if(!canRevertChange(c)) return;
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!applyRevertChange(c)) return;
  recordChange(c.itemId, "item", c.itemId, item.name, c.field, c.fieldLabel, c.newValue, c.oldValue, "Reverted a previous change.");
  scheduleSave();
  render();
}

/* ---- baseline-aware step update (rule 3.2) ------------------------- */
function beginMilestoneUpdate(itemId, entity, entityId, field, fieldLabel, label, newValue){
  const container = STATE.data.items.find(i=>i.id===entityId);
  const oldValue = container[field];
  if(oldValue === newValue) return;
  if(!isValidDate(newValue)){
    // still allow clearing/typo entry to fail safe — just ignore malformed input
    return;
  }
  const existingBaseline = latestBaseline(STATE.data, entityId, field);
  if(!existingBaseline){
    // first time this step is ever set — becomes its own baseline, no prompt needed.
    container[field] = newValue;
    STATE.data.baselines.push({
      id: uid("bl"), itemId, entity, entityId, field, baselineDate: newValue,
      generation: 1, acknowledged: false, setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(itemId, entity, entityId, label, field, fieldLabel, oldValue, newValue, "Baseline set.");
    scheduleSave();
    render();
    return;
  }
  // A baseline already exists — this is a genuine moved date. Ask.
  STATE.pendingDecision = { itemId, entity, entityId, field, fieldLabel, label, oldValue, newValue };
  render();
}
function resolveDecision(kind){
  const d = STATE.pendingDecision;
  if(!d) return;
  const container = STATE.data.items.find(i=>i.id===d.entityId);
  container[d.field] = d.newValue;

  if(kind === "delay"){
    const b = latestBaseline(STATE.data, d.entityId, d.field);
    b.acknowledged = true;
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Confirmed as a delay against baseline.");
    STATE.pendingDecision = null;
    checkKnockOn(d.itemId, d.field, d.oldValue, d.newValue, d.fieldLabel);
    scheduleSave();
    render();
    return;
  }else if(kind === "replan"){
    const prev = latestBaseline(STATE.data, d.entityId, d.field);
    STATE.data.baselines.push({
      id: uid("bl"), itemId: d.itemId, entity: d.entity, entityId: d.entityId, field: d.field,
      baselineDate: d.newValue, generation: (prev ? prev.generation : 0) + 1, acknowledged: false,
      setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Revised plan — new baseline set.");
  }else if(kind === "cancel"){
    STATE.pendingDecision = null;
    render();
    return;
  }
  STATE.pendingDecision = null;
  scheduleSave();
  render();
}

/* ---- knock-on proposal (rule 3.4: propose, never apply) -----------------
 * Triggered two ways: a step move confirmed as a delay, or a step's actual
 * date landing after its target (real lateness). Either way, offers to
 * shift the steps still downstream by the same number of days. */
function checkKnockOn(itemId, field, oldValue, newValue, fieldLabel){
  const shiftDays = daysBetween(oldValue, newValue);
  if(!shiftDays) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays: shiftDays, referenceLabel: fieldLabel };
}
function checkKnockOnFromLateness(itemId, field, lateDays, fieldLabel){
  if(!lateDays || lateDays <= 0) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays, referenceLabel: fieldLabel };
}
function resolveKnockOn(kind){
  const k = STATE.pendingKnockOn;
  if(!k) return;
  const item = STATE.data.items.find(i=>i.id===k.itemId);
  if(kind === "shift"){
    for(const field of k.downstream){
      const old = item[field];
      if(!isValidDate(old)) continue;
      const next = addDaysISO(old, k.lateDays);
      const prevBaseline = latestBaseline(STATE.data, item.id, field);
      item[field] = next;
      STATE.data.baselines.push({
        id: uid("bl"), itemId: item.id, entity:"item", entityId:item.id, field,
        baselineDate: next, generation: (prevBaseline ? prevBaseline.generation : 0) + 1,
        acknowledged: false, setAt: new Date().toISOString(), setBy: "knock-on", note: "",
      });
      recordChange(item.id, "item", item.id, item.name, field, stepLabel(item, field), old, next, `Shifted +${k.lateDays}d after ${k.referenceLabel} slipped.`);
    }
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "shifted", `${k.referenceLabel} slipped ${k.lateDays}d — remaining steps shifted +${k.lateDays}d.`);
  }else if(kind === "manual"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "manual", `${k.referenceLabel} slipped ${k.lateDays}d — left for manual adjustment.`);
  }else if(kind === "leave"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "declined", `${k.referenceLabel} slipped ${k.lateDays}d — dates left as planned.`);
  }
  STATE.pendingKnockOn = null;
  scheduleSave();
  render();
}
/* =========================================================================
   RENDER — full-panel re-render on commit (change/blur), never mid-keystroke.
   Free-text fields commit on blur so a rerender never fights an active edit
   (see LESSONS.md "a background refresh ate what someone was typing").
   ========================================================================= */
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function badgeHtml(status, label){
  const cls = status === "completed" ? "completed" : (status || "green");
  return `<span class="badge badge-${cls}"><span class="dot"></span>${label || (status==="completed" ? "Completed" : cls[0].toUpperCase()+cls.slice(1))}</span>`;
}

let quickAddFresh = false;
/* ---- Browser history: back/forward move between pages of the app ---- */
let navKey = null, navPopping = false;
function navSnapshot(){ return { tab: STATE.tab, view: STATE.view, itemId: STATE.currentItemId || null, title: STATE.currentTitle || null }; }
function syncHistory(){
  try{
    const snap = navSnapshot(), key = JSON.stringify(snap);
    if(key === navKey) return;
    if(navKey === null) history.replaceState(snap, ""); else if(!navPopping) history.pushState(snap, "");
    navKey = key;
  }catch(e){}
}
function applyNav(snap){
  if(!snap || typeof snap !== "object" || !STATE.data) return false;
  const items = STATE.data.items || [];
  let view = snap.view, tab = snap.tab;
  if(view === "detail" && !items.some(i => i.id === snap.itemId)) view = "overview";
  if(view === "title" && !(snap.title && items.some(i => i.id === snap.title.itemId && (i.titles || []).includes(snap.title.title)))) view = "overview";
  STATE.tab = tab || "todo"; STATE.view = view || "overview";
  STATE.currentItemId = view === "detail" ? snap.itemId : null;
  STATE.currentTitle = view === "title" ? snap.title : null;
  return true;
}
window.addEventListener("popstate", (e) => {
  if(!STATE.data || !e.state) return;
  if(!applyNav(e.state)) return;
  navPopping = true; navKey = JSON.stringify(navSnapshot());
  try{ STATE.modal = null; render(); window.scrollTo(0, 0); } finally { navPopping = false; }
});
function render(){
  syncHistory();
  if(STATE.modal === "quick-add"){ if(quickAddFresh) quickAddFresh = false; else STATE.modal = null; }   // any action in the pop-up closes it
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(renderTopbar());

  try{
    if(STATE.pendingDecision) root.appendChild(renderDecisionCard());
    if(STATE.pendingKnockOn) root.appendChild(renderKnockOnCard());

    if(STATE.view === "title" && STATE.currentTitle){
      root.appendChild(renderTitlePage(STATE.currentTitle.itemId, STATE.currentTitle.title));
    }else if(STATE.view === "detail" && STATE.currentItemId){
      root.appendChild(renderItemDetail(STATE.currentItemId));
    }else{
      const holder = el(`<div id="overview-holder"></div>`);
      holder.appendChild(renderCurrentTabBody());
      root.appendChild(holder);
    }
  }catch(e){
    root.appendChild(el(`<div class="error-fallback">Something went wrong displaying this view. <button class="btn btn-sm" id="err-back" style="margin-left:8px;">Back to overview</button><div style="margin-top:6px;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;">${escapeHtml(e.message)}</div></div>`));
    document.getElementById("err-back").onclick = () => { STATE.view="overview"; STATE.currentItemId=null; render(); };
  }

  if(STATE.modal === "new-item") root.appendChild(renderNewItemModal());
  if(STATE.modal === "quick-add") root.appendChild(renderQuickAddModal());
}

      const q = STATE.search.trim().toLowerCase();
      if(!q){
        if(STATE.sortBeforeSearch){ STATE.detailsSort = STATE.sortBeforeSearch; STATE.sortBeforeSearch = null; }
      }else{
        const its = STATE.data.items;
        const estateHit = its.some(i => estateMatches(i, q)), titleHit = its.some(i => titleMatches(i, q));
        const cur = detailsSort();
        const want = estateHit ? "estate" : (titleHit ? "title" : cur);
        if(want !== cur){ if(!STATE.sortBeforeSearch) STATE.sortBeforeSearch = cur; STATE.detailsSort = want; }
      }
    }
    renderOverviewInPlace();
  };
  return bar;

/* Search filters the slate/pulse lists without a full top-level rerender,
   so the search box never loses focus mid-keystroke. */
function renderOverviewInPlace(){
  const holder = document.getElementById("overview-holder");
  if(!holder){ render(); return; }
  holder.innerHTML = "";
  holder.appendChild(renderCurrentTabBody());
}
function renderCurrentTabBody(){
  if(STATE.tab === "changes") return renderChangesTab();
  if(STATE.tab === "todo") return renderTodoTab();
  if(STATE.tab === "summary") return renderSummaryTab();
  return renderOverviewBody();
}

/* ---- Overview: "Slate overview" ------------------------------------------ */
function estateMatches(i, q){ return i.name.toLowerCase().includes(q) || (i.owner||"").toLowerCase().includes(q) || (i.currentPhase||"").toLowerCase().includes(q); }
function titleMatches(i, q){ return (i.titles || []).some(t => stripTags(t).toLowerCase().includes(q)); }
/** "Gerard Glaister Colditz": an estate and a title typed together. Returns {estates, titles} (each non-empty) or null. */
function combinedSearch(q){
  q = (q || "").trim().toLowerCase().replace(/\s+/g, " ");
  if(!q || !q.includes(" ")) return null;
  const items = STATE.data.items;
  const tokensIn = (txt, rest) => rest.split(" ").filter(Boolean).every(t => txt.includes(t));
  const estates = new Map(), titles = [];
  const addTitle = (item, t) => { if(!titles.some(x => x.item === item && x.title === t)) titles.push({ item, title: t }); };
  // title text inside the query -> the rest names the estate
  for(const it of items) for(const t of it.titles || []){
    const lab = stripTags(t).toLowerCase(); if(lab.length < 3 || !q.includes(lab)) continue;
    const rest = q.replace(lab, " ").replace(/\s+/g, " ").trim(); if(!rest) continue;
    for(const e of items) if(tokensIn((e.name + " " + (e.owner || "")).toLowerCase(), rest)){ estates.set(e.id, e); if((e.titles || []).some(x => stripTags(x).toLowerCase() === lab)) addTitle(e, (e.titles || []).find(x => stripTags(x).toLowerCase() === lab)); }
  }
  // estate name inside the query -> the rest names the title
  for(const e of items){
    const nm = e.name.toLowerCase(), base = nm.replace(/\s+estate$/, "");
    const hit = [nm, base].find(n => n.length >= 3 && q.includes(n)); if(!hit) continue;
    const rest = q.replace(hit, " ").replace(/\s+/g, " ").trim(); if(!rest) continue;
    for(const t of e.titles || []) if(tokensIn(stripTags(t).toLowerCase(), rest)){ estates.set(e.id, e); addTitle(e, t); }
  }
  if(!estates.size || !titles.length) return null;
  return { estates: Array.from(estates.values()).sort((a, b) => byName(a.name, b.name)), titles: titles.sort((a, b) => byName(stripTags(a.title), stripTags(b.title))) };
}
function renderCombinedResults(res){
  const panel = el(`<div class="panel"><div class="panel-head"><div><h2>Search results</h2><div class="section-note" style="margin-top:2px;">Matched an estate and a title. Click either to open it.</div></div></div><div class="panel-pad" data-role="list"></div></div>`);
  const list = panel.querySelector('[data-role="list"]');
  const row = (name, sub, onClick) => {
    const r = el(`<div class="pulse-row"><div class="pulse-left"><span class="dot" style="background:var(--slate)"></span><div><div class="pulse-name" data-open></div><div class="pulse-sub"></div></div></div></div>`);
    r.querySelector("[data-open]").textContent = name; r.querySelector(".pulse-sub").textContent = sub;
    r.querySelector("[data-open]").onclick = onClick; return r;
