<style>
  :root{
    --bg: #EAF4FB;
    --panel: #FFFFFF;
    --panel-alt: #E3EFF8;
    --panel-raised: #D3E6F5;
    --ink: #10202E;
    --border: #10202e2b;
    --border-soft: #10202e18;
    --text: #10202E;
    --text-dim: #4C6579;
    --text-faint: #8CA4B5;
    --green: #3f8a5b;
    --green-bg: #3f8a5b1a;
    --amber: #b8791a;
    --amber-bg: #f4c65c33;
    --gold: #4FA8E0;
    --gold-deep: #2E86C7;
    --red: #C91828;
    --red-bg: #C918281a;
    --red-deep: #97121E;
    --slate: #6b7280;
    --slate-bg: #6b72801a;
    --indigo: #16324a;
    --indigo-bg: #10202e0f;
    --radius: 10px;
    --radius-lg: 18px;
    --shadow-hard: 5px 5px 0 var(--ink);
    --shadow-hard-sm: 3px 3px 0 var(--ink);
    --font-display: 'Space Grotesk', ui-sans-serif, sans-serif;
    --font-body: 'Inter', ui-sans-serif, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    zoom: 1.14;
  }
  ::selection{ background: var(--gold); color: var(--ink); }
  a{ color: inherit; }
  .rich-editable a, .rich-line a{ color: var(--gold); text-decoration:underline; }
  button{ font-family: inherit; }
  input, select, textarea{ font-family: inherit; font-size: inherit; }

  #app{ max-width: 1280px; margin: 0 auto; padding: 0 28px 90px; }

  /* ---- Top nav ---- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding: 18px 0; border-bottom: 1.5px solid var(--ink); margin-bottom: 34px; flex-wrap:wrap;
  }
  .topnav-left{ display:flex; align-items:center; gap:34px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap: 11px; }
  .mark{
    width: 38px; height:38px; border-radius: 9px; background: var(--ink);
    display:inline-flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size:14px; font-weight:700; color: var(--gold);
    flex-shrink:0;
  }
  .mark-lg{ width:64px; height:64px; border-radius:14px; font-size:22px; }
  .mark-outline{ background: var(--panel); border: 2px solid var(--red); border-radius:4px; }
  .mark-transparent{ background: transparent; border:none; }
  .mark-img{ height:62%; width:auto; display:block; }
  .brand-wordmark{ height:20px; width:auto; display:block; }
  .brand .sub{ color: var(--text-faint); font-size: 10.5px; font-family: var(--font-mono); letter-spacing:0.06em; text-transform:uppercase; margin-top:3px; }
  .nav-tabs{ display:flex; align-items:center; gap:26px; }
  .nav-tab{
    font-size:13.5px; font-weight:600; color: var(--text-faint); cursor:pointer; padding-bottom:6px;
    border-bottom: 2.5px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .nav-tab.active{ color: var(--ink); border-bottom-color: var(--ink); }
  .nav-tab:hover{ color: var(--ink); }
  .nav-tab .count{ background: var(--panel-raised); color: var(--text-dim); font-family:var(--font-mono); font-size:10.5px; padding:1px 6px; border-radius:100px; }
  .topnav-right{ display:flex; align-items:center; gap:16px; }
  .search-box{
    display:flex; align-items:center; gap:6px; background: var(--panel-alt); border:1.5px solid var(--border);
    border-radius: 100px; padding: 7px 14px; min-width: 200px;
  }
  .search-box input{ border:none; background:transparent; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color: var(--text-faint); }
  .updated-pill{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-dim); white-space:nowrap; font-family: var(--font-mono);}
  .updated-pill .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); flex-shrink:0; }
  .updated-pill.saving .dot{ background: var(--amber); }
  .avatar{
    width:32px; height:32px; border-radius:50%; background: var(--gold); color: var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family: var(--font-display);
    border: 1.5px solid var(--ink);
  }

  .btn{
    background: var(--panel); color: var(--text); border: 1.5px solid var(--ink);
    padding: 9px 16px; border-radius: 100px; cursor:pointer; font-size: 13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition: transform .1s, box-shadow .1s;
  }
  .btn:hover{ transform: translate(-1px,-1px); box-shadow: var(--shadow-hard-sm); }
  .btn-primary{ background: var(--red); border-color: var(--ink); color: #fff; }
  .btn-primary:hover{ background: var(--red-deep); }
  .btn-ghost{ background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; border-radius:8px;}
  .btn-ghost:hover{ background: var(--panel-alt); color: var(--text); transform:none; box-shadow:none; }
  .btn-sm{ padding: 6px 12px; font-size:12px; }
  .btn-danger{ color: var(--red); }

  .panel{ background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); }
  .panel + .panel{ margin-top: 18px; }
  .panel-pad{ padding: 20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px;
    border-bottom: 1.5px solid var(--ink);
  }
  .panel-head h2{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0; }
  .panel-head .eyebrow{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; display:block; margin-bottom:2px; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding: 4px 10px; border-radius: 100px;
    font-size: 11.5px; font-weight:700; font-family: var(--font-mono); letter-spacing: 0.01em;
    white-space: nowrap; border:1px solid transparent;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; }
  .badge-green{ background: var(--green-bg); color: var(--green); }
  .badge-green .dot{ background: var(--green); }
  .badge-yellow{ background: var(--amber-bg); color: var(--amber); }
  .badge-yellow .dot{ background: var(--amber); }
  .badge-red{ background: var(--red-bg); color: var(--red); }
  .badge-red .dot{ background: var(--red); }
  .badge-completed{ background: var(--slate-bg); color: var(--slate); }
  .badge-completed .dot{ background: var(--slate); }

  .pill{ font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius:100px; font-weight:600; }
  .pill-late{ background: var(--red-bg); color: var(--red); }
  .pill-move{ background: var(--panel-alt); color: var(--text-dim); border:1px solid var(--border); }
  .pill-onplan{ background: var(--panel-alt); color: var(--text-faint); }
  .pill-priority{ background: var(--red); color: #fff; border:1px solid var(--ink); }
  .pill-pending{ background: var(--slate-bg); color: var(--slate); }

  /* ---- Header block ---- */
  .page-head{ margin-bottom: 26px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .page-head h1.page-title{ font-family: var(--font-display); font-size: 42px; font-weight:700; margin: 4px 0 8px; letter-spacing:-0.02em; }
  .page-head .page-sub{ color: var(--text-dim); font-size: 14.5px; max-width: 520px; }
  .page-head-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---- Item cards ---- */
  .item-card{
    background: var(--panel); border:1.5px solid var(--ink); border-radius: var(--radius-lg); padding: 18px 20px;
    cursor:pointer; transition: transform .12s;
  }
  .item-card:hover{ transform: translate(-2px,-2px); box-shadow: var(--shadow-hard); }
  .item-card + .item-card{ margin-top: 12px; }
  .item-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; margin-bottom: 12px;}
  .item-title-block h3{ font-family: var(--font-display); font-size: 16px; font-weight:700; margin:0 0 3px; }
  .item-meta{ color: var(--text-faint); font-size: 12.5px; }
  .item-meta .sep{ margin: 0 6px; opacity:.5; }
  .item-progress{ color: var(--text-dim); font-size: 12.5px; margin-top:4px; }
  .item-badges{ display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}

  .empty{ padding: 40px 20px; text-align:center; color: var(--text-faint); }
  .empty .big{ font-family: var(--font-display); color: var(--text-dim); font-size:15px; margin-bottom:4px; }

  /* ---- Slate timeline (shared axis, overview) ---- */
  .slate-legend{ display:flex; align-items:center; gap:16px; font-size:12px; color: var(--text-dim); }
  .slate-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .slate-legend .dot{ width:7px; height:7px; border-radius:50%; }
  .slate-nav{ display:flex; gap:8px; }
  .slate-timeline{ padding: 20px; overflow-x:auto; }
  .slate-axis{ position:relative; height: 26px; border-bottom: 1px solid var(--border); margin-bottom:6px; min-width: 640px; }
  .slate-axis .month{ position:absolute; top:0; border-left:1px solid var(--border); font-size:11px; font-family: var(--font-mono); color: var(--text-faint); padding-left:6px; height:100%; }
  .slate-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); min-width: 640px; cursor:pointer; }
  .slate-row:hover .slate-row-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
  .slate-row:last-child{ border-bottom:none; }
  .slate-row-label{ width: 190px; flex-shrink:0; display:flex; align-items:flex-start; gap:9px; }
  .slate-row-label .dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .slate-row-name{ font-weight:700; font-size:13.5px; }
  .slate-row-track{ position:relative; flex:1; height: 22px; }
  .slate-bar{ position:absolute; top:4px; height:14px; border-radius:100px; }
  .slate-today{ position:absolute; top:-11px; bottom:-11px; border-left: 1.5px dashed var(--ink); }

  /* ---- Detail timeline ---- */
  .timeline-wrap{ overflow-x:auto; padding-top: 4px; }
  .timeline{ position:relative; }
  .timeline-grid{ position:relative; height: 1px; }
  .timeline-track{ position:relative; height: 22px; margin-bottom: 5px; }
  .timeline-track:last-child{ margin-bottom:0; }
  .tl-bar{ position:absolute; top:4px; height:14px; border-radius:4px; }
  .tl-ghost{ position:absolute; top:4px; height:14px; border-radius:4px; border: 1.5px dashed; background:transparent; opacity:.6; }
  .tl-milestone{ position:absolute; top:2px; width:14px; height:14px; transform: translateX(-50%) rotate(45deg); border-radius:3px; }
  .tl-label{ position:absolute; top:4px; font-size:10.5px; font-family: var(--font-mono); color: var(--text-faint); white-space:nowrap; transform: translateX(4px); line-height:14px;}
  .tl-month{ position:absolute; top:0; bottom:0; border-left: 1px dashed var(--border); font-size: 9.5px; color: var(--text-faint); font-family: var(--font-mono); padding-left:3px;}
  .tl-today{ position:absolute; top:-6px; bottom:-6px; border-left: 1.5px solid var(--ink); }
  .tl-today::after{ content:'today'; position:absolute; top:-14px; left:3px; font-size:9px; color: var(--ink); font-family: var(--font-mono); }

  /* ---- Production pulse ---- */
  .pulse-row{ display:flex; align-items:center; justify-content:space-between; padding: 10px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
  .pulse-row:last-child{ border-bottom:none; }
  .pulse-row:hover .pulse-name{ text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .pulse-left{ display:flex; align-items:center; gap:9px; cursor:pointer; }
  .pulse-left .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pulse-name{ font-weight:700; font-size:13px; }
  .pulse-sub{ color: var(--text-faint); font-size:11px; margin-top:1px; }
  .estate-categories{ display:flex; flex-direction:column; gap:20px; }

  /* ---- To-do ---- */
  .title-card{ padding:14px 0; border-bottom:1px solid var(--border-soft); }
  .title-card:last-child{ border-bottom:none; }
  .title-card-updates{ margin-top:12px; }
  .title-card-head{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
  .title-card-name{ font-weight:700; font-size:14px; }
  .title-card-estate{ font-size:12px; color: var(--text-dim); cursor:pointer; margin-top:1px; }
  .title-card-estate:hover{ text-decoration:underline; text-decoration-color: var(--gold); text-decoration-thickness:2px; }
  .title-card-facts{ display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:8px; font-size:12px; color: var(--text-dim); }
  .title-card-facts b{ font-weight:600; color: var(--text-faint); font-family: var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; margin-right:3px; }
  .title-card-logline{ margin-top:8px; font-size:12.5px; color: var(--text-dim); line-height:1.5; }
  .todo-entry-titles, .todo-entry-name{ color: #2B6FAE; }
  .todo-text-row{ display:flex; align-items:center; gap:8px; }
  .todo-text-holder{ flex:0 1 auto; min-width:80px; }
  .todo-item-row:not(.is-done) .todo-task-input{ color: var(--red); }
  .urgent-toggle{
    flex:0 0 auto; background:none; border:1px dashed var(--border); color: var(--text-faint); font-family: var(--font-mono);
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 9px; border-radius:100px; cursor:pointer;
  }
  .urgent-toggle:hover{ border-color: var(--red); color: var(--red); }
  .urgent-toggle.on{ background: var(--red); border:1px solid var(--red); color:#fff; font-weight:700; }
  .todo-eyebrow{ font-size:11.5px; color: var(--text-dim); letter-spacing:0.01em; padding:2px 0; min-height:16px; }
  .todo-eyebrow:empty::before{ content: attr(data-placeholder); color: var(--text-faint); }
  .todo-item-notes{ margin-top:1px; }
  [data-role="list"] > .todo-entry:first-child{ padding-top:0; margin-top:-8px; }
  .progress-row{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px solid var(--border-soft); }
  .progress-row:first-child{ border-top:none; padding-top:0; }
  .progress-when{ flex:0 0 118px; font-family: var(--font-mono); font-size:11px; color: var(--text-faint); padding-top:2px; }
  .progress-body{ flex:1; min-width:0; }
  .progress-text{ font-weight:600; font-size:13px; }
  .progress-text.is-done{ color: var(--text-dim); }
  .progress-notes{ font-size:12px; color: var(--text-dim); margin-top:2px; }
  .pill-urgent{ background: var(--red); color:#fff; }
  .todo-heading-holder{ margin-bottom:10px; }
  .todo-heading-input{ font-weight:700; font-size:14px; border-bottom:1px dashed var(--border); padding:4px 0; }
  .todo-view-toggle{ display:flex; gap:6px; align-items:center; }
  .todo-lines{ margin-top:4px; }
  .rich-editable ul, .rich-editable ol, .todo-notes-live ul, .todo-notes-live ol, .progress-notes ul, .td-readonly-text ul{ margin:2px 0; padding-left:20px; list-style:disc; }
  .rich-editable ol, .todo-notes-live ol{ list-style:decimal; }
  .rich-editable li, .todo-notes-live li, .progress-notes li{ margin:1px 0; }
  .todo-drag{ cursor:grab; color: var(--text-faint); font-size:14px; line-height:1; align-self:flex-start; margin-top:4px; opacity:.55; user-select:none; flex:0 0 auto; }
  .todo-drag:hover{ opacity:1; color: var(--text-dim); }
  .todo-drag:active{ cursor:grabbing; }
  .todo-entry-drag{ margin:0 2px 0 -2px; align-self:center; }
  .todo-entry-sub{ font-weight:400; font-size:11px; color: var(--text-faint); margin-left:6px; }
  .todo-entry.dragging-note{ opacity:.45; }
  .todo-notes-live{ font-size:12.5px; color: var(--text-dim); line-height:1.5; margin-top:4px; min-height:1.5em; }
  .todo-notes-live:focus{ background: var(--panel-alt); border-radius:4px; }
  .todo-line{ font-size:12.5px; color: var(--text-dim); line-height:1.5; }
  .todo-items{ margin-top:8px; }
  .todo-item-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-top:1px solid var(--border-soft); }
  .todo-item-row:first-child{ border-top:none; }

  /* Native <input type="date"> renders its value in the browser's own locale
     format, which CSS/JS cannot restyle directly. To show our own format
     (Mon. DD, YYYY) we hide the native text when the field isn't focused and
     overlay a formatted, click-through span in its place; while typing/using
     the picker the native text shows through normally. */
  .date-field{ position:relative; display:inline-block; }
  .date-field .date-input, .date-field .step-note-date-input{ color:transparent; caret-color: var(--text); position:relative; z-index:0; }
  .date-field .date-input:focus, .date-field .step-note-date-input:focus{ color: var(--text); }
  .date-field-display{
    position:absolute; left:8px; right:22px; top:50%; transform:translateY(-50%); z-index:1;
    font-family: var(--font-mono); font-size:11.5px; color: var(--text); pointer-events:none; white-space:nowrap;
    overflow:hidden; text-overflow:clip;

  .date-field .step-note-date-input:focus ~ .date-field-display{ opacity:0; }

<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   DATES — ported from dates.ts. Guarded: never throws, degrades to null/—.
   ========================================================================= */
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function isValidDate(value){
  if(!value || !ISO_DATE.test(value)) return false;
  const t = new Date(`${value}T12:00:00Z`).getTime();
  return !Number.isNaN(t);
}
function parseDate(value, utc){
  if(!isValidDate(value)) return null;
  const d = new Date(`${value}T12:00:00${utc ? "Z" : ""}`);
  return Number.isNaN(d.getTime()) ? null : d;
}
function todayISO(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}
// Guarded formatter — a bad date must never blank the page (see LESSONS.md).
// Canonical display format across the app: Mon. DD, YYYY (e.g. Aug. 14, 2026).
function fmtDate(value){
  try{
    const d = parseDate(value, true);
    if(!d) return "—";
    const month = new Intl.DateTimeFormat("en-US", { month:"short" }).format(d);
    const day = String(d.getUTCDate()).padStart(2, "0");
    const year = d.getUTCFullYear();
    return `${month}. ${day}, ${year}`;
  }catch(e){ return "—"; }
}
function fmtDateShort(value){
  return fmtDate(value);
}
/** Wraps a native <input type="date"> with a formatted, click-through display
 * span (see the .date-field CSS) so the visible text reads in our own format
 * instead of the browser's locale-default rendering. */
function wrapDateField(inputEl, value, placeholder){
  const wrapper = document.createElement("div");
  wrapper.className = "date-field";
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const display = document.createElement("span");
  const valid = isValidDate(value);
  display.className = "date-field-display" + (valid ? "" : " placeholder");
  display.textContent = valid ? fmtDate(value) : (placeholder || "Select date");
  wrapper.appendChild(display);
  return wrapper;
}
function daysBetween(start, end){
  const a = parseDate(start, true), b = parseDate(end, true);
  if(!a || !b) return 0;
  return Math.max(0, Math.round((b.getTime() - a.getTime()) / 86400000));
}
function addDaysISO(value, n){
  const d = parseDate(value, true);
  if(!d) return value;
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

  const first = parseDate(start, true);
  if(!first || !isValidDate(end)) return [];
  const markers = [start];
  const cursor = new Date(first);
  cursor.setUTCDate(1);
  cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  while(cursor.toISOString().slice(0,10) < end){
    markers.push(cursor.toISOString().slice(0,10));
    cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  }
  if(markers.at(-1) !== end) markers.push(end);
  return markers;
}

/* =========================================================================
   SCHEDULE / VARIANCE — ported + generalised from schedule.ts.
   One derivation path: itemScheduleItems() is the only function that turns
   stored rows into bars. Every view (overview + detail) calls this and
   nothing else — see LESSONS.md "the overview and the detail page disagreed".
   ========================================================================= */

// [field, label while unfinished (no actual date yet), label once completed]
const STEP_FIELDS = [
  ["target_call", "Call", "Called"],
  ["target_pitch", "Make the Pitch", "Pitch Made"],
  ["target_proposal", "Make the Proposal", "Proposal Made"],
  ["target_rights_secured", "Secure Rights", "Rights Secured"],
];
/** Per-item rename of a preset step — overrides the tensed default below. */
function migrateStepLabelOverrides(item){
  if(!item.stepLabelOverrides || typeof item.stepLabelOverrides !== "object") item.stepLabelOverrides = {};
}
function updateStepLabelOverride(item, field, value){
  migrateStepLabelOverrides(item);
  const trimmed = (value || "").trim();
  const old = item.stepLabelOverrides[field] || "";
  const defaultLabel = defaultStepLabel(item, field);
  if(trimmed === old) return;
  if(!trimmed || trimmed === defaultLabel){
    delete item.stepLabelOverrides[field];
  }else{
    item.stepLabelOverrides[field] = trimmed;
  }
  recordChange(item.id, "item", item.id, item.name, "stepLabel", "Step renamed", old || defaultLabel, trimmed || defaultLabel);
  scheduleSave();
  render();
}
/** The tensed default label, ignoring any override — used as the fallback
 * and to detect when a rename just matches the default (no override needed). */
function defaultStepLabel(item, field){
  const entry = STEP_FIELDS.find(f => f[0] === field);
  if(!entry) return field;
  const done = Boolean(item && item.stepActuals && item.stepActuals[field]);
  return done ? entry[2] : entry[1];
}
/** The label for a step: a per-item rename if one exists, otherwise the
 * default, tensed to whether it's been marked done on this item. */
function stepLabel(item, field){
  migrateStepLabelOverrides(item);
  if(item.stepLabelOverrides[field]) return item.stepLabelOverrides[field];
  return defaultStepLabel(item, field);
}

const STATUS_RANK = { green:0, completed:0, yellow:1, red:2 };
function worseStatus(a, b){
  if(!a) return b; if(!b) return a;
  return STATUS_RANK[b] > STATUS_RANK[a] ? b : a;
}

/** Derived (auto) health: worst of real lateness and confirmed movement across the steps (rule 3.3). */
function autoHealth(data, item){
  let worst = "green";
  const late = itemLateness(data, item);
  if(late !== null){
    if(late >= 7) worst = worseStatus(worst, "red");
    else if(late >= 1) worst = worseStatus(worst, "yellow");
  }
  const slip = itemSlip(data, item);
  if(slip !== null && slip > 0){
    if(slip >= 21) worst = worseStatus(worst, "red");
    else if(slip >= 7) worst = worseStatus(worst, "yellow");
  }
  return worst;
}
/** item.status is a manual override; '' / null means "derive it" (see schema comment). */
function itemHealth(data, item){
  return item.status || autoHealth(data, item);
}

const STEP_BAR_LABELS = { "step-1-2": "Outreach", "step-2-3": "Pitching", "step-3-4": "Finalizing" };

/** Canonical list of bars + milestones for one item. Malformed dates are simply not drawn. */
function itemScheduleItems(data, item){
  const health = itemHealth(data, item);
  const rightsSecuredActual = item.stepActuals && item.stepActuals.target_rights_secured;
  const out = [
    { id: "step-1-2", label: STEP_BAR_LABELS["step-1-2"], start: item.target_call, end: item.target_pitch, health },
    { id: "step-2-3", label: STEP_BAR_LABELS["step-2-3"], start: item.target_pitch, end: item.target_proposal, health },
    { id: "step-3-4", label: STEP_BAR_LABELS["step-3-4"], start: item.target_proposal, end: item.target_rights_secured, health },
    { id: "rights-secured", label: stepLabel(item, "target_rights_secured"), start: item.target_rights_secured, end: item.target_rights_secured, health: rightsSecuredActual ? "completed" : health, milestone: true },
  ];
  return out.filter(i => isValidDate(i.start) && isValidDate(i.end));
}

function latestBaseline(data, entityId, field){
  const rows = data.baselines.filter(b => b.entityId === entityId && b.field === field);
  if(!rows.length) return null;
  return rows.reduce((best, r) => r.generation > best.generation ? r : best, rows[0]);
}
/** Movement is only meaningful once a human acknowledges it (rule 3.2). Silent otherwise. */
function slipDays(data, entityId, field, currentDate){
  if(!currentDate) return null;
  const b = latestBaseline(data, entityId, field);
  if(!b || !b.acknowledged) return null;
  const cur = parseDate(currentDate, true), base = parseDate(b.baselineDate, true);
  if(!cur || !base) return null;
  return Math.round((cur.getTime() - base.getTime()) / 86400000);
}
function ghostBaselineDate(data, entityId, field){
  const b = latestBaseline(data, entityId, field);
  return (b && b.acknowledged) ? b.baselineDate : null;
}
function itemSlip(data, item){
  migrateRemovedPresetSteps(item);
  const slips = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => slipDays(data, item.id, field, item[field]))
    .filter(v => v !== null);
  if(!slips.length) return null;
  return slips.reduce((worst, v) => v > worst ? v : worst, slips[0]);
}
/** Actual vs target, per step. Real lateness — always shown, never needs interpretation. */
function latenessDays(actual, target){
  const a = parseDate(actual, true), t = parseDate(target, true);
  if(!a || !t) return null;
  return Math.round((a.getTime() - t.getTime()) / 86400000);
}
function stepLateness(item, field){
  const actual = item.stepActuals && item.stepActuals[field];
  return latenessDays(actual, item[field]);
}
/** Worst real lateness across a item's steps — the "actual" half of rule 3.3. Includes custom steps. */
function itemLateness(data, item){
  migrateCustomSteps(item);
  migrateRemovedPresetSteps(item);
  const presetValues = STEP_FIELDS
    .filter(([field]) => !item.removedPresetSteps.includes(field))
    .map(([field]) => stepLateness(item, field));
  const customValues = item.customSteps.map(cs => latenessDays(cs.actual, cs.target));
  const values = [...presetValues, ...customValues].filter(v => v !== null && v > 0);
  if(!values.length) return null;
  return Math.max(...values);
}
function formatSlip(slip){
  if(slip === null || slip === undefined) return "";
  if(slip === 0) return "on plan";
  return `${slip > 0 ? "+" : "\u2212"}${Math.abs(slip)}d`;
}
/** The free-text "current stage" the item owner sets themselves — see the header field. */
function progressLabel(data, item){
  return item.currentPhase || "Not started";
}
function migrateTodoConfig(item){
  if(!item.todo || typeof item.todo !== "object") item.todo = { stepRef: "", text: "", priority: false, assignee: "" };
  if(item.todo.stepRef === undefined) item.todo.stepRef = "";
  if(item.todo.text === undefined) item.todo.text = "";
  if(item.todo.priority === undefined) item.todo.priority = false;
  if(item.todo.assignee === undefined) item.todo.assignee = "";
}
/** item.stepPending maps a step ref (preset field name or custom step id) to
 * the ISO date it was marked "waiting on a response". Presence = pending. */
function migratePendingSteps(item){
  if(!item.stepPending || typeof item.stepPending !== "object") item.stepPending = {};
}
function isPending(item, ref){
  migratePendingSteps(item);
  return Boolean(item.stepPending[ref]);
}
function pendingSinceDate(item, ref){
  migratePendingSteps(item);
  return item.stepPending[ref] || null;
}
function pendingDays(item, ref){
  const since = pendingSinceDate(item, ref);
  return since ? daysBetween(since, todayISO()) : null;
}
/** The notes recorded against one specific step, whether preset or custom. */
function getStepNotesByRef(item, ref){
  if(STEP_FIELDS.some(f => f[0] === ref)){
    migrateStepNotes(item);
    return item.stepNotes[ref] || [];
  }
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === ref);
  return (cs && cs.notes) || [];
}
/** Most recent dated note on a step — stands in for "the date of the event"
 * (e.g. when an email was actually sent) rather than whenever someone
 * happens to flip the pending toggle. */
function latestStepNoteDate(notes){
  let best = null;
  for(const n of (notes || [])){
    if(n.date && isValidDate(n.date) && (!best || n.date > best)) best = n.date;
  }
  return best;
}
/** Inserts a note into a notes list at the position its date calls for —
 * dated notes in ascending date order, undated notes pushed to the end —
 * without disturbing the relative order of the other notes already there
 * (so a note someone has manually dragged elsewhere stays put). */
function insertNoteSorted(list, note){
  if(note.date && isValidDate(note.date)){
    let i = 0;
    while(i < list.length){
      const other = list[i];
      if(!(other.date && isValidDate(other.date))) break; // reached the undated tail
      if(other.date > note.date) break;
      i++;
    }
    list.splice(i, 0, note);
  }else{
    list.push(note);
  }
}
/** Re-sorts a single note (identified by its current index) back into date
 * order after its date changes, leaving every other note's position alone. */
function repositionNoteByDate(list, idx){
  if(!list || idx < 0 || idx >= list.length) return;
  const [note] = list.splice(idx, 1);
  insertNoteSorted(list, note);
}
/** Moves a note from one position to another (drag-and-drop reordering).
 * `toIdx` is read against the list's positions *before* the move. */
function moveArrayItem(list, fromIdx, toIdx){
  if(!list || fromIdx === toIdx || fromIdx < 0 || fromIdx >= list.length || toIdx < 0 || toIdx >= list.length) return;
  const [moved] = list.splice(fromIdx, 1);
  const adjusted = fromIdx < toIdx ? toIdx - 1 : toIdx;
  list.splice(adjusted, 0, moved);
}
function togglePending(item, ref, label){
  migratePendingSteps(item);
  if(item.stepPending[ref]){
    delete item.stepPending[ref];
    recordChange(item.id, "item", item.id, item.name, "pending", label + " no longer pending", "pending", "");
  }else{
    // Default the clock to the most recent dated note on this step (the
    // actual event — e.g. when the email went out), not today, since those
    // can be days apart. Still adjustable afterward.
    const eventDate = latestStepNoteDate(getStepNotesByRef(item, ref)) || todayISO();
    item.stepPending[ref] = eventDate;
    recordChange(item.id, "item", item.id, item.name, "pending", label + " marked pending", "", "waiting since " + eventDate);
  }
  scheduleSave();
  render();
}
function updatePendingSince(item, ref, label, value){
  migratePendingSteps(item);
  if(!item.stepPending[ref]) return;
  const old = item.stepPending[ref];
  const next = value || todayISO();
  if(old === next) return;
  item.stepPending[ref] = next;
  recordChange(item.id, "item", item.id, item.name, "pendingSince", label + " pending since", old, next);
  scheduleSave();
  render();
}
const PENDING_FOLLOWUP_DAYS = 14;
/** If a step has been pending 14+ days with no update, clear it. Returns
 * true if it just expired (the caller may want to react, e.g. by setting
 * the item's to-do text to "Follow Up"). */
function expireStalePending(item, ref){
  migratePendingSteps(item);
  const since = item.stepPending[ref];
  if(!since) return false;
  if(daysBetween(since, todayISO()) < PENDING_FOLLOWUP_DAYS) return false;
  delete item.stepPending[ref];
  recordChange(item.id, "item", item.id, item.name, "pending", "Pending expired after " + PENDING_FOLLOWUP_DAYS + " days with no update", "pending", "");
  scheduleSave();
  return true;
}
function seqEntryRef(entry){ return entry.kind === "preset" ? entry.field : entry.custom.id; }
function seqEntryLabel(item, entry){ return entry.kind === "preset" ? stepLabel(item, entry.field) : entry.custom.label; }
function seqEntryTarget(item, entry){ return entry.kind === "preset" ? item[entry.field] : entry.custom.target; }
function seqEntryActual(item, entry){ return entry.kind === "preset" ? (item.stepActuals && item.stepActuals[entry.field]) : entry.custom.actual; }
/** The featured to-do step for an item: whichever step is currently pending
 * (waiting on a response) takes priority, since that's the most actionable
 * state to surface — otherwise whichever the user has pinned
 * (item.todo.stepRef), or — by default — the first step in the full
 * sequence (presets + custom steps) with no actual date yet. */
function computeNextStep(item){
  migrateTodoConfig(item);
  // Being on hold overrides everything else in the To-Do view: no matter
  // what step would normally be next, show a single "Follow Up" entry with
  // its own target date instead.
  if(item.estateCategory === "hold" && isValidDate(item.holdFollowUpDate)){
    return {
      ref: "__hold_followup__",
      label: item.holdFollowUpLabel || "Follow-Up",
      target: item.holdFollowUpDate,
      text: "",
      priority: Boolean(item.todo.priority),
      assignee: item.todo.assignee || "",
      pending: true,
      pendingDays: null,
      holdFollowUp: true,
    };
  }
  const seq = buildStepSequence(item);
  let chosen = seq.find(e => isPending(item, seqEntryRef(e))) || null;
  if(!chosen && item.todo.stepRef){
    chosen = seq.find(e => seqEntryRef(e) === item.todo.stepRef) || null;
  }
  if(!chosen){
    chosen = seq.find(e => !seqEntryActual(item, e)) || null;
  }
  if(!chosen) return null;
  const ref = seqEntryRef(chosen);
  return {
    ref,
    label: seqEntryLabel(item, chosen),
    target: seqEntryTarget(item, chosen),
    text: item.todo.text || "",
    priority: Boolean(item.todo.priority),
    assignee: item.todo.assignee || "",
    pending: isPending(item, ref),
    pendingDays: pendingDays(item, ref),
  };
}
/** Marks whichever step a to-do ref points to (preset or custom) as done today. */
function markStepDoneByRef(item, ref, doneDate){
  const isPreset = STEP_FIELDS.some(f => f[0] === ref);
  if(isPreset){
    if(!item.stepActuals) item.stepActuals = {};
    const old = item.stepActuals[ref] || "";
    item.stepActuals[ref] = doneDate;
    const label = stepLabel(item, ref);
    recordChange(item.id, "item", item.id, item.name, ref + "Actual", label + " actual date", old, doneDate, "Marked done from the to-do list.");
    const late = stepLateness(item, ref);
    if(late && late > 0) checkKnockOnFromLateness(item.id, ref, late, label);
  }else{
    migrateCustomSteps(item);
    const cs = item.customSteps.find(c => c.id === ref);
    if(!cs) return;
    const old = cs.actual || "";
    cs.actual = doneDate;
    recordChange(item.id, "item", item.id, item.name, "customStep.actual", cs.label + " actual date", old, doneDate, "Marked done from the to-do list.");
  }
}
function updateTodoConfig(item, key, value){
  migrateTodoConfig(item);
  const old = item.todo[key] || "";

/** Items saved before the 3-stage → 4-stage step rename (target_found_contact/
 * target_contacted_estate → target_call/target_pitch/target_proposal) would
 * otherwise render with blank step data, since the old field names are no
 * longer read anywhere. Remap them in place so nothing entered under the
 * old model gets silently dropped. */
function migrateLegacyStepFieldNames(data){
  if(!data || !Array.isArray(data.items)) return;
  for(const item of data.items){
    const hasOld = item.target_found_contact !== undefined || item.target_contacted_estate !== undefined;
    const hasNew = item.target_call !== undefined || item.target_pitch !== undefined;
    if(!hasOld || hasNew) continue;
    item.target_call = item.target_found_contact || "";
    item.target_pitch = item.target_contacted_estate || "";
    if(item.target_proposal === undefined) item.target_proposal = "";
    delete item.target_found_contact;
    delete item.target_contacted_estate;
    if(item.stepActuals){
      if(item.stepActuals.target_found_contact !== undefined){
        item.stepActuals.target_call = item.stepActuals.target_found_contact;
        delete item.stepActuals.target_found_contact;
      }
      if(item.stepActuals.target_contacted_estate !== undefined){
        item.stepActuals.target_pitch = item.stepActuals.target_contacted_estate;
        delete item.stepActuals.target_contacted_estate;
      }
    }
    if(item.stepNotes){
      if(item.stepNotes.target_found_contact !== undefined){
        item.stepNotes.target_call = item.stepNotes.target_found_contact;
        delete item.stepNotes.target_found_contact;
      }
      if(item.stepNotes.target_contacted_estate !== undefined){
        item.stepNotes.target_pitch = item.stepNotes.target_contacted_estate;
        delete item.stepNotes.target_contacted_estate;
      }
    }
    if(item.stepPending){
      if(item.stepPending.target_found_contact !== undefined){
        item.stepPending.target_call = item.stepPending.target_found_contact;
        delete item.stepPending.target_found_contact;
      }
      if(item.stepPending.target_contacted_estate !== undefined){
        item.stepPending.target_pitch = item.stepPending.target_contacted_estate;
        delete item.stepPending.target_contacted_estate;
      }
    }
    if(item.stepLabelOverrides){
      if(item.stepLabelOverrides.target_found_contact !== undefined){
        item.stepLabelOverrides.target_call = item.stepLabelOverrides.target_found_contact;
        delete item.stepLabelOverrides.target_found_contact;
      }
      if(item.stepLabelOverrides.target_contacted_estate !== undefined){
        item.stepLabelOverrides.target_pitch = item.stepLabelOverrides.target_contacted_estate;
        delete item.stepLabelOverrides.target_contacted_estate;
      }
    }
  }
  if(Array.isArray(data.baselines)){
    for(const bl of data.baselines){
      if(bl.field === "target_found_contact") bl.field = "target_call";
      else if(bl.field === "target_contacted_estate") bl.field = "target_pitch";
    }
  }
}
async function loadData(){
  try{
    const res = await fetch(API_URL, { headers: API_HEADERS });
    if(res.ok){
      const body = await res.json();
      if(body && body.data){
        migrateLegacyStepFieldNames(body.data);
        if(applyRightsAvailableImport(body.data)){
          try{ await fetch(API_URL, { method: "POST", headers: API_HEADERS, body: JSON.stringify({ data: body.data }) }); }catch(e){}
        }
        return body.data;
      }
    }
  }catch(e){ /* network/API not reachable yet, or a transient failure —
    either way, DO NOT persist seed data here. A failed/empty fetch is not
    proof the store is empty, and writing over it on a guess risks silently
    destroying real data. Only an actual user edit (scheduleSave) should
    ever write to storage. */
  }
  const seeded = seedData(); applyRightsAvailableImport(seeded); return seeded;
}
function scheduleSave(){
  setSaveStatus("Editing…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    setSaveStatus("Saving…");
    try{
      const res = await fetch(API_URL, { method: "POST", headers: API_HEADERS, body: JSON.stringify({ data: STATE.data }) });
      setSaveStatus(res.ok ? "Saved" : "Save failed");
    }catch(e){
      setSaveStatus("Save failed");
    }
  }, 900);
}

}

/** Once a step's card stops showing in To-Do (replaced by the single
 * "Follow Up" entry while on hold), its notes are still fully visible on
 * the Steps panel — but to keep them easy to find in one place, copy them
 * into the general "Additional Notes" field too. Guarded so re-entering
 * hold later doesn't duplicate the copy. */
function consolidateStepNotesIntoGeneralNotes(item){
  const marker = "Notes carried over from steps (Hold for Now)";
  if((item.notes || "").includes(marker)) return;

  const seq = buildStepSequence(item);
  const allNotes = [];
  for(const entry of seq){
    const stepLbl = seqEntryLabel(item, entry);
    const notes = entry.kind === "preset"
      ? ((item.stepNotes && item.stepNotes[entry.field]) || [])
      : (entry.custom.notes || []);
    for(const n of notes){
      const d = isValidDate(n.date) ? n.date : (n.createdAt ? n.createdAt.slice(0, 10) : null);
      allNotes.push({ stepLabel: stepLbl, date: d, text: n.text });
    }
  }
  if(!allNotes.length) return;
  allNotes.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0);

  const lines = allNotes
    .map(n => `${n.date ? fmtDateShort(n.date) : "No date"} — ${escapeHtml(n.stepLabel)}: ${n.text}`)
    .join("<br>");
  const old = item.notes || "";
  item.notes = old + (old ? "<br><br>" : "") + `<b>${marker}:</b><br>` + lines;
  recordChange(item.id, "item", item.id, item.name, "notes", "Additional Notes", old, item.notes, "Step notes carried over — marked Hold for Now.");
}

/* ---- Revert (Changes tab) --------------------------------------------
 * Supported only where the log entry unambiguously identifies a single
 * settable value — a step's target date, a step's actual date, a plain
 * item field (name/notes/status), a to-do config field, or a title tag.
 * Everything else (notes by list position, custom-step edits, additions/
 * removals that don't carry the full removed object, knock-on summaries)
 * isn't offered a Revert button, rather than risk silently corrupting
 * data on a guess. */
function isStepFieldKey(field){
  return STEP_FIELDS.some(f => f[0] === field);
}
function canRevertChange(c){
  if(c.entity === "system") return false;
  if(!STATE.data.items.some(i => i.id === c.itemId)) return false;
  if(isStepFieldKey(c.field)) return true;
  if(c.field.endsWith("Actual") && isStepFieldKey(c.field.slice(0, -"Actual".length))) return true;
  if(c.field === "name" || c.field === "notes" || c.field === "status" || c.field === "todoTask") return true;
  if(c.field.startsWith("todo.")) return true;
  if(c.field === "titles") return true;
  return false;
}
function applyRevertChange(c){
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!item) return false;
  if(isStepFieldKey(c.field)){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.endsWith("Actual")){
    const key = c.field.slice(0, -"Actual".length);
    if(isStepFieldKey(key)){
      if(!item.stepActuals) item.stepActuals = {};
      item.stepActuals[key] = c.oldValue || null;
      return true;
    }
  }
  if(c.field === "name" || c.field === "notes" || c.field === "status"){
    item[c.field] = c.oldValue || "";
    return true;
  }
  if(c.field.startsWith("todo.")){
    migrateTodoConfig(item);
    const key = c.field.slice("todo.".length);
    if(key === "priority") item.todo.priority = c.oldValue === "true";
    else item.todo[key] = c.oldValue || "";
    return true;
  }
  if(c.field === "titles"){
    if(!Array.isArray(item.titles)) item.titles = [];
    if(c.newValue && !c.oldValue){
      const idx = item.titles.indexOf(c.newValue);
      if(idx !== -1) item.titles.splice(idx, 1);
    }else if(c.oldValue && !c.newValue){
      item.titles.push(c.oldValue);
    }
    return true;
  }
  return false;
}
function revertChange(c){
  if(!canRevertChange(c)) return;
  const item = STATE.data.items.find(i => i.id === c.itemId);
  if(!applyRevertChange(c)) return;
  recordChange(c.itemId, "item", c.itemId, item.name, c.field, c.fieldLabel, c.newValue, c.oldValue, "Reverted a previous change.");
  scheduleSave();
  render();
}

/* ---- baseline-aware step update (rule 3.2) ------------------------- */
function beginMilestoneUpdate(itemId, entity, entityId, field, fieldLabel, label, newValue){
  const container = STATE.data.items.find(i=>i.id===entityId);
  const oldValue = container[field];
  if(oldValue === newValue) return;
  if(!isValidDate(newValue)){
    // still allow clearing/typo entry to fail safe — just ignore malformed input
    return;
  }
  const existingBaseline = latestBaseline(STATE.data, entityId, field);
  if(!existingBaseline){
    // first time this step is ever set — becomes its own baseline, no prompt needed.
    container[field] = newValue;
    STATE.data.baselines.push({
      id: uid("bl"), itemId, entity, entityId, field, baselineDate: newValue,
      generation: 1, acknowledged: false, setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(itemId, entity, entityId, label, field, fieldLabel, oldValue, newValue, "Baseline set.");
    scheduleSave();
    render();
    return;
  }
  // A baseline already exists — this is a genuine moved date. Ask.
  STATE.pendingDecision = { itemId, entity, entityId, field, fieldLabel, label, oldValue, newValue };
  render();
}
function resolveDecision(kind){
  const d = STATE.pendingDecision;
  if(!d) return;
  const container = STATE.data.items.find(i=>i.id===d.entityId);
  container[d.field] = d.newValue;

  if(kind === "delay"){
    const b = latestBaseline(STATE.data, d.entityId, d.field);
    b.acknowledged = true;
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Confirmed as a delay against baseline.");
    STATE.pendingDecision = null;
    checkKnockOn(d.itemId, d.field, d.oldValue, d.newValue, d.fieldLabel);
    scheduleSave();
    render();
    return;
  }else if(kind === "replan"){
    const prev = latestBaseline(STATE.data, d.entityId, d.field);
    STATE.data.baselines.push({
      id: uid("bl"), itemId: d.itemId, entity: d.entity, entityId: d.entityId, field: d.field,
      baselineDate: d.newValue, generation: (prev ? prev.generation : 0) + 1, acknowledged: false,
      setAt: new Date().toISOString(), setBy: "You", note: "",
    });
    recordChange(d.itemId, d.entity, d.entityId, d.label, d.field, d.fieldLabel, d.oldValue, d.newValue, "Revised plan — new baseline set.");
  }else if(kind === "cancel"){
    STATE.pendingDecision = null;
    render();
    return;
  }
  STATE.pendingDecision = null;
  scheduleSave();
  render();
}

/* ---- knock-on proposal (rule 3.4: propose, never apply) -----------------
 * Triggered two ways: a step move confirmed as a delay, or a step's actual
 * date landing after its target (real lateness). Either way, offers to
 * shift the steps still downstream by the same number of days. */
function checkKnockOn(itemId, field, oldValue, newValue, fieldLabel){
  const shiftDays = daysBetween(oldValue, newValue);
  if(!shiftDays) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays: shiftDays, referenceLabel: fieldLabel };
}
function checkKnockOnFromLateness(itemId, field, lateDays, fieldLabel){
  if(!lateDays || lateDays <= 0) return;
  const fromIndex = STEP_FIELDS.findIndex(f => f[0] === field);
  const downstream = STEP_FIELDS.slice(fromIndex + 1).map(f => f[0]);
  if(!downstream.length) return;
  STATE.pendingKnockOn = { itemId, downstream, lateDays, referenceLabel: fieldLabel };
}
function resolveKnockOn(kind){
  const k = STATE.pendingKnockOn;
  if(!k) return;
  const item = STATE.data.items.find(i=>i.id===k.itemId);
  if(kind === "shift"){
    for(const field of k.downstream){
      const old = item[field];
      if(!isValidDate(old)) continue;
      const next = addDaysISO(old, k.lateDays);
      const prevBaseline = latestBaseline(STATE.data, item.id, field);
      item[field] = next;
      STATE.data.baselines.push({
        id: uid("bl"), itemId: item.id, entity:"item", entityId:item.id, field,
        baselineDate: next, generation: (prevBaseline ? prevBaseline.generation : 0) + 1,
        acknowledged: false, setAt: new Date().toISOString(), setBy: "knock-on", note: "",
      });
      recordChange(item.id, "item", item.id, item.name, field, stepLabel(item, field), old, next, `Shifted +${k.lateDays}d after ${k.referenceLabel} slipped.`);
    }
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "shifted", `${k.referenceLabel} slipped ${k.lateDays}d — remaining steps shifted +${k.lateDays}d.`);
  }else if(kind === "manual"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "manual", `${k.referenceLabel} slipped ${k.lateDays}d — left for manual adjustment.`);
  }else if(kind === "leave"){
    recordChange(item.id, "system", item.id, item.name, "knockOn", "Knock-on", "", "declined", `${k.referenceLabel} slipped ${k.lateDays}d — dates left as planned.`);
  }
  STATE.pendingKnockOn = null;
  scheduleSave();
  render();
}

   Free-text fields commit on blur so a rerender never fights an active edit

function el(html){

function escapeHtml(s){

}
function badgeHtml(status, label){

  return `<span class="badge badge-${cls}"><span class="dot"></span>${label || (status==="completed" ? "Completed" : cls[0].toUpperCase()+cls.slice(1))}</span>`;
}

/* Search filters the slate/pulse lists without a full top-level rerender,
   so the search box never loses focus mid-keystroke. */
function renderOverviewInPlace(){
  const holder = document.getElementById("overview-holder");
  if(!holder){ render(); return; }
  holder.innerHTML = "";
  holder.appendChild(renderCurrentTabBody());
}
function renderCurrentTabBody(){
  if(STATE.tab === "changes") return renderChangesTab();
  if(STATE.tab === "timeline") return renderTimelineTab();
  if(STATE.tab === "todo") return renderTodoTab();
  if(STATE.tab === "titles") return renderTitlesTab();
  if(STATE.tab === "summary") return renderSummaryTab();
  return renderOverviewBody();
}

function renderDecisionCard(){
  const d = STATE.pendingDecision;
  const card = el(`
    <div class="decision-card">
      <div class="dc-text">
        <b>${escapeHtml(d.label)}</b> — ${escapeHtml(d.fieldLabel)} moved
        <b>${fmtDateShort(d.oldValue)}</b> → <b>${fmtDateShort(d.newValue)}</b>.
        Is this a delay, or a revised plan?
      </div>
      <div class="decision-actions">
        <button class="btn btn-sm" id="dc-delay">It's a delay</button>
        <button class="btn btn-sm" id="dc-replan">Revised plan</button>
        <button class="btn btn-ghost btn-sm" id="dc-cancel">Cancel</button>
      </div>
    </div>
  `);
  card.querySelector("#dc-delay").onclick = () => resolveDecision("delay");
  card.querySelector("#dc-replan").onclick = () => resolveDecision("replan");

/* ---- To-Do: any number of items per estate, each with a target date and notes ---- */
function richIsEmpty(html){
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return !d.textContent.trim();
}
function stripTags(html){
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return d.textContent.trim();
}
function migrateTodos(item){
  if(!Array.isArray(item.todos)){
    item.todos = [];
    if(typeof item.todoTask === "string" && !richIsEmpty(item.todoTask)){
      item.todos.push({ id: uid("tk"), text: item.todoTask, date: "", notes: "", done: false, createdAt: "", doneAt: "" });
    }
  }
  item.todoTask = "";
}
const todoAddOpen = new Set();
let todoAddFocus = null;
function openTodos(item){
  migrateTodos(item);
  return item.todos.filter(t => !t.done && !richIsEmpty(t.text));
}
function sortedTodos(list){
  // Urgent first; otherwise the order is whatever the user dragged them into.
  return list.slice().sort((a, b) => (Boolean(a.urgent) === Boolean(b.urgent)) ? 0 : (a.urgent ? -1 : 1));
}
/** To-dos not tied to any estate or title live on a built-in "General" list. */
const GENERAL_ID = "__general";
function getGeneralItem(){
  const d = STATE.data;
  if(!d.general || typeof d.general !== "object") d.general = { id: GENERAL_ID, name: "General", todos: [], titles: [], notes: "" };
  d.general.id = GENERAL_ID; d.general.name = "General";
  migrateTodos(d.general);
  return d.general;
}
function findTodoOwner(itemId){
  return itemId === GENERAL_ID ? getGeneralItem() : STATE.data.items.find(i => i.id === itemId);
}
/** Drag a to-do before another one, within an estate or across estates / General. */
function moveTodoBefore(fromItemId, todoId, toItemId, beforeTodoId){
  const from = findTodoOwner(fromItemId), to = findTodoOwner(toItemId);
  if(!from || !to || todoId === beforeTodoId) return;
  migrateTodos(from); migrateTodos(to);
  const idx = from.todos.findIndex(x => x.id === todoId);
  if(idx === -1) return;
  const [t] = from.todos.splice(idx, 1);
  if(from !== to) t.title = "";
  let at = to.todos.findIndex(x => x.id === beforeTodoId);
  if(at === -1) at = to.todos.length;
  to.todos.splice(at, 0, t);
  if(from !== to) recordChange(to.id, "item", to.id, to.name, "todoMove", "To-do moved", from.name, to.name);
  scheduleSave();
  render();
}
function addTodo(item, text, date, title){
  const value = (text || "").trim();
  if(!value) return;
  migrateTodos(item);
  item.todos.push({ id: uid("tk"), text: escapeHtml(value), date: date || "", notes: "", done: false, createdAt: todayISO(), doneAt: "", title: title || "" });
  recordChange(item.id, "item", item.id, item.name, "todoAdd", "To-do added", "", value);
  scheduleSave();
  render();
}
function updateTodo(item, id, key, value){
  migrateTodos(item);
  const t = item.todos.find(x => x.id === id);
  if(!t) return;
  const old = t[key];
  if(old === value) return;
  t[key] = value;
  if(key === "done") t.doneAt = value ? todayISO() : "";
  if(key === "done" && !value) t.doneAt = "";
  recordChange(item.id, "item", item.id, item.name, "todo" + key.charAt(0).toUpperCase() + key.slice(1), "To-do " + key, String(old || ""), String(value || ""));
  scheduleSave();
  render();
}
function removeTodo(item, id){
  migrateTodos(item);
  const idx = item.todos.findIndex(x => x.id === id);
  if(idx === -1) return;
  const [removed] = item.todos.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "todoRemove", "To-do removed", stripTags(removed.text), "");
  scheduleSave();
  render();
}

function applyRightsAvailableImport(data){
  if(!data || !Array.isArray(data.items) || data.__rightsImportOct20_2026) return false;
  const norm = (x) => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const html = (t) => escapeHtml(t).replace(/\{mail:([^}]+)\}/g, (m, a) => `<a href="mailto:${a}" target="_blank" rel="noopener noreferrer">${a}</a>`);
  for(const e of RIGHTS_AVAILABLE_IMPORT){
    const wanted = e.names.map(norm);
    let hits = data.items.filter(i => wanted.includes(norm(i.name)));
    if(e.matchTitle){
      const byTitle = hits.filter(i => (i.titles || []).some(t => norm(t).includes(e.matchTitle)));
      if(byTitle.length) hits = byTitle;
    }
    const item = hits[0];
    if(!item) continue;
    const noteHtml = e.notes.map(n => `<div>${escapeHtml(n)}</div>`).join("");
    item.notes = (item.notes && stripTags(item.notes)) ? item.notes + noteHtml : noteHtml;

/** Splits rich-text HTML into one sanitized fragment per visual line. */
function splitNoteLines(html){
  return (html || "")
    .replace(/<\/(div|p|li)>|<br\s*\/?>/gi, "\n")
    .replace(/<\/?(div|p|ul|ol|li|span)[^>]*>/gi, "")
    .split("\n")
    .map(x => x.trim())

}
/** Contacts ("Agent: Name  phone  email") plus the estate's Additional Notes, one line each. */
function todoContactLines(item){
  migrateEstateContacts(item);
  const out = [];
  for(const ec of item.estateContacts){
    const pos = stripTags(ec.position), name = stripTags(ec.name), co = stripTags(ec.company);
    const phone = stripTags(ec.phone), email = stripTags(ec.email), note = stripTags(ec.notes);
    const who = [name, co].filter(Boolean).join(", ");
    const reach = [phone, email].filter(Boolean).join("  ");
    const line = [who, reach].filter(Boolean).join("  ");
    if(!line && !note) continue;
    out.push(`${escapeHtml(pos || "Contact")}: ${escapeHtml(line)}${note ? (line ? ". " : "") + escapeHtml(note) : ""}`);

/** The finished layout: ■ TITLE – Estate / ○ notes / ■ red to-dos. Inline styles so it pastes into Word or email intact. */
function buildTodoDocHTML(items, heading){
  const RED = "#E0301E", INK = "#000000";
  const esc = escapeHtml;
  let h = (heading && stripTags(heading)) ? `<div style="font-weight:bold;margin:0 0 4px 0;color:${INK};">${heading}</div>` : "";
  h += `<ul style="list-style-type:square;margin:0;padding-left:28px;color:${INK};">`;
  for(const item of items){

        h += `<li style="margin:10px 0;color:${RED};">${t.urgent ? `<span style="background:${RED};color:#FFFFFF;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:9px;">URGENT</span> ` : ""}${t.text}${isValidDate(t.date) ? ` (${esc(fmtDateShort(t.date))})` : ""}`;
        if(nl.length) h += `<ul style="list-style-type:circle;padding-left:44px;margin:2px 0;color:${INK};">${nl.map(l => `<li>${l}</li>`).join("")}</ul>`;
        h += `</li>`;
      }
      continue;
    }
    const titles = todoTitlesLabel(item);
    h += `<li style="margin:10px 0;">${titles ? esc(titles) + " - " : ""}${esc(item.name)}`;
    const lines = todoNoteLines(item);
    if(lines.length) h += `<ul style="list-style-type:circle;padding-left:44px;margin:2px 0;">${lines.map(l => `<li>${l}</li>`).join("")}</ul>`;
    const todos = sortedTodos(openTodos(item));
    if(todos.length){
      h += `<ul style="list-style-type:square;padding-left:44px;margin:2px 0;">`;
      for(const t of todos){
        const noteLines = splitNoteLines(t.notes);
        h += `<li style="color:${RED};">${t.urgent ? `<span style="background:${RED};color:#FFFFFF;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:9px;">URGENT</span> ` : ""}${t.text}${isValidDate(t.date) ? ` (${esc(fmtDateShort(t.date))})` : ""}`;
        if(noteLines.length) h += `<ul style="list-style-type:circle;padding-left:44px;margin:2px 0;color:${INK};">${noteLines.map(l => `<li>${l}</li>`).join("")}</ul>`;
        h += `</li>`;
      }
      h += `</ul>`;
    }
    h += `</li>`;
  }
  return h + `</ul>`;
}

function renderTodoTab(){
  const wrap = el(`<div></div>`);
  const view = STATE.todoView || "list";
  const head = el(`
    <div class="page-head">
      <div><h1 class="page-title">To-Do</h1></div>
      <div class="todo-view-toggle">
        <button class="btn btn-sm ${view === "list" ? "" : "btn-ghost"}" data-view="list">Working list</button>
        <button class="btn btn-sm ${view === "formatted" ? "" : "btn-ghost"}" data-view="formatted">Formatted</button>
      </div>
    </div>
  `);
  head.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { STATE.todoView = b.dataset.view; renderOverviewInPlace(); });
  wrap.appendChild(head);

  const today = todayISO();
  const open = STATE.data.items.filter(i => !(i.stepActuals && i.stepActuals.target_rights_secured));
  for(const i of open) migrateTodos(i);
  const holdDate = (i) => (i.estateCategory === "hold" && isValidDate(i.holdFollowUpDate)) ? i.holdFollowUpDate : null;
  const hasUrgent = (i) => openTodos(i).some(t => t.urgent);
  const general = getGeneralItem();
  const order = Array.isArray(STATE.data.todoOrder) ? STATE.data.todoOrder : [];
  const ordIdx = (i) => { const k = order.indexOf(i.id); return k === -1 ? 1e9 : k; };
  const rows = open.concat([general])
    .filter(i => i.id === GENERAL_ID || openTodos(i).length || holdDate(i))
    .sort((a, b) => {
      if(hasUrgent(a) !== hasUrgent(b)) return hasUrgent(a) ? -1 : 1;
      const d = ordIdx(a) - ordIdx(b);
      if(d) return d;
      return (todoTitlesLabel(a) || a.name).localeCompare(todoTitlesLabel(b) || b.name);
    });

  if(view === "formatted"){
    const withTodos = rows.filter(i => openTodos(i).length);
    const panel = el(`
      <div class="panel">
        <div class="panel-head"><div><h2>Formatted</h2></div><div><span class="todo-copy-msg" id="todo-copy-msg"></span> <button class="btn btn-sm" id="todo-copy">Copy</button></div></div>
        <div class="panel-pad"><div id="todo-heading-holder" class="todo-heading-holder"></div><div class="todo-doc" id="todo-doc"></div></div>
      </div>
    `);
    const docEl = panel.querySelector("#todo-doc");
    const headingLine = createRichTextLine(STATE.data.todoHeading || "", "Heading (optional) — e.g. Rights Available:", "todo-heading-input");
    panel.querySelector("#todo-heading-holder").appendChild(headingLine);
    bindCommitRich(headingLine, v => { STATE.data.todoHeading = v; scheduleSave(); renderOverviewInPlace(); });
    if(withTodos.length) docEl.innerHTML = buildTodoDocHTML(withTodos);
    else docEl.appendChild(el(`<div class="section-note">No open to-dos yet.</div>`));
    const msg = panel.querySelector("#todo-copy-msg");
    panel.querySelector("#todo-copy").onclick = async () => {
      const hdText = stripTags(STATE.data.todoHeading);
      const hdHtml = hdText ? `<div style="font-weight:bold;margin:0 0 4px 0;">${STATE.data.todoHeading}</div>` : "";
      const html = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;">${hdHtml}${docEl.innerHTML}</div>`;
      try{
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([(hdText ? hdText + "\n" : "") + docEl.innerText], { type: "text/plain" }),
        })]);
        msg.textContent = "Copied";
      }catch(e){
        const range = document.createRange(); range.selectNodeContents(docEl);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
        msg.textContent = ok ? "Copied" : "Select the text and copy it";
      }
      setTimeout(() => { msg.textContent = ""; }, 2500);
    };
    wrap.appendChild(panel);
    return wrap;
  }

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><h2>What needs doing</h2></div></div>
      <div class="panel-pad" data-role="list"></div>
    </div>
  `);
  const list = panel.querySelector('[data-role="list"]');
  if(!rows.length) list.appendChild(el(`<div class="section-note">No to-dos yet. Add one below, or on any estate's page.</div>`));
  for(const item of rows){
    const titles = todoTitlesLabel(item);
    const isGeneral = item.id === GENERAL_ID;
    const lines = isGeneral ? [] : todoContactLines(item);
    const hd = holdDate(item);
    const entry = el(`
      <div class="todo-entry">
        <div class="todo-entry-head" data-role="open" title="${isGeneral ? "" : "Open estate"}">
          <span class="todo-drag todo-entry-drag" draggable="true" data-role="entry-drag" title="Drag to reorder">&#10303;</span>
          ${titles ? `<span class="todo-entry-titles">${escapeHtml(titles)}</span> – ` : ""}<span class="todo-entry-name">${escapeHtml(item.name)}</span>${isGeneral ? `<span class="todo-entry-sub">not linked to an estate or title</span>` : ""}
          ${hd ? `<span class="pill ${hd < today ? "pill-late" : "pill-pending"}">${hd < today ? "follow-up overdue" : "follow up"} ${fmtDateShort(hd)}</span>` : ""}
        </div>
        <div class="todo-lines">${lines.map(l => `<div class="todo-line">${l}</div>`).join("")}</div>
        <div data-holder="items"></div>
      </div>
    `);
    if(!lines.length) entry.querySelector(".todo-lines").remove();
    // Estate notes: live, editable text (the same Additional Notes shown on the estate page)
    const liveNotes = document.createElement("div");
    liveNotes.className = "rich-line todo-notes-live";
    liveNotes.contentEditable = "true";
    liveNotes.setAttribute("data-placeholder", "Add notes…");
    liveNotes.innerHTML = item.notes || "";
    bindBulletShortcuts(liveNotes);
    bindCommitRich(liveNotes, v => { updateItemField(item, "notes", v); });
    liveNotes.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); liveNotes.blur(); }
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); insertLinkAtSelection(liveNotes); }
    });
    if(!isGeneral) entry.querySelector('[data-holder="items"]').before(liveNotes);
    entry.querySelector('[data-role="open"]').onclick = () => { if(isGeneral) return; STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
    const eh = entry.querySelector('[data-role="entry-drag"]');
    eh.addEventListener("click", (e) => e.stopPropagation());
    eh.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "entry|" + item.id);
      STATE.dragKind = "entry";
      try{ e.dataTransfer.setDragImage(entry, 10, 10); }catch(_){}
      entry.classList.add("dragging-note");
    });
    eh.addEventListener("dragend", () => { STATE.dragKind = ""; entry.classList.remove("dragging-note"); });
    entry.addEventListener("dragover", (e) => { if(STATE.dragKind === "entry"){ e.preventDefault(); entry.classList.add("drop-target-note"); } });
    entry.addEventListener("dragleave", (e) => { if(e.target === entry) entry.classList.remove("drop-target-note"); });
    entry.addEventListener("drop", (e) => {
      entry.classList.remove("drop-target-note");
      const parts = (e.dataTransfer.getData("text/plain") || "").split("|");
      if(parts[0] !== "entry") return;
      e.preventDefault();
      const ids = rows.map(r => r.id);
      const from = ids.indexOf(parts[1]), to = ids.indexOf(item.id);
      if(from === -1 || to === -1 || from === to) return;
      moveArrayItem(ids, from, from < to ? to + 1 : to);
      STATE.data.todoOrder = ids;
      scheduleSave();
      renderOverviewInPlace();
    });
    entry.querySelector('[data-holder="items"]').appendChild(renderTodoItemsEditor(item));
    list.appendChild(entry);
  }

  // Quick add: type an estate name or a title (autocompletes) and write a to-do.
  const options = []; // {label, item}
  for(const i of open){
    options.push({ label: i.name, item: i, title: "" });
    for(const t of (i.titles || [])){
      const tt = stripTags(t);
      if(tt) options.push({ label: `${tt} — ${i.name}`, item: i, title: t });
    }
  }
  options.push({ label: "General (no estate or title)", item: general, title: "" });
  options.sort((x, y) => x.label.localeCompare(y.label));
  if(options.length){
    const add = el(`
      <div>
        <div class="step-note-add todo-add">
          <input type="text" class="step-note-input todo-add-estate" id="todo-add-estate" list="todo-add-list" placeholder="Estate or title (blank = General)…" autocomplete="off" />
          <input type="text" class="step-note-input" id="todo-add-text" placeholder="Add a to-do…" />
        </div>
        <div class="todo-add-msg section-note" id="todo-add-msg" style="display:none;"></div>
        <datalist id="todo-add-list">${options.map(o => `<option value="${escapeHtml(o.label)}"></option>`).join("")}</datalist>
      </div>
    `);
    const msg = add.querySelector("#todo-add-msg");
    const say = (t) => { msg.textContent = t; msg.style.display = t ? "" : "none"; };
    const resolve = (q) => {
      const query = q.trim().toLowerCase();
      if(!query) return { item: general, title: "" };
      const exact = options.filter(o => o.label.toLowerCase() === query);
      const hits = exact.length ? exact : options.filter(o => o.label.toLowerCase().includes(query));
      const ids = [...new Set(hits.map(o => o.item.id))];
      if(ids.length === 1) return { item: hits[0].item, title: hits.length === 1 ? hits[0].title : "" };
      if(!ids.length) return { err: "No estate or title matches that." };
      return { err: "That matches more than one estate — keep typing and pick one from the list." };
    };
    const doAdd = () => {
      const text = add.querySelector("#todo-add-text").value.trim();
      const r = resolve(add.querySelector("#todo-add-estate").value);
      if(r.err){ say(r.err); return; }
      if(!text){ say("Write the to-do text first."); return; }
      addTodo(r.item, text, "", r.title);
    };
    for(const id of ["#todo-add-text", "#todo-add-estate"]){
      add.querySelector(id).addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); if(id === "#todo-add-estate") add.querySelector("#todo-add-text").focus(); else doAdd(); } });
    }
    panel.querySelector(".panel-pad").appendChild(add);
  }
  wrap.appendChild(panel);
  return wrap;
}

function renderSummaryBox(item){
  const seq = buildStepSequence(item);
  const completed = seq.filter(e => isValidDate(seqEntryActual(item, e)));

  // Every note across every step (preset + custom), each tagged with the
  // step it belongs to and dated (preferring the note's own date over its
  // creation timestamp).
  const allNotes = [];
  for(const entry of seq){
    const stepLbl = seqEntryLabel(item, entry);
    const notes = entry.kind === "preset"
      ? ((item.stepNotes && item.stepNotes[entry.field]) || [])
      : (entry.custom.notes || []);
    for(const n of notes){
      const d = isValidDate(n.date) ? n.date : (n.createdAt ? n.createdAt.slice(0, 10) : null);
      allNotes.push({ stepLabel: stepLbl, date: d, text: n.text });
    }
  }
  allNotes.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0);

  const next = computeNextStep(item);
  let nextLine;
  if(!next){
    nextLine = `<div class="summary-line summary-empty">All steps complete — Rights Secured.</div>`;
  }else{
    const bits = [escapeHtml(next.label)];
    if(next.pending && !next.holdFollowUp) bits.push(`waiting on a response${next.pendingDays !== null ? ` (${next.pendingDays}d)` : ""}`);
    if(next.text) bits.push(escapeHtml(next.text));
    nextLine = `<div class="summary-line">${bits.join(" — ")}</div>`;
  }

  const box = el(`
    <div class="summary-box">
      <div class="summary-box-header">
        <h3>${escapeHtml(item.name)}</h3>
        ${(item.titles && item.titles.length) ? `<div class="summary-titles">${orderedTitleList(item).map(t => escapeHtml(t)).join(", ")}</div>` : ""}
      </div>
      <div class="summary-section">
        <div class="summary-section-label">Progress</div>
        ${completed.length
          ? completed.map(e => `<div class="summary-line"><span class="summary-line-date">${fmtDateShort(seqEntryActual(item, e))}</span><span class="summary-line-body">${escapeHtml(seqEntryLabel(item, e))}</span></div>`).join("")
          : `<div class="summary-line summary-empty">No steps completed yet.</div>`}
      </div>
      <div class="summary-section">
        <div class="summary-section-label">Notes</div>
        ${allNotes.length
          ? allNotes.map(n => `<div class="summary-line"><span class="summary-line-date">${n.date ? fmtDateShort(n.date) : "No date"}</span><span class="summary-line-body"><span class="summary-note-meta">${escapeHtml(n.stepLabel)}</span>${n.text}</span></div>`).join("")
          : `<div class="summary-line summary-empty">No notes yet.</div>`}
      </div>
      <div class="summary-section">
        <div class="summary-section-label">Next Step</div>
        ${nextLine}
      </div>
    </div>
  `);
  box.querySelector(".summary-box-header").onclick = () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
  return box;
}

/** Shared-axis timeline: every row plots against the SAME month scale, unlike
 * the per-item detail timeline. One bar per item (its overall footprint),
 * coloured by derived health — see itemHealth(). */
function buildSlateTimeline(items){
  const windowStart = addDaysISO(todayISO(), -35 + STATE.slateOffsetMonths*30);
  const windowEnd = addDaysISO(todayISO(), 150 + STATE.slateOffsetMonths*30);
  const totalDays = Math.max(1, daysBetween(windowStart, windowEnd));
  const pct = (dateStr) => Math.min(100, Math.max(0, (daysBetween(windowStart, dateStr) / totalDays) * 100));

  const wrap = el(`<div></div>`);
  const axis = el(`<div class="slate-axis"></div>`);
  for(const m of timelineMarkers(windowStart, windowEnd)){
    if(m === windowStart) continue;
    const d = parseDate(m, true);
    if(!d) continue;
    const label = new Intl.DateTimeFormat("en-US",{month:"short", year:"2-digit"}).format(d);
    axis.appendChild(el(`<div class="month" style="left:${pct(m)}%">${label}</div>`));
  }
  wrap.appendChild(axis);

  if(!items.length){
    wrap.appendChild(el(`<div class="section-note" style="padding:16px 0;">No items match.</div>`));
    return wrap;
  }

  for(const item of items){
    const span = computeItemSpan(item);
    const health = itemHealth(STATE.data, item);
    const colorVar = health === "completed" ? "var(--slate)" : `var(--${health})`;
    const row = el(`
      <div class="slate-row">
        <div class="slate-row-label">
          <span class="dot" style="background:${colorVar}"></span>
          <div>
            <div class="slate-row-name">${escapeHtml(item.name)}</div>
          </div>
        </div>
        <div class="slate-row-track" data-track></div>
      </div>
    `);
    const track = row.querySelector("[data-track]");
    const today = todayISO();
    if(today >= windowStart && today <= windowEnd){
      track.appendChild(el(`<div class="slate-today" style="left:${pct(today)}%"></div>`));
    }
    if(span){
      const left = pct(span.start), width = Math.max(1, pct(span.end) - left);
      track.appendChild(el(`<div class="slate-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
    }
    row.onclick = () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
    wrap.appendChild(row);
  }
  return wrap;
}

/* ---- Timeline visualization (shared by overview + detail) --------------- */
function buildTimelineViz(item, bars, tall){
  if(!bars.length){
    return el(`<div class="section-note">No usable target dates yet — add step dates to see the timeline.</div>`);
  }
  const starts = bars.map(b=>b.start), ends = bars.map(b=>b.end);
  let min = starts.reduce((a,b)=> a<b?a:b);
  let max = ends.reduce((a,b)=> a>b?a:b);
  // pad range a little
  min = addDaysISO(min, -7);
  max = addDaysISO(max, 10);
  const totalDays = Math.max(1, daysBetween(min, max));
  const pct = (dateStr) => (daysBetween(min, dateStr) / totalDays) * 100;

  const markers = timelineMarkers(min, max);
  const wrap = el(`<div class="timeline"></div>`);
  const grid = el(`<div class="timeline-grid" style="height:${tall?14:12}px;"></div>`);
  for(const m of markers){
    if(m === min || m === max) continue;
    const d = parseDate(m, true);
    const label = d ? new Intl.DateTimeFormat("en-US",{month:"short"}).format(d) : "";
    grid.appendChild(el(`<div class="tl-month" style="left:${pct(m)}%">${label}</div>`));
  }
  const today = todayISO();
  if(today >= min && today <= max){
    grid.appendChild(el(`<div class="tl-today" style="left:${pct(today)}%"></div>`));
  }
  wrap.appendChild(grid);

  for(const bar of bars){
    const track = el(`<div class="timeline-track"></div>`);
    const colorVar = bar.health === "completed" ? "var(--slate)" : `var(--${bar.health || "green"})`;
    if(bar.milestone){
      const left = pct(bar.start);
      track.appendChild(el(`<div class="tl-milestone" style="left:${left}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left}%;">${escapeHtml(bar.label)}</div>`));
    }else{
      const left = pct(bar.start), width = Math.max(0.6, pct(bar.end) - pct(bar.start));
      track.appendChild(el(`<div class="tl-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left+width}%;">${escapeHtml(bar.label)}</div>`));
    }
    // ghost baseline — only ever shown when acknowledged (rule 3.2)
    if(item){
      const field = ITEM_BASELINE_FIELD_BY_BAR[bar.id];
      if(field){
        const ghost = ghostBaselineDate(STATE.data, item.id, field);
        if(ghost && ghost !== bar.start && ghost !== bar.end){
          const gLeft = pct(ghost);
          track.appendChild(el(`<div class="tl-ghost" style="left:${gLeft}%; width:${bar.milestone?0:Math.max(0.6, pct(bar.end)-gLeft)}%; border-color:${colorVar};"></div>`));
        }
      }
    }
    wrap.appendChild(track);
  }
  return wrap;
}

  "step-1-2": "target_call",
  "step-2-3": "target_pitch",
  "step-3-4": "target_proposal",
  "rights-secured": "target_rights_secured",
};
