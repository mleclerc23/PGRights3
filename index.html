/** Shared-axis timeline: every row plots against the SAME month scale, unlike
 * the per-item detail timeline. One bar per item (its overall footprint),
 * coloured by derived health — see itemHealth(). */
function buildSlateTimeline(items){
  const windowStart = addDaysISO(todayISO(), -35 + STATE.slateOffsetMonths*30);
  const windowEnd = addDaysISO(todayISO(), 150 + STATE.slateOffsetMonths*30);
  const totalDays = Math.max(1, daysBetween(windowStart, windowEnd));
  const pct = (dateStr) => Math.min(100, Math.max(0, (daysBetween(windowStart, dateStr) / totalDays) * 100));

  const wrap = el(`<div></div>`);
  const axis = el(`<div class="slate-axis"></div>`);
  for(const m of timelineMarkers(windowStart, windowEnd)){
    if(m === windowStart) continue;
    const d = parseDate(m, true);
    if(!d) continue;
    const label = new Intl.DateTimeFormat("en-US",{month:"short", year:"2-digit"}).format(d);
    axis.appendChild(el(`<div class="month" style="left:${pct(m)}%">${label}</div>`));
  }
  wrap.appendChild(axis);

  if(!items.length){
    wrap.appendChild(el(`<div class="section-note" style="padding:16px 0;">No items match.</div>`));
    return wrap;
  }

  for(const item of items){
    const span = computeItemSpan(item);
    const health = itemHealth(STATE.data, item);
    const colorVar = health === "completed" ? "var(--slate)" : `var(--${health})`;
    const row = el(`
      <div class="slate-row">
        <div class="slate-row-label">
          <span class="dot" style="background:${colorVar}"></span>
          <div>
            <div class="slate-row-name">${escapeHtml(item.name)}</div>
          </div>
        </div>
        <div class="slate-row-track" data-track></div>
      </div>
    `);
    const track = row.querySelector("[data-track]");
    const today = todayISO();
    if(today >= windowStart && today <= windowEnd){
      track.appendChild(el(`<div class="slate-today" style="left:${pct(today)}%"></div>`));
    }
    if(span){
      const left = pct(span.start), width = Math.max(1, pct(span.end) - left);
      track.appendChild(el(`<div class="slate-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
    }
    row.onclick = () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
    wrap.appendChild(row);
  }
  return wrap;
}

/* ---- Timeline visualization (shared by overview + detail) --------------- */
function buildTimelineViz(item, bars, tall){
  if(!bars.length){
    return el(`<div class="section-note">No usable target dates yet — add step dates to see the timeline.</div>`);
  }
  const starts = bars.map(b=>b.start), ends = bars.map(b=>b.end);
  let min = starts.reduce((a,b)=> a<b?a:b);
  let max = ends.reduce((a,b)=> a>b?a:b);
  // pad range a little
  min = addDaysISO(min, -7);
  max = addDaysISO(max, 10);
  const totalDays = Math.max(1, daysBetween(min, max));
  const pct = (dateStr) => (daysBetween(min, dateStr) / totalDays) * 100;

  const markers = timelineMarkers(min, max);
  const wrap = el(`<div class="timeline"></div>`);
  const grid = el(`<div class="timeline-grid" style="height:${tall?14:12}px;"></div>`);
  for(const m of markers){
    if(m === min || m === max) continue;
    const d = parseDate(m, true);
    const label = d ? new Intl.DateTimeFormat("en-US",{month:"short"}).format(d) : "";
    grid.appendChild(el(`<div class="tl-month" style="left:${pct(m)}%">${label}</div>`));
  }
  const today = todayISO();
  if(today >= min && today <= max){
    grid.appendChild(el(`<div class="tl-today" style="left:${pct(today)}%"></div>`));
  }
  wrap.appendChild(grid);

  for(const bar of bars){
    const track = el(`<div class="timeline-track"></div>`);
    const colorVar = bar.health === "completed" ? "var(--slate)" : `var(--${bar.health || "green"})`;
    if(bar.milestone){
      const left = pct(bar.start);
      track.appendChild(el(`<div class="tl-milestone" style="left:${left}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left}%;">${escapeHtml(bar.label)}</div>`));
    }else{
      const left = pct(bar.start), width = Math.max(0.6, pct(bar.end) - pct(bar.start));
      track.appendChild(el(`<div class="tl-bar" style="left:${left}%; width:${width}%; background:${colorVar};"></div>`));
      track.appendChild(el(`<div class="tl-label" style="left:${left+width}%;">${escapeHtml(bar.label)}</div>`));
    }
    // ghost baseline — only ever shown when acknowledged (rule 3.2)
    if(item){
      const field = ITEM_BASELINE_FIELD_BY_BAR[bar.id];
      if(field){
        const ghost = ghostBaselineDate(STATE.data, item.id, field);
        if(ghost && ghost !== bar.start && ghost !== bar.end){
          const gLeft = pct(ghost);
          track.appendChild(el(`<div class="tl-ghost" style="left:${gLeft}%; width:${bar.milestone?0:Math.max(0.6, pct(bar.end)-gLeft)}%; border-color:${colorVar};"></div>`));
        }
      }
    }
    wrap.appendChild(track);
  }
  return wrap;
}
const ITEM_BASELINE_FIELD_BY_BAR = {
  "step-1-2": "target_call",
  "step-2-3": "target_pitch",
  "step-3-4": "target_proposal",

/** Remove an estate entirely (its to-dos, titles and notes go with it). Cmd+Z brings it back. */
function deleteEstate(item){
  const idx = STATE.data.items.findIndex(i => i.id === item.id);
  if(idx < 0) return;
  STATE.data.items.splice(idx, 1);
  trashDocs(item.documents);
  STATE.data.baselines = (STATE.data.baselines || []).filter(b => b.entityId !== item.id);
  if(Array.isArray(STATE.data.todoOrder)) STATE.data.todoOrder = STATE.data.todoOrder.filter(x => x !== item.id);
  recordChange(item.id, "item", item.id, item.name, "deleted", "Item deleted", item.name, "");
  STATE.view = "overview"; STATE.currentItemId = null; STATE.currentTitle = null; STATE.tab = "overview";
  scheduleSave();
  render();
  showToast(`Deleted ${item.name}. Press Cmd+Z to undo.`);
}

function fmtBytes(n){
  n = Number(n) || 0;
  if(n < 1024) return n + " B";
  if(n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
/** Open a stored document: viewable types in a new tab, everything else downloads. */
async function openDocument(doc){
  const viewable = /^(application\/pdf|image\/(png|jpe?g|gif|webp)|text\/plain)$/.test(doc.type || "");
  const win = viewable ? window.open("", "_blank") : null;
  try{
    const blob = await fileStore.get(doc.id);
    const url = URL.createObjectURL(new Blob([blob], { type: doc.type || blob.type || "application/octet-stream" }));
    if(win){ win.location.href = url; }
    else{ const a = document.createElement("a"); a.href = url; a.download = doc.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){
    if(win) win.close();
    showToast("Couldn't open that file.");
  }
}
/** Deleted files are kept for a week (so Cmd+Z can still bring them back) and then purged. */
function trashDocs(docs){
  if(!docs || !docs.length) return;
  if(!Array.isArray(STATE.data.trashFiles)) STATE.data.trashFiles = [];
  for(const d of docs) STATE.data.trashFiles.push({ id: d.id, at: new Date().toISOString() });
}
function purgeTrashFiles(){
  const list = Array.isArray(STATE.data.trashFiles) ? STATE.data.trashFiles : [];
  if(!list.length) return;
  const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
  const keep = [];
  for(const t of list){
    if(Date.parse(t.at) < cutoff){ try{ fileStore.del(t.id); }catch(e){} } else keep.push(t);
  }
  if(keep.length !== list.length){ STATE.data.trashFiles = keep; scheduleSave(); }
}
function renderDocumentsPanel(item, opts){
  const fixedTitle = opts && opts.title ? opts.title : null;
  if(!Array.isArray(item.documents)) item.documents = [];
  const titles = (item.titles || []).filter(t => stripTags(t));
  const panel = el(`

        <div class="doc-actions">
          ${fixedTitle || !titles.length ? "" : `<select class="phase-status-select" data-role="target"><option value="">Whole estate</option>${titles.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(stripTags(t))}</option>`).join("")}</select>`}

  const input = panel.querySelector('[data-role="file"]'), targetSel = panel.querySelector('[data-role="target"]');
  const rowFor = (d) => {
    const r = el(`
      <div class="doc-row">
        <div class="doc-main"><button class="doc-name" type="button" title="Open / download">${escapeHtml(d.name)}</button>
          <div class="doc-meta">${escapeHtml(fmtBytes(d.size))} · ${escapeHtml(isValidDate((d.uploadedAt || "").slice(0, 10)) ? fmtDateShort(d.uploadedAt.slice(0, 10)) : "")}</div></div>
        <span class="pill pill-pending">${d.title ? escapeHtml(stripTags(d.title)) : "Estate"}</span>
        <button class="btn btn-sm btn-ghost" type="button" data-role="del">Delete</button>
      </div>`);
    r.querySelector(".doc-name").onclick = () => openDocument(d);
    bindConfirmDelete(r.querySelector('[data-role="del"]'), () => {
      item.documents = item.documents.filter(x => x.id !== d.id);

      recordChange(item.id, "item", item.id, item.name, "documentRemove", "Document removed", d.name, "");
      scheduleSave(); render();
    }, "Delete", "Delete?");
    return r;
  };
  if(!item.documents.length || (fixedTitle && !item.documents.some(d => d.title === fixedTitle))) list.appendChild(el(`<div class="section-note">No documents yet.</div>`));
  if(fixedTitle){
    for(const d of item.documents.filter(d => d.title === fixedTitle)) list.appendChild(rowFor(d));
  }else{
    // Estate page: everything, grouped (estate-wide first, then each title A-Z).
    const groups = new Map();
    for(const d of item.documents){ const k = d.title || ""; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(d); }
    const keys = Array.from(groups.keys()).sort((a, b) => a === "" ? -1 : b === "" ? 1 : byName(a, b));
    for(const k of keys){
      if(keys.length > 1) list.appendChild(el(`<div class="doc-group">${k ? escapeHtml(stripTags(k)) : "Estate-wide"}</div>`));
      for(const d of groups.get(k)) list.appendChild(rowFor(d));
    }
  }
  const say = (t, bad) => { status.textContent = t || ""; status.classList.toggle("bad", !!bad); };
  const upload = async (files) => {
    files = Array.from(files || []);
    if(!files.length) return;
    const tag = fixedTitle || (targetSel ? targetSel.value : "");
    let added = 0, failed = "";
    for(const f of files){
      if(f.size > fileStore.max){ failed = `“${f.name}” is over the ${fileStore.label} limit.`; continue; }
      say(`Uploading ${f.name}…`);
      const id = uid("doc");
      try{
        await fileStore.put(id, f);
        item.documents.push({ id, name: f.name, size: f.size, type: f.type || "", uploadedAt: new Date().toISOString(), title: tag || "" });
        recordChange(item.id, "item", item.id, item.name, "documentAdd", "Document added", "", f.name);
        added++;
      }catch(e){ failed = e && e.message ? e.message : "Upload failed."; }
    }
    if(added){ scheduleSave(); render(); if(failed) showToast(failed); }
    else say(failed || "Nothing uploaded.", true);
  };
  panel.querySelector('[data-role="upload"]').onclick = () => input.click();
  input.onchange = () => { upload(input.files); input.value = ""; };
  const drop = panel.querySelector('[data-role="drop"]');
  ["dragenter", "dragover"].forEach(ev => panel.addEventListener(ev, (e) => { if(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")){ e.preventDefault(); drop.classList.add("over"); } }));
  ["dragleave", "drop"].forEach(ev => panel.addEventListener(ev, () => drop.classList.remove("over")));
  panel.addEventListener("drop", (e) => { if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){ e.preventDefault(); upload(e.dataTransfer.files); } });
  return panel;
}

function bindCommit(inputEl, onCommit){
  let committed = inputEl.value;
  inputEl.addEventListener("blur", () => {
    if(inputEl.value !== committed){ committed = inputEl.value; onCommit(inputEl.value); }
  });
  inputEl.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); inputEl.blur(); } });
}

/* ---- Minimal rich text (bold/italic only) --------------------------------
 * A contenteditable div with a two-button toolbar, standing in for
 * textarea.freeform wherever bold/italic emphasis is useful (loglines,
 * rights notes, summary/notes). Content is stored as sanitized HTML,
 * restricted to <b>/<strong>/<i>/<em>/<br> — nothing else survives a commit. */
function isSafeHref(href){
  if(!href) return false;
  return /^https?:\/\//i.test(href) || /^mailto:/i.test(href);
}
function sanitizeRichHTML(html){
  const allowedInline = new Set(["B", "STRONG", "I", "EM", "BR", "A", "UL", "OL", "LI"]);
  const container = document.createElement("div");
  container.innerHTML = html;
  function walk(node){
    const frag = document.createDocumentFragment();
    node.childNodes.forEach(child => {
      if(child.nodeType === Node.TEXT_NODE){
        frag.appendChild(document.createTextNode(child.textContent));
      }else if(child.nodeType === Node.ELEMENT_NODE){
        const tag = child.tagName;
        if(tag === "A" && !isSafeHref(child.getAttribute("href"))){
          frag.appendChild(walk(child)); // unsafe/missing href — drop the link, keep its text
        }else if(allowedInline.has(tag)){
          const clean = document.createElement(tag);
          if(tag === "A"){
            clean.setAttribute("href", child.getAttribute("href"));
            clean.setAttribute("target", "_blank");
            clean.setAttribute("rel", "noopener noreferrer");
          }
          clean.appendChild(walk(child));
          frag.appendChild(clean);
        }else if(tag === "DIV" || tag === "P"){
          if(frag.lastChild) frag.appendChild(document.createElement("br"));
          frag.appendChild(walk(child));
        }else{
          frag.appendChild(walk(child)); // unwrap anything else, keep its text/inline content
        }
      }
    });
    return frag;
  }
  const out = document.createElement("div");
  out.appendChild(walk(container));
  return out.innerHTML;
}
/** Cmd/Ctrl+K in any rich-text field: link the current selection (or, with
 * nothing selected, insert the URL itself as the link text). Shared by
 * createRichTextEditor and createRichTextLine, so this covers every rich
 * field in the app from one place. */
function insertLinkAtSelection(container){
  const selection = document.getSelection();
  const hasSelection = Boolean(selection && selection.rangeCount > 0 && !selection.isCollapsed && container.contains(selection.anchorNode));
  const raw = window.prompt("Link URL:");
  if(!raw) return;
  let url = raw.trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = "https://" + url;
  if(!isSafeHref(url)) return;
  container.focus();
  if(hasSelection){
    document.execCommand("createLink", false, url);
  }else{
    const safe = url.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    document.execCommand("insertHTML", false, `<a href="${safe}">${safe}</a>`);
  }
  container.querySelectorAll("a[href]").forEach(a => {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });
}
/** Bullet points in multi-line rich fields: type "- " or "* " at the start of a line, or press Ctrl/Cmd+Shift+8. */
function bindBulletShortcuts(editable){
  editable.addEventListener("keydown", (e) => {
    if((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "8" || e.key === "*")){
      e.preventDefault(); document.execCommand("insertUnorderedList", false, null); return;
    }
    if(e.key === " " && !e.metaKey && !e.ctrlKey){
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount || !sel.isCollapsed) return;
      const r = sel.getRangeAt(0), n = r.startContainer;
      if(n.nodeType !== Node.TEXT_NODE || r.startOffset !== 1) return;
      const ch = n.textContent.charAt(0);
      if(ch !== "-" && ch !== "*" && ch !== "\u2022") return;
      const prev = n.previousSibling;
      if(prev && !(prev.nodeType === Node.ELEMENT_NODE && prev.tagName === "BR") && !(prev.nodeType === Node.TEXT_NODE && !prev.textContent.trim())) return;
      if(n.parentNode && n.parentNode.closest && n.parentNode.closest("li")) return;
      e.preventDefault();
      n.textContent = n.textContent.slice(1);
      const range = document.createRange(); range.setStart(n, 0); range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
      document.execCommand("insertUnorderedList", false, null);
    }
  });
}
function createRichTextEditor(initialHTML, placeholder, minHeight){
  const wrap = el(`
    <div class="rich-field">
      <div class="rich-editable freeform" contenteditable="true" data-placeholder="${escapeHtml(placeholder || "")}" style="min-height:${minHeight || 44}px;">${initialHTML || ""}</div>
    </div>
  `);
  const editable = wrap.querySelector(".rich-editable");
  bindBulletShortcuts(editable);
  // Browsers already bind Cmd/Ctrl+B and Cmd/Ctrl+I natively on contenteditable,
  // but handle it explicitly too so bold/italic work reliably with no visible
  // toolbar button to trigger them. Cmd/Ctrl+K adds a hyperlink.
  editable.addEventListener("keydown", (e) => {
    if(!(e.metaKey || e.ctrlKey)) return;
    const key = e.key.toLowerCase();
    if(key === "b"){ e.preventDefault(); document.execCommand("bold", false, null); }
    else if(key === "i"){ e.preventDefault(); document.execCommand("italic", false, null); }
    else if(key === "k"){ e.preventDefault(); insertLinkAtSelection(editable); }
  });
  return { wrap, editable };
}
/** Single-line counterpart of createRichTextEditor — a contenteditable div
 * standing in for a plain <input>/<textarea> wherever bold/italic should be
 * available. className lets the caller reuse an existing input's look
 * (text-input, td-title-input, detail-title, ec-line-input, inline-input…).
 * Enter commits (blurs) instead of inserting a line break, matching how a
 * real single-line input behaves. */
function createRichTextLine(initialHTML, placeholder, className){
  const div = document.createElement("div");
  div.className = "rich-line" + (className ? " " + className : "");
  div.contentEditable = "true";
  if(placeholder) div.setAttribute("data-placeholder", placeholder);
  div.innerHTML = initialHTML || "";
  div.addEventListener("keydown", (e) => {
    if((e.metaKey || e.ctrlKey)){
      const key = e.key.toLowerCase();
      if(key === "b"){ e.preventDefault(); document.execCommand("bold", false, null); return; }
      if(key === "i"){ e.preventDefault(); document.execCommand("italic", false, null); return; }
      if(key === "k"){ e.preventDefault(); insertLinkAtSelection(div); return; }
    }
    if(e.key === "Enter"){
      e.preventDefault();
      if(e.altKey || e.shiftKey){ document.execCommand("insertLineBreak"); return; }  // Option/Alt+Enter = new line
      div.blur();
    }
  });
  return div;
}
function bindCommitRich(editableEl, onCommit){
  let committed = sanitizeRichHTML(editableEl.innerHTML);
  editableEl.addEventListener("blur", () => {
    const clean = sanitizeRichHTML(editableEl.innerHTML);
    if(clean !== committed){ committed = clean; onCommit(clean); }
  });
}

function migrateTitlePriority(item){
  if(!Array.isArray(item.priorityTitles)) item.priorityTitles = [];

}
/** A title is a priority when it is starred on its estate, or is the estate's only title - unless it has been demoted. */
function isTitlePriority(item, title){
  migrateTitlePriority(item);
  if(titleCategoryOf(item, title) === "hold") return false;   // titles on hold are never priority (a star is kept for when they return to Pursuing)
  if((item.demotedTitles || []).includes(title)) return false;
  if(item.priorityTitles.includes(title)) return true;
  return (item.titles || []).filter(t => stripTags(t)).length === 1;
}
function setTitlePriority(item, title, on){
  migrateTitlePriority(item);
  if(isTitlePriority(item, title) === on) return;
  if(!Array.isArray(item.demotedTitles)) item.demotedTitles = [];
  const idx = item.priorityTitles.indexOf(title);
  if(on){
    if(idx === -1) item.priorityTitles.push(title);
    item.demotedTitles = item.demotedTitles.filter(t => t !== title);
    recordChange(item.id, "item", item.id, item.name, "titlePriority", "Title marked priority", "", title);
  }else{
    if(idx !== -1) item.priorityTitles.splice(idx, 1);
    if(!item.demotedTitles.includes(title)) item.demotedTitles.push(title);
    recordChange(item.id, "item", item.id, item.name, "titlePriority", "Title demoted from priority", title, "");
  }
  scheduleSave();
  render();
}
function toggleTitlePriority(item, title){ setTitlePriority(item, title, !isTitlePriority(item, title)); }
function toggleAdditionalTitlesHidden(item){
  migrateTitlePriority(item);

/** Priority titles first, wherever a compact title list is shown (Estates

function orderedTitleList(item){

/** Titles as clickable links (comma separated) into `container`; each opens that title's page. */

}

/** Keeps the tag list under the estate name and the full Titles panel below
 * pointing at the same set of titles — a title added/renamed/removed in
 * either place is reflected in the other, and priority (which is tracked
 * once per title text, not per-list) is shared automatically as a result. */
/** ALL-CAPS text (more than one word, or longer than 4 letters) becomes Capitalised Words; anything with lowercase letters is left alone. */
function fixCaps(str){
  const v = String(str == null ? "" : str);
  const plain = v.replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ");
  if(!/[A-Z]/.test(plain) || /[a-z]/.test(plain)) return v;
  if(!/\s/.test(plain.trim()) && plain.replace(/[^A-Za-z]/g, "").length <= 4) return v;
  const small = new Set(["of","the","and","a","an","in","on","to","for","at","by","or","vs"]);
  let first = true;
  return v.replace(/[A-Za-z][A-Za-z']*/g, (w) => { const l = w.toLowerCase(); const out = (!first && small.has(l)) ? l : l.charAt(0).toUpperCase() + l.slice(1); first = false; return out; });
}
/** Renames a title everywhere it is used in one estate (no save / render). Returns the stored new name, or null if it can't be applied. */
function renameTitleData(item, oldT, newT){
  newT = String(newT || "").trim();
  if(!newT || newT === oldT) return null;
  const k = (x) => stripTags(x).trim().toLowerCase().replace(/\s+/g, " ");
  const idx = (item.titles || []).indexOf(oldT);
  if(idx === -1) return null;
  if((item.titles || []).some((t, i) => i !== idx && k(t) === k(newT))) return null;   // another title already has that name
  const oldKey = k(oldT);
  item.titles[idx] = newT;
  const swapList = (arr) => Array.isArray(arr) ? arr.map(t => t === oldT ? newT : t) : arr;
  // combined tags ("A / B") and typed headings: swap just this title's segment
  const swapCombo = (str) => {
    if(typeof str !== "string" || !str) return str;
    if(str === oldT) return newT;
    if(str.indexOf("/") === -1) return k(str) === oldKey ? newT : str;
    return str.split("/").map(seg => k(seg) === oldKey ? " " + newT + " " : seg).join("/").replace(/\s*\/\s*/g, " / ").trim();
  };
  for(const td of (item.titleDetails || [])) if(td.title === oldT) td.title = newT;
  for(const t of (item.todos || [])) if(t.title) t.title = swapCombo(t.title);
  for(const d of (item.documents || [])) if(d.title) d.title = swapCombo(d.title);
  if(item.todoTitleLabel){ const lbl = swapCombo(item.todoTitleLabel); item.todoTitleLabel = (lbl === newT || String(item.todoTitleLabel).indexOf("/") === -1) ? item.todoTitleLabel : lbl.toUpperCase(); }
  item.actionTitles = swapList(item.actionTitles);
  item.priorityTitles = swapList(item.priorityTitles);
  item.demotedTitles = swapList(item.demotedTitles);
  if(item.titleCategory && Object.prototype.hasOwnProperty.call(item.titleCategory, oldT)){ item.titleCategory[newT] = item.titleCategory[oldT]; delete item.titleCategory[oldT]; }
  if(STATE.currentTitle && STATE.currentTitle.itemId === item.id && STATE.currentTitle.title === oldT) STATE.currentTitle.title = newT;
  return newT;
}
function renameTitle(item, oldT, newT){
  const done = renameTitleData(item, oldT, newT);
  if(!done) return false;
  recordChange(item.id, "item", item.id, item.name, "titles", "Title renamed", stripTags(oldT), stripTags(done));
  scheduleSave(); render();
  return true;
}

function removeTitleDetailByText(item, title){
  migrateTitleDetails(item);
  const idx = item.titleDetails.findIndex(td => td.title === title);
  if(idx !== -1) item.titleDetails.splice(idx, 1);
}
/** Create a brand-new estate (same defaults as "+ New item") without re-rendering; caller renders. */
function createEstateRecord(name){
  name = fixCaps(name);
  const now = new Date().toISOString();
  const item = {
    id: uid("itm"), name, owner: "", currentPhase: "Call", status: "",
    summary: "", notes: "",
    target_call:"", target_pitch:"", target_proposal:"",
    target_rights_secured:"", stepNotes:{}, stepActuals:{}, customSteps:[], removedPresetSteps:[], stepPending:{}, stepLabelOverrides:{}, estateCategory:"pursuing", todoCategory:"call", todo:{stepRef:"",text:"",priority:false,assignee:""}, titles:[], estateContacts:[],
    titleDetails:[], todos:[], createdAt: now, updatedAt: now,
  };
  STATE.data.items.push(item);
  recordChange(item.id, "item", item.id, item.name, "created", "Item created", "", name);
  return item;
}
/** Attach a title to an estate (or reuse the one already there); returns the stored title string. */
function attachTitleRecord(item, title){
  if(!item.titles) item.titles = [];
  const existing = item.titles.find(t => stripTags(t).trim().toLowerCase() === title.trim().toLowerCase());
  if(existing) return existing;
  // Names that are already titles of this estate (in any spelling or separator) are reused, never added again.
  const known = matchTitlesIn(item, title);
  if(known && known.length === 1) return known[0];
  if(known && known.length > 1) return known.map(t => stripTags(t)).join(" / ");
  item.titles.push(title);
  ensureTitleDetailForTag(item, title);
  recordChange(item.id, "item", item.id, item.name, "titles", "Title added", "", title);
  return title;
}
function addTitle(item, value){
  const title = fixCaps(value.trim());
  if(!title) return;
  if(!item.titles) item.titles = [];
  item.titles.push(title);
  ensureTitleDetailForTag(item, title);
  recordChange(item.id, "item", item.id, item.name, "titles", "Title added", "", title);
  scheduleSave();
  render();
}
function removeTitle(item, idx){
  const removed = item.titles[idx];
  item.titles.splice(idx, 1);
  migrateTitlePriority(item);
  const priorityIdx = item.priorityTitles.indexOf(removed);
  if(priorityIdx !== -1) item.priorityTitles.splice(priorityIdx, 1);
  removeTitleDetailByText(item, removed);
  recordChange(item.id, "item", item.id, item.name, "titles", "Title removed", removed, "");
  scheduleSave();
  render();
}

function migrateStepNotes(item){
  if(!item.stepNotes) item.stepNotes = {};
  for(const [field] of STEP_FIELDS){
    const val = item.stepNotes[field];
    if(val === undefined || val === null){
      item.stepNotes[field] = [];
    }else if(typeof val === "string"){
      // legacy single-note shape — migrate into a one-entry list
      item.stepNotes[field] = val ? [{ id: uid("sn"), text: escapeHtml(val), createdAt: item.createdAt || new Date().toISOString() }] : [];
    }
  }
}
function migrateCustomSteps(item){
  if(!Array.isArray(item.customSteps)) item.customSteps = [];
}
/** Preset steps a user has deleted for this item — hidden but not wiped
 * (their target/actual dates and history stay put, in case of restore). */
function migrateRemovedPresetSteps(item){
  if(!Array.isArray(item.removedPresetSteps)) item.removedPresetSteps = [];
}
/** Most recently added note across every step (preset or custom) on an item. */
function findLatestNote(item){
  migrateStepNotes(item);
  migrateCustomSteps(item);
  let latest = null;
  const consider = (n) => {
    if(!n) return;
    if(!latest || new Date(n.createdAt) > new Date(latest.createdAt)) latest = n;
  };
  for(const [field] of STEP_FIELDS){
    for(const n of item.stepNotes[field] || []) consider(n);
  }
  for(const cs of item.customSteps){
    for(const n of cs.notes || []) consider(n);
  }
  return latest;
}
/** Presets (fixed order 0..3, minus any the user deleted) interleaved with
 * any custom steps, by sortOrder. */
function buildStepSequence(item){
  migrateCustomSteps(item);
  migrateRemovedPresetSteps(item);
  const seq = STEP_FIELDS
    .map(([field], idx) => ({ kind: "preset", order: idx, field }))
    .filter(entry => !item.removedPresetSteps.includes(entry.field));
  for(const cs of item.customSteps) seq.push({ kind: "custom", order: cs.sortOrder, custom: cs });
  seq.sort((a, b) => a.order - b.order);
  return seq;
}
function removePresetStep(item, field){
  migrateRemovedPresetSteps(item);
  if(item.removedPresetSteps.includes(field)) return;
  const label = stepLabel(item, field);
  item.removedPresetSteps.push(field);
  recordChange(item.id, "item", item.id, item.name, "removedStep", "Step removed", "", label);
  scheduleSave();
  render();
}
/** Clears a preset step's target date back to blank. Bypasses the baseline
 * decision-card flow (there's no "delay or replan" question to ask when
 * un-setting a date) — if a target is set again later, the existing
 * baseline will still prompt normally, since it's untouched by this. */
function clearStepTarget(item, field, label){
  const old = item[field] || "";
  if(!old) return;
  item[field] = "";
  recordChange(item.id, "item", item.id, item.name, field, label, old, "", "Target date cleared.");
  scheduleSave();
  render();
}

      row.querySelector('[data-holder="note-rich"]').appendChild(noteEditor.wrap);
      bindCommitRich(noteEditor.editable, v => updateFollowUpNoteText(item, nIdx, v));
      row.querySelector('[data-role="remove-note"]').onclick = () => removeFollowUpNote(item, nIdx);
      bindNoteDragReorder(row, nIdx, (fromIdx, toIdx) => reorderFollowUpNote(item, fromIdx, toIdx));
      followUpNotesList.appendChild(row);
    });
    const followUpAddDateInput = followUpBlock.querySelector('[data-role="add-note-date"]');
    wrapDateField(followUpAddDateInput, "");
    const followUpAddInput = followUpBlock.querySelector('[data-role="add-note"]');

      if(followUpNoteSubmitted) return;
      followUpNoteSubmitted = true;

      const field = entry.field;
      const label = stepLabel(item, field);
      expireStalePending(item, field);
      const slip = slipDays(STATE.data, item.id, field, item[field]);

        pending: isPending(item, field), pendingSince: pendingSinceDate(item, field), pendingSinceDays: pendingDays(item, field),
        onLabelChange: (v) => updateStepLabelOverride(item, field, v),

        onEditNote: (nIdx, v) => updateStepNoteText(item, field, label, nIdx, v),
        onReorderNote: (fromIdx, toIdx) => reorderStepNote(item, field, fromIdx, toIdx),
        onRemove: () => removePresetStep(item, field),

        onPendingSinceChange: (v) => updatePendingSince(item, field, label, v),
      }));
    }else{
      const cs = entry.custom;
      expireStalePending(item, cs.id);
      const late = latenessDays(cs.actual, cs.target);
      list.appendChild(renderStepBlock({
        label: cs.label, isLast, slip: null, late, target: cs.target, actual: cs.actual, notes: cs.notes || [],
        removable: true, labelEditable: true,
        pending: isPending(item, cs.id), pendingSince: pendingSinceDate(item, cs.id), pendingSinceDays: pendingDays(item, cs.id),
        onLabelChange: (v) => updateCustomStepField(item, cs.id, "label", v || "New step"),
        onTargetChange: (v) => updateCustomStepField(item, cs.id, "target", v),
        onClearTarget: () => updateCustomStepField(item, cs.id, "target", ""),
        onActualChange: (v) => updateCustomStepField(item, cs.id, "actual", v),
        onAddNote: (text, date) => addCustomStepNote(item, cs.id, text, date),
        onRemoveNote: (nIdx) => removeCustomStepNote(item, cs.id, nIdx),
        onNoteDateChange: (nIdx, v) => updateCustomStepNoteDate(item, cs.id, nIdx, v),
        onEditNote: (nIdx, v) => updateCustomStepNoteText(item, cs.id, nIdx, v),
        onReorderNote: (fromIdx, toIdx) => reorderCustomStepNote(item, cs.id, fromIdx, toIdx),
        onRemove: () => removeCustomStep(item, cs.id),
        onTogglePending: () => togglePending(item, cs.id, cs.label),
        onPendingSinceChange: (v) => updatePendingSince(item, cs.id, cs.label, v),
      }));
    }
    const nextOrder = isLast ? entry.order + 1 : seq[idx + 1].order;
    list.appendChild(renderStepInsertRow(item, entry.order, nextOrder));
  });
  return panel;
}

/** A thin "+ Add step" divider between two steps (or before the first / after the last). */
function renderStepInsertRow(item, afterOrder, beforeOrder){
  const row = el(`
    <div class="step-insert-row">
      <span class="step-insert-line"></span>
      <button type="button" class="step-insert-btn" data-role="open">+ Add step</button>
      <span class="step-insert-line"></span>
    </div>
  `);
  row.querySelector('[data-role="open"]').onclick = () => {
    const form = el(`
      <div class="step-insert-form">
        <input type="text" class="text-input" placeholder="Step name…" id="new-step-name" />
        <button class="btn btn-sm" data-role="confirm">Add</button>
        <button class="btn btn-ghost btn-sm" data-role="cancel">Cancel</button>
      </div>
    `);
    row.replaceWith(form);
    const input = form.querySelector("#new-step-name");
    input.focus();
    const commit = () => {
      const name = input.value.trim();
      if(!name) return;
      migrateCustomSteps(item);
      const newOrder = (afterOrder === null) ? (beforeOrder - 1 + beforeOrder) / 2 : (afterOrder + beforeOrder) / 2;
      item.customSteps.push({ id: uid("cs"), label: name, sortOrder: newOrder, target: "", actual: null, notes: [] });
      recordChange(item.id, "item", item.id, item.name, "customStep", "Custom step added", "", name);
      scheduleSave();
      render();
    };
    input.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); commit(); } });
    form.querySelector('[data-role="confirm"]').onclick = commit;
    form.querySelector('[data-role="cancel"]').onclick = () => form.replaceWith(row);
  };
  return row;
}

/** Wires a note row's drag handle up to drag-and-drop reordering. `nIdx` is
 * this row's current index in the notes list being rendered; `onReorder`
 * is called with (fromIdx, toIdx) once a drop completes. */
function bindNoteDragReorder(row, nIdx, onReorder){
  const handle = row.querySelector('[data-role="note-drag-handle"]');
  if(!handle) return;
  handle.addEventListener("dragstart", (e) => {
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(nIdx));
    row.classList.add("dragging-note");
  });
  handle.addEventListener("dragend", () => row.classList.remove("dragging-note"));
  row.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    row.classList.add("drop-target-note");
  });
  row.addEventListener("dragleave", () => row.classList.remove("drop-target-note"));
  row.addEventListener("drop", (e) => {
    e.preventDefault();
    row.classList.remove("drop-target-note");
    const fromIdx = parseInt(e.dataTransfer.getData("text/plain"), 10);
    if(Number.isNaN(fromIdx) || fromIdx === nIdx) return;
    onReorder(fromIdx, nIdx);
  });
}

/** Shared block renderer for both preset and custom steps. */
function renderStepBlock(opts){
  const {
    label, isLast, slip, late, target, actual, notes, removable, labelEditable, pending, pendingSince, pendingSinceDays,
    onLabelChange, onTargetChange, onClearTarget, onActualChange, onAddNote, onRemoveNote, onNoteDateChange, onEditNote, onReorderNote, onRemove, onTogglePending, onPendingSinceChange,
  } = opts;
  const block = el(`
    <div class="step-block ${isLast ? "step-block-last" : ""} ${pending ? "step-block-pending" : ""}">
      <div class="kv-row kv-row-flush">
        <div class="kv-left" data-role="label-holder">
        </div>
        <div class="kv-right">
          ${pending ? `<span class="pill pill-pending">pending${pendingSinceDays !== null ? " · " + pendingSinceDays + "d" : ""}</span>` : ""}
          ${late !== null && late > 0 ? `<span class="pill pill-late">${late}d late</span>` : ""}
          ${slip !== null ? `<span class="pill pill-move">${formatSlip(slip)}</span>` : ""}
          <div class="date-pair">
            ${pending ? `
            <div class="date-pair-item">
              <span class="date-pair-label">Since</span>
              <input type="date" class="date-input" value="${pendingSince && isValidDate(pendingSince) ? pendingSince : ""}" data-role="pending-since" />
            </div>` : `
            <div class="date-pair-item">
              <span class="date-pair-label">Target</span>
              <input type="date" class="date-input" value="${target && isValidDate(target) ? target : ""}" data-role="target" />
            </div>
            <div class="date-pair-item">
              <span class="date-pair-label">Actual</span>
              <input type="date" class="date-input" value="${actual && isValidDate(actual) ? actual : ""}" data-role="actual" />
            </div>`}
          </div>
          <button class="pending-toggle ${pending ? "active" : ""}" title="${pending ? "Clear pending" : "Mark pending — waiting on a response"}" data-role="pending">⏳</button>
          ${removable ? `<button class="ec-remove" title="Remove step" data-role="remove-step">×</button>` : ""}
        </div>
      </div>
      <div class="step-notes-list" data-notes-list></div>
      <div class="step-note-add">
        <input type="date" class="step-note-date-input" data-role="add-note-date" />
        <input type="text" class="step-note-input" placeholder="Add a note…" data-role="add-note" />
      </div>
    </div>
  `);
  const labelHolder = block.querySelector('[data-role="label-holder"]');
  if(labelEditable){
    const labelInput = el(`<input class="td-title-input" value="${escapeHtml(label || "")}" placeholder="Step name" />`);
    labelHolder.appendChild(labelInput);
    bindCommit(labelInput, onLabelChange);
  }else{
    labelHolder.appendChild(el(`<div class="kv-name">${escapeHtml(label)}</div>`));
  }
  if(removable){
    block.querySelector('[data-role="remove-step"]').onclick = onRemove;
  }
  block.querySelector('[data-role="pending"]').onclick = onTogglePending;
  const targetInput = block.querySelector('[data-role="target"]');
  if(targetInput){
    wrapDateField(targetInput, target);
    targetInput.onchange = (e) => {
      if(e.target.value) onTargetChange(e.target.value);
      else if(onClearTarget) onClearTarget();
    };
  }
  const actualInput = block.querySelector('[data-role="actual"]');
  if(actualInput){
    wrapDateField(actualInput, actual);
    actualInput.onchange = (e) => onActualChange(e.target.value || null);
  }
  const pendingSinceInput = block.querySelector('[data-role="pending-since"]');
  if(pendingSinceInput){
    wrapDateField(pendingSinceInput, pendingSince);
    pendingSinceInput.onchange = (e) => { if(e.target.value) onPendingSinceChange(e.target.value); };
  }
  const notesList = block.querySelector("[data-notes-list]");
  (notes || []).forEach((n, nIdx) => {
    const row = el(`
      <div class="step-note-line adaptation-row">
        <span class="note-drag-handle" draggable="true" data-role="note-drag-handle" title="Drag to reorder">⠿</span>
        <input type="date" class="step-note-date-input" value="${n.date && isValidDate(n.date) ? n.date : ""}" data-role="note-date" />
        <div class="adaptation-rich" data-holder="note-rich"></div>
        <button class="ec-remove" title="Remove note" data-role="remove-note">×</button>
      </div>
    `);
    const noteDateInput = row.querySelector('[data-role="note-date"]');
    wrapDateField(noteDateInput, n.date);
    noteDateInput.onchange = (e) => onNoteDateChange(nIdx, e.target.value || null);
    const noteEditor = createRichTextEditor(n.text || "", "", 20);
    row.querySelector('[data-holder="note-rich"]').appendChild(noteEditor.wrap);
    bindCommitRich(noteEditor.editable, v => onEditNote(nIdx, v));
    row.querySelector('[data-role="remove-note"]').onclick = () => onRemoveNote(nIdx);
    if(onReorderNote) bindNoteDragReorder(row, nIdx, onReorderNote);
    notesList.appendChild(row);
  });
  const addDateInput = block.querySelector('[data-role="add-note-date"]');
  wrapDateField(addDateInput, "");
  const addInput = block.querySelector('[data-role="add-note"]');
  let submitted = false;
  const submitNote = () => {
    if(submitted) return;
    submitted = true;
    onAddNote(addInput.value, addDateInput.value || null);
  };
  addInput.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); submitNote(); } });
  addInput.addEventListener("blur", () => { if(addInput.value.trim()) submitNote(); });
  return block;
}

const HOLD_FOLLOWUP_NOTE_KEY = "__hold_followup__";
function migrateHoldFollowUpNotes(item){
  if(!item.stepNotes) item.stepNotes = {};
  if(!Array.isArray(item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY])) item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY] = [];
}
function addFollowUpNote(item, text, date){
  const value = (text || "").trim();
  if(!value) return;
  migrateHoldFollowUpNotes(item);
  insertNoteSorted(item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY], { id: uid("sn"), text: escapeHtml(value), date: date || null, createdAt: new Date().toISOString() });
  recordChange(item.id, "item", item.id, item.name, "followUpNote", "Follow-Up note added", "", value);
  scheduleSave();
  render();
}
function removeFollowUpNote(item, idx){
  migrateHoldFollowUpNotes(item);
  const removed = item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY][idx];
  item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY].splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "followUpNote", "Follow-Up note removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function reorderFollowUpNote(item, fromIdx, toIdx){
  migrateHoldFollowUpNotes(item);
  moveArrayItem(item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY], fromIdx, toIdx);
  scheduleSave();
  render();
}
function updateFollowUpNoteText(item, idx, value){
  migrateHoldFollowUpNotes(item);
  const note = item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY][idx];
  if(!note) return;
  const old = note.text || "";
  if(old === value) return;
  note.text = value;
  recordChange(item.id, "item", item.id, item.name, "followUpNoteText", "Follow-Up note", old, value);
  scheduleSave();
  render();
}
function updateFollowUpNoteDate(item, idx, value){
  migrateHoldFollowUpNotes(item);
  const note = item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY][idx];
  if(!note) return;
  const old = note.date || "";
  const next = value || "";
  if(old === next) return;
  note.date = next || null;
  repositionNoteByDate(item.stepNotes[HOLD_FOLLOWUP_NOTE_KEY], idx);
  recordChange(item.id, "item", item.id, item.name, "followUpNoteDate", "Follow-Up note date", old, next);
  scheduleSave();
  render();
}
function addStepNote(item, field, label, text, date){
  const value = text.trim();
  if(!value) return;
  migrateStepNotes(item);
  // stored as HTML downstream (rendered directly, and reopened in the rich
  // editor) — escape this plain-input value so it's safe either way.
  insertNoteSorted(item.stepNotes[field], { id: uid("sn"), text: escapeHtml(value), date: date || null, createdAt: new Date().toISOString() });
  recordChange(item.id, "item", item.id, item.name, field + "Note", label + " note added", "", value);
  scheduleSave();
  render();
}
function removeStepNote(item, field, label, idx){
  migrateStepNotes(item);
  const removed = item.stepNotes[field][idx];
  item.stepNotes[field].splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, field + "Note", label + " note removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function reorderStepNote(item, field, fromIdx, toIdx){
  migrateStepNotes(item);
  moveArrayItem(item.stepNotes[field], fromIdx, toIdx);
  scheduleSave();
  render();
}
function updateStepNoteText(item, field, label, idx, value){
  migrateStepNotes(item);
  const note = item.stepNotes[field][idx];
  if(!note) return;
  const old = note.text || "";
  if(old === value) return;
  note.text = value;
  recordChange(item.id, "item", item.id, item.name, field + "NoteText", label + " note", old, value);
  scheduleSave();
  render();
}
function updateStepNoteDate(item, field, label, idx, value){
  migrateStepNotes(item);
  const note = item.stepNotes[field][idx];
  if(!note) return;
  const old = note.date || "";
  const next = value || "";
  if(old === next) return;
  note.date = next || null;
  repositionNoteByDate(item.stepNotes[field], idx);
  recordChange(item.id, "item", item.id, item.name, field + "NoteDate", label + " note date", old, next);
  scheduleSave();
  render();
}
function updateCustomStepField(item, id, key, value){
  migrateCustomSteps(item);
  const cs = item.customSteps.find(c => c.id === id);
  if(!cs) return;
  const old = cs[key] || "";
  if(old === value) return;
  cs[key] = value;
  recordChange(item.id, "item", item.id, item.name, "customStep." + key, cs.label + " " + key, old, value);
  scheduleSave();
  render();
}
function removeCustomStep(item, id){
  migrateCustomSteps(item);
  const idx = item.customSteps.findIndex(c => c.id === id);
  if(idx === -1) return;
  const removed = item.customSteps[idx];
  item.customSteps.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "customStep", "Custom step removed", removed.label, "");
  scheduleSave();
  render();
}

function migrateTitleDetails(item){
  if(Array.isArray(item.titleDetails)) return;
  const hasLegacy = item.logline !== undefined || item.originalOrAdapted !== undefined || item.episodeCount !== undefined || item.rightsAdaptations !== undefined;
  if(hasLegacy && (item.logline || item.originalOrAdapted || item.episodeCount || item.rightsAdaptations)){
    item.titleDetails = [{
      id: uid("td"),
      title: (item.titles && item.titles[0]) || "",
      logline: item.logline || "",
      originalOrAdapted: item.originalOrAdapted || "",
      episodeCount: item.episodeCount || "",
      rightsAdaptations: item.rightsAdaptations || "",
    }];
  }else{
    item.titleDetails = [];
  }
}
function renderTitleDetailsPanel(item){
  migrateTitleDetails(item);
  migrateTitlePriority(item);
  const panel = el(`<div class="panel"><div class="panel-head"><div><h2>Titles</h2></div></div><div class="panel-pad" id="td-list"></div></div>`);
  const list = panel.querySelector("#td-list");

  const priorityDetails = [];
  const additionalDetails = [];
  item.titleDetails.forEach((td, idx) => {
    (isTitlePriority(item, td.title) ? priorityDetails : additionalDetails).push({ td, idx });
  });

  priorityDetails.forEach(({ td, idx }) => {
    list.appendChild(td.posted ? renderPostedTitleBlock(item, td, idx) : renderEditableTitleBlock(item, td, idx));
  });

  if(additionalDetails.length){
    const toggleBtn = el(`<button class="title-tags-toggle" data-role="toggle-additional">${item.additionalTitlesHidden ? "Show additional titles" : "Hide additional titles"}</button>`);
    toggleBtn.onclick = () => toggleAdditionalTitlesHidden(item);
    list.appendChild(toggleBtn);
    if(!item.additionalTitlesHidden){
      additionalDetails.forEach(({ td, idx }) => {
        list.appendChild(td.posted ? renderPostedTitleBlock(item, td, idx) : renderEditableTitleBlock(item, td, idx));
      });
    }
  }

  const addBtn = el(`<button class="btn btn-sm" id="td-add">+ Add title</button>`);
  addBtn.onclick = () => addTitleDetail(item);
  list.appendChild(addBtn);
  return panel;
}

/** Splits sanitized rich-text HTML on its <br> line breaks into separate items. */
function splitRichLines(html){
  return (html || "")
    .split(/<br\s*\/?>/i)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}
function htmlToPlainText(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return (d.textContent || "").trim();
}
/** Adaptations used to be one rich-text blob; now it's a proper list of
 * items. Migrates any existing blob (splitting on its line breaks, and
 * stripping bold/italic markup down to plain text) into that list. */
function migrateAdaptations(td){
  if(Array.isArray(td.adaptations)) return;
  if(td.rightsAdaptations){
    const lines = splitRichLines(td.rightsAdaptations);
    td.adaptations = lines.map(l => ({ id: uid("ad"), text: escapeHtml(htmlToPlainText(l)) }));
  }else{
    td.adaptations = [];
  }
}
function addAdaptation(item, tdIdx, text){
  const value = (text || "").trim();
  if(!value) return;
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  // stored as HTML downstream (rendered directly, and re-opened in the rich
  // editor) — escape this plain-input value so it's safe either way.
  td.adaptations.push({ id: uid("ad"), text: escapeHtml(value) });
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation added", "", value);
  scheduleSave();
  render();
}
function removeAdaptation(item, tdIdx, adIdx){
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  const removed = td.adaptations[adIdx];
  td.adaptations.splice(adIdx, 1);
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation removed", (removed && removed.text) || "", "");
  scheduleSave();
  render();
}
function updateAdaptationText(item, tdIdx, adIdx, value){
  const td = item.titleDetails[tdIdx];
  if(!td) return;
  migrateAdaptations(td);
  const ad = td.adaptations[adIdx];
  if(!ad) return;
  const trimmed = value.trim();
  const old = ad.text || "";
  if(old === trimmed) return;
  ad.text = trimmed;
  recordChange(item.id, "item", item.id, item.name, "titleDetails.adaptations", (td.title || "Title") + " adaptation edited", old, trimmed);
  scheduleSave();
  render();
}

  td.posted = posted;
  recordChange(item.id, "item", item.id, item.name, "titleDetails.posted", (td.title || "Title") + (posted ? " finished" : " reopened for editing"), "", "");

function addTitleDetail(item){
  migrateTitleDetails(item);
  item.titleDetails.push({ id: uid("td"), title:"", logline:"", genre:"", originalOrAdapted:"", episodeCount:"", basedOn:"", originalRun:"", broadcaster:"", adaptations:[], notes:"", posted:false });
  recordChange(item.id, "item", item.id, item.name, "titleDetails", "Title added", "", "");

  render();

function removeTitleDetail(item, idx){
  migrateTitleDetails(item);
  const removed = item.titleDetails[idx];
  item.titleDetails.splice(idx, 1);
  if(removed && removed.title) removeTitleTagByText(item, removed.title);
  recordChange(item.id, "item", item.id, item.name, "titleDetails", "Title removed", (removed && removed.title) || "", "");
  scheduleSave();
  render();
}
function updateTitleDetail(item, idx, key, value){
  migrateTitleDetails(item);
  const td = item.titleDetails[idx];
  if(!td) return;
  const old = td[key] || "";
  if(old === value) return;
  td[key] = value;
  if(key === "title"){
    // keep the tag list under the estate name in sync with a rename here
    if(old) removeTitleTagByText(item, old);
    const trimmed = (value || "").trim();
    if(trimmed) ensureTitleTag(item, trimmed);
  }
  recordChange(item.id, "item", item.id, item.name, "titleDetails." + idx + "." + key, "Title " + key, old, value);
  scheduleSave();
  render();
}

/* ---- File attachments (Titles, Additional Notes) ----------------------
 * Stored as base64 data URIs directly in the same JSON blob as everything
 * else — there's no separate file/blob backend here. Capped per file so a
 * few large binaries don't balloon every save. */
const ATTACHMENT_MAX_BYTES = 5 * 1024 * 1024;
function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function readAttachableFiles(fileList){
  const out = [];
  for(const file of fileList){
    if(file.size > ATTACHMENT_MAX_BYTES){
      showToast(`"${file.name}" is over 5MB — too large to attach here.`);
      continue;
    }
    try{
      const dataUrl = await readFileAsDataUrl(file);
      out.push({ id: uid("att"), name: file.name, mimeType: file.type || "application/octet-stream", size: file.size, dataUrl });
    }catch(e){
      showToast(`Couldn't read "${file.name}".`);
    }
  }
  return out;
}
function formatFileSize(bytes){
  if(bytes == null) return "";
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
/** Shared attach-button + file list, used on both Titles and Additional
 * Notes. onAdd receives the already-read attachment objects; onRemove
 * receives the index to drop. Both are expected to persist + re-render. */
function renderAttachmentsBlock(attachments, onAdd, onRemove){
  const wrap = el(`<div class="attachments-block"></div>`);
  if(attachments && attachments.length){
    const list = el(`<div class="attachments-list"></div>`);
    attachments.forEach((att, idx) => {
      const row = el(`
        <div class="attachment-row">
          <a href="${att.dataUrl}" download="${escapeHtml(att.name)}" class="attachment-link">📎 ${escapeHtml(att.name)}</a>
          <span class="attachment-size">${formatFileSize(att.size)}</span>
          <button class="ec-remove" title="Remove attachment" data-role="remove-att">×</button>
        </div>
      `);
      row.querySelector('[data-role="remove-att"]').onclick = () => onRemove(idx);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  const addRow = el(`
    <label class="attach-btn" title="Attach a file">
      📎 Attach file
      <input type="file" multiple style="display:none;" data-role="file-input" />
    </label>
  `);
  addRow.querySelector('[data-role="file-input"]').addEventListener("change", async (e) => {
    const files = e.target.files;
    e.target.value = "";
    if(!files || !files.length) return;
    const read = await readAttachableFiles(files);
    if(read.length) onAdd(read);
  });
  wrap.appendChild(addRow);
  return wrap;
}
function migrateNotesAttachments(item){
  if(!Array.isArray(item.notesAttachments)) item.notesAttachments = [];
}
function addNotesAttachments(item, newAtts){
  migrateNotesAttachments(item);

  recordChange(item.id, "item", item.id, item.name, "notesAttachment", "Additional Notes attachment(s) added", "", newAtts.map(a => a.name).join(", "));
  scheduleSave();
  render();
}
function removeNotesAttachment(item, idx){
  migrateNotesAttachments(item);

  item.notesAttachments.splice(idx, 1);
  recordChange(item.id, "item", item.id, item.name, "notesAttachment", "Additional Notes attachment removed", (removed && removed.name) || "", "");
  scheduleSave();
  render();
}
function migrateTitleAttachments(td){
  if(!Array.isArray(td.attachments)) td.attachments = [];
}
function addTitleAttachments(item, idx, newAtts){
  const td = item.titleDetails[idx];
  if(!td) return;
  migrateTitleAttachments(td);
  td.attachments.push(...newAtts);
  recordChange(item.id, "item", item.id, item.name, "titleAttachment", (td.title || "Title") + " attachment(s) added", "", newAtts.map(a => a.name).join(", "));
  scheduleSave();
  render();
}
function removeTitleAttachment(item, idx, attIdx){
  const td = item.titleDetails[idx];
  if(!td) return;
  migrateTitleAttachments(td);
  const removed = td.attachments[attIdx];
  td.attachments.splice(attIdx, 1);
  recordChange(item.id, "item", item.id, item.name, "titleAttachment", (td.title || "Title") + " attachment removed", (removed && removed.name) || "", "");
  scheduleSave();
  render();
}

/* ---- Estate notes: read-only once entered, unlock to edit, dated ---- */
function notesEffectiveDate(item){ return isValidDate(item.notesDate) ? item.notesDate : (isValidDate(item.notesCreatedAt) ? item.notesCreatedAt : ""); }
function buildEstateNotesBlock(item, opts){
  opts = opts || {};
  const holder = el(`<div></div>`);
  let editing = false;
  const save = (v) => {
    if(v === (item.notes || "")) return;
    const old = item.notes || "";
    item.notes = v; item.updatedAt = new Date().toISOString();
    recordChange(item.id, "item", item.id, item.name, "notes", "Estate notes", old, v);
    scheduleSave();
  };
  const paint = () => {
    holder.innerHTML = "";
    const has = !richIsEmpty(item.notes);
    if(has && !editing){
      const d = notesEffectiveDate(item);
      const row = el(`<div><div class="notes-date-row"><span class="notes-date"></span><button class="btn btn-sm btn-ghost" type="button">Edit</button></div><div class="td-readonly-text"></div></div>`);
      row.querySelector(".notes-date").textContent = d ? fmtDateShort(d) : "";
      if(opts.bullets){
        const box = row.querySelector(".td-readonly-text");
        for(const ln of splitRichLines(item.notes)){ const b = document.createElement("div"); b.className = "note-bullet"; b.innerHTML = ln.replace(/^(\s|&nbsp;)+/i, ""); box.appendChild(b); }
        // date and Edit sit beside the note, not above it
        row.classList.add("note-side");
        row.appendChild(row.querySelector(".notes-date-row"));
      }else row.querySelector(".td-readonly-text").innerHTML = item.notes;
      row.querySelector("button").onclick = () => { editing = true; paint(); const ed = holder.querySelector("[contenteditable]"); if(ed) ed.focus(); };
      holder.appendChild(row);
      return;
    }
    if(editing){
      const dr = el(`<div class="notes-date-row"><span class="notes-date-label">Date</span><input type="date" class="step-note-date-input" value="${notesEffectiveDate(item)}" /></div>`);
      const di = dr.querySelector("input");
      wrapDateField(di, notesEffectiveDate(item), "Date");
      di.onchange = (e) => {
        const old = item.notesDate || "", nv = e.target.value || "";
        if(old === nv) return;
        item.notesDate = nv;
        recordChange(item.id, "item", item.id, item.name, "notesDate", "Estate notes date", old, nv);
        scheduleSave();
        const disp = dr.querySelector(".date-field-display");
        const eff = notesEffectiveDate(item);
        if(disp){ disp.textContent = eff ? fmtDate(eff) : "Date"; disp.classList.toggle("placeholder", !eff); }
      };
      holder.appendChild(dr);
    }
    const ed = createRichTextEditor(item.notes || "", "Add notes about the estate…", 60);
    holder.appendChild(ed.wrap);
    bindCommitRich(ed.editable, save);
    if(editing){
      const done = el(`<button class="btn btn-sm" type="button" style="margin-top:6px;">Done</button>`);
      done.onmousedown = (e) => e.preventDefault();
      done.onclick = () => { save(sanitizeRichHTML(ed.editable.innerHTML)); editing = false; paint(); };
      holder.appendChild(done);
    }else{
      ed.editable.addEventListener("blur", () => setTimeout(() => { if(!richIsEmpty(item.notes)) paint(); }, 0));
    }
  };
  paint();
  return holder;
}
function titleTagEl(item, title){
  const t = el(`<span class="todo-title-tag" title="Open title page"></span>`);
  t.textContent = stripTags(title);
  t.onclick = (e) => { e.stopPropagation(); if((item.titles || []).includes(title)) openTitlePage(item, title); };
  return t;
}
function renderNotesPanel(item){
  migrateNotesAttachments(item);
  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><h2>Estate notes</h2></div></div>
      <div class="panel-pad">
        <div id="f-notes-holder"></div>
        <div id="notes-attachments-holder" style="margin-top:12px;"></div>
      </div>
    </div>
  `);
  panel.querySelector("#f-notes-holder").appendChild(buildEstateNotesBlock(item));
  panel.querySelector("#notes-attachments-holder").appendChild(
    renderAttachmentsBlock(
      item.notesAttachments,
      (newAtts) => addNotesAttachments(item, newAtts),
      (idx) => removeNotesAttachment(item, idx)
    )
  );
  return panel;
}

function renderChangeRow(c, showItemName){
  const item = STATE.data.items.find(i=>i.id===c.itemId);
  const when = (() => {
    try{
      const d = new Date(c.changedAt);
      const month = new Intl.DateTimeFormat("en-US", { month:"short" }).format(d);
      const day = String(d.getDate()).padStart(2, "0");
      return `${month}. ${day}, ${d.getFullYear()}`;
    }catch(e){ return "—"; }
  })();
  const isDate = ISO_DATE.test(c.oldValue) || ISO_DATE.test(c.newValue);
  const delta = c.oldValue && c.newValue
    ? `${isDate ? fmtDateShort(c.oldValue) : escapeHtml(c.oldValue)} → ${isDate ? fmtDateShort(c.newValue) : escapeHtml(c.newValue)}`
    : (c.newValue ? escapeHtml(c.newValue) : "");
  const revertible = canRevertChange(c);
  const row = el(`
    <div class="change-row">
      <div class="change-time">${when}</div>
      <div class="change-body">
        ${showItemName && item ? `<b class="link-click" data-role="open-estate" title="Open estate">${escapeHtml(item.name)}</b> — ` : ""}${escapeHtml(c.fieldLabel || c.field)}
        ${delta ? `<div class="change-delta">${delta}</div>` : ""}
        ${c.note ? `<div class="kv-sub" style="margin-top:2px;">${escapeHtml(c.note)}</div>` : ""}
      </div>
      ${revertible ? `<button class="btn btn-ghost btn-sm change-revert" data-role="revert">↺ Revert</button>` : ""}
    </div>
  `);
  if(revertible){
    row.querySelector('[data-role="revert"]').onclick = () => revertChange(c);
  }
  { const oe = row.querySelector('[data-role="open-estate"]'); if(oe && item) oe.onclick = () => openEstatePage(item); }
  return row;
}

function renderQuickAddModal(){
  const backdrop = el(`<div class="modal-backdrop"><div class="modal modal-quickadd"><h3>New item</h3><div data-role="slot"></div><div class="modal-actions"><button class="btn btn-ghost" id="qa-cancel" type="button">Close</button></div></div></div>`);
  const form = buildQuickAdd();
  if(form) backdrop.querySelector('[data-role="slot"]').appendChild(form);
  const close = () => { STATE.modal = null; render(); };
  backdrop.querySelector("#qa-cancel").onclick = close;
  backdrop.addEventListener("click", (e) => { if(e.target === backdrop) close(); });
  backdrop.addEventListener("keydown", (e) => { if(e.key === "Escape") close(); });
  return backdrop;
}
/* ---- New item modal -------------------------------------------------------- */
function renderNewItemModal(){
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h3>New item</h3>
        <span class="field-label">Name</span>
        <input class="text-input" id="m-name" placeholder="e.g. Rearview — feature rights" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="m-cancel">Cancel</button>
          <button class="btn btn-primary" id="m-create">Create item</button>
        </div>
      </div>
    </div>
  `);
  backdrop.querySelector("#m-cancel").onclick = () => { STATE.modal = null; render(); };
  backdrop.addEventListener("click", (e) => { if(e.target === backdrop){ STATE.modal = null; render(); } });
  backdrop.querySelector("#m-create").onclick = () => {
    const name = backdrop.querySelector("#m-name").value.trim();
    if(!name) return;
    const now = new Date().toISOString();
    const item = {
      id: uid("itm"), name, owner: "", currentPhase: "Call", status: "",
      summary: "", notes: "",
      target_call:"", target_pitch:"", target_proposal:"",
      target_rights_secured:"", stepNotes:{}, stepActuals:{}, customSteps:[], removedPresetSteps:[], stepPending:{}, stepLabelOverrides:{}, estateCategory:"pursuing", todoCategory:"call", todo:{stepRef:"",text:"",priority:false,assignee:""}, titles:[], estateContacts:[],
      titleDetails:[], createdAt: now, updatedAt: now,
    };
    STATE.data.items.push(item);
    recordChange(item.id, "item", item.id, item.name, "created", "Item created", "", name);
    STATE.modal = null;
    STATE.currentItemId = item.id;
    STATE.view = "detail";
    scheduleSave();
    render();
  };
  return backdrop;
}
