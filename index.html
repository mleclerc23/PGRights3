  if(m && m.includes(title)) return true;
  // The Action List box is headed with several titles ("Z-Cars / Softly, Softly"): what is in it applies to each of them.
  const own = stripTags(item.todoTitleLabel || "").trim();
  if(own && m && m.length){
    const L = matchTitlesIn(item, own);
    // only when everything titled in this estate's list sits inside that heading (no separate per-title sections)
    if(L && L.length > 1 && L.includes(title) && m.some(x => L.includes(x)) &&
       (item.todos || []).every(x => !x.title || (matchTitlesIn(item, x.title) || []).every(y => L.includes(y)))) return true;
  }
  return false;
}
function todoTitlesLabel(item){
  const own = stripTags(item.todoTitleLabel || "").trim();
  if(own) return own.toUpperCase();
  if(Array.isArray(item.todos)){
    // Everything shown in the box (open, notes, recently completed) decides the heading, so finishing a to-do never changes it.
    const open = item.todos.filter(t => !t.followUp && !richIsEmpty(t.text) && (t.kind === "note" || !t.done || isRecentDone(t)));
    if(!open.length && item.todos.some(t => t.followUp && !richIsEmpty(t.text))) return "";   // only a follow-up to-do: headed by the estate alone
    if(open.length && open.every(t => t.title)){
      const tagged = new Set(open.map(t => t.title));
      const ordered = (item.titles && item.titles.length ? orderedTitleList(item) : []).filter(t => tagged.has(t));
      const names = (ordered.length ? ordered : Array.from(tagged)).map(t => stripTags(t)).filter(Boolean);
      if(names.length) return names.join(" / ").toUpperCase();
    }
  }
  return (item.titles && item.titles.length) ? orderedTitleList(item).map(t => stripTags(t)).filter(Boolean).join(" / ").toUpperCase() : "";
}
/** When one estate's Action List box covers several titles, each title gets its own section (same look as the first),
 *  sorted alphabetically. Returns null when a single heading is enough.  [{ tag: "" | title string, label: "CALLAN" }] */
function todoSections(item){
  if(!item || item.id === GENERAL_ID) return null;
  migrateTodos(item);
  const vis = item.todos.filter(t => !t.followUp && !richIsEmpty(t.text) && (t.kind === "note" || !t.done || isRecentDone(t)));
  // Titles added to this box without a to-do (item.actionTitles) still get a section.
  const pinned = (item.actionTitles || []).filter(t => (item.titles || []).includes(t));
  const tagged = Array.from(new Set(vis.filter(t => t.title).map(t => t.title).concat(pinned)));
  const untagged = vis.some(t => !t.title);
  if(!tagged.length || (tagged.length === 1 && !untagged && vis.some(t => t.title === tagged[0]))) return null;
  // A heading naming several titles ("Z-Cars / Softly, Softly") keeps everything under it together: one box for that set of titles.
  if(untagged){
    const own = stripTags(item.todoTitleLabel || "").trim();
    const L = own ? matchTitlesIn(item, own) : null;
    if(L && L.length >= 2 && tagged.every(t => L.includes(t))) return null;
  }
  const secs = [];
  let mergeInto = null;
  if(untagged){
    const own = stripTags(item.todoTitleLabel || "").trim();
    const rest = orderedTitleList(item).filter(t => !tagged.includes(t)).map(t => stripTags(t)).filter(Boolean);
    const label = (own || rest.join(" / ")).toUpperCase();
    // Items with no title belong with the title they are headed by: same heading as a titled section, or the estate's only title.
    const same = tagged.find(t => stripTags(t).trim().toUpperCase() === label.trim());
    const onlyTitle = (item.titles || []).filter(t => stripTags(t)).length === 1 && tagged.length === 1 ? tagged[0] : null;
    mergeInto = same || (!label ? onlyTitle : null) || null;
    if(!mergeInto) secs.push({ tag: "", label });
  }
  for(const t of tagged) secs.push({ tag: t, label: stripTags(t).toUpperCase(), withUntagged: t === mergeInto });
  secs.sort((a, b) => byName(a.label || item.name, b.label || item.name));
  return secs;
}
/** Typed heading -> stored heading. Pieces that match one of the estate's titles use that title's spelling. */
function normalizeTitleHeading(item, text){
  const known = (item.titles || []).map(t => stripTags(t)).filter(Boolean);
  return text.split("/").map(p => p.trim()).filter(Boolean).map(p => {
    const hit = known.find(k => k.toLowerCase() === p.toLowerCase());
    return hit || p;
  }).join(" / ");
}

/** Pointer-based drag (works in every browser and on touch, unlike native HTML5 drag-and-drop). */
function bindPointerDrag(handle, srcEl, kind, srcItemId, srcTodoId){
  handle.style.touchAction = "none";
  handle.addEventListener("pointerdown", (e) => {
    if(e.button) return;
    e.preventDefault(); e.stopPropagation();
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    const startY = e.clientY, startX = e.clientX;
    let dragging = false, hot = null, hotTodo = null;
    const clear = () => { document.querySelectorAll(".drop-target-note").forEach(x => x.classList.remove("drop-target-note")); };
    const find = (x, y) => {
      const under = document.elementFromPoint(x, y);
      if(!under) return null;
      if(kind === "todo"){
        const row = under.closest(".todo-item-row");
        if(row && row.dataset.todoId) return { el: row, itemId: row.dataset.itemId, before: row.dataset.todoId };
        const add = under.closest(".todo-add-wrap");
        if(add && add.dataset.itemId) return { el: add, itemId: add.dataset.itemId, before: null };
        const ent = under.closest(".todo-entry");
        if(ent && ent.dataset.itemId) return { el: ent, itemId: ent.dataset.itemId, before: null };
        return null;
      }
      const ent = under.closest(".todo-entry");
      return ent && ent.dataset.itemId ? { el: ent, itemId: ent.dataset.itemId } : null;
    };
    const move = (ev) => {
      if(!dragging && Math.abs(ev.clientY - startY) + Math.abs(ev.clientX - startX) > 5){
        dragging = true; srcEl.classList.add("dragging-note"); document.body.classList.add("is-dragging");
      }
      if(!dragging) return;
      clear();
      hot = find(ev.clientX, ev.clientY);
      if(hot && hot.el !== srcEl) hot.el.classList.add("drop-target-note");
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      clear(); srcEl.classList.remove("dragging-note"); document.body.classList.remove("is-dragging");
      if(dragging && hot) onPointerDrop(kind, srcItemId, srcTodoId, hot);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}
function onPointerDrop(kind, srcItemId, srcTodoId, target){
  if(kind === "todo"){
    moveTodoBefore(srcItemId, srcTodoId, target.itemId, target.before);
    return;
  }
  if(target.itemId === srcItemId) return;
  const ids = Array.from(document.querySelectorAll(".todo-entry")).map(x => x.dataset.itemId).filter(Boolean);
  const from = ids.indexOf(srcItemId), to = ids.indexOf(target.itemId);
  if(from === -1 || to === -1) return;
  moveArrayItem(ids, from, from < to ? to + 1 : to);
  STATE.data.todoOrder = ids;
  scheduleSave();
  renderOverviewInPlace();
}
/** Two-step delete: first click arms the button ("Delete?"), second click within 3s removes the to-do. */
function bindConfirmDelete(btn, onConfirm, idleLabel, armedLabel){
  let armed = false, timer = null;
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if(btn.disabled) return;
    if(!armed){
      armed = true; btn.classList.add("armed"); btn.textContent = armedLabel || "Delete?";
      timer = setTimeout(() => { armed = false; btn.classList.remove("armed"); btn.innerHTML = idleLabel; }, 3000);
    }else{
      clearTimeout(timer); onConfirm();
    }
  });
}
/** Small padlock icon (closed when locked). */
function lockIconSVG(locked){
  return locked
    ? `<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>`
    : `<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 5.6-1.5"/></svg>`;
}
function lockButtonHTML(t){
  return `<button class="todo-lock ${t.locked ? "on" : ""}" data-role="lock" title="${t.locked ? "Locked - click to unlock" : "Lock (make read-only)"}">${lockIconSVG(!!t.locked)}</button>`;
}

/** The editable list of to-dos for one estate (used on the To-Do page and on the estate page). */
function renderTodoItemsEditor(item, opts){
  migrateTodos(item);
  const onlyTitle = opts && opts.title ? opts.title : "";
  const exact = !!(opts && opts.exact);
  const withUntagged = !!(opts && opts.withUntagged);
  const addKey = exact ? item.id + "|" + onlyTitle : item.id;
  const canTitle = item.id !== GENERAL_ID && !(onlyTitle && !exact);
  const wrap = el(`<div class="todo-items"></div>`);
  const showTag = !onlyTitle && !exact && !(opts && opts.noTag) && item.id !== GENERAL_ID;
  const base = item.todos.filter(t => !richIsEmpty(t.text) && (exact ? ((t.title || "") === onlyTitle || (withUntagged && !t.title)) : (!onlyTitle || todoOnTitle(t, onlyTitle, item))));
  // Pending to-dos first (urgent on top), then a dated log of notes and recently completed to-dos, newest first.
  const pendingRows = sortedTodos(base.filter(t => t.kind !== "note" && !t.done));
  const logRows = base.map((t, i) => ({ t, i })).filter(x => x.t.kind === "note" || (x.t.done && isRecentDone(x.t)))
    .sort((a, b) => { const da = logDate(a.t), db = logDate(b.t); return da < db ? 1 : da > db ? -1 : b.i - a.i; }).map(x => x.t);
  const buildNoteRow = (t) => {
    const r = el(`
      <div class="todo-item-row is-note ${t.locked ? "is-locked" : ""}">
        <span class="todo-drag" title="Drag to reorder" data-role="drag">&#10303;</span>
        <span class="note-square" aria-hidden="true"></span>
        <div class="todo-item-main">
          <div class="todo-text-row"><div class="todo-text-holder" data-holder="text"></div></div>
          <div class="todo-item-notes" data-holder="notes"></div>
          <div class="todo-item-sub"><input type="date" class="step-note-date-input" value="${isValidDate(t.date) ? t.date : ""}" data-role="date" ${t.locked ? "disabled" : ""} /></div>
        </div>
        ${lockButtonHTML(t)}
        <button class="ec-remove todo-remove" title="${t.locked ? "Unlock to delete" : "Delete note"}" data-role="remove" ${t.locked ? "disabled" : ""}>&times;</button>
      </div>
    `);
    const line = createRichTextLine(t.text || "", "Write a note…", "todo-task-input");
    r.querySelector('[data-holder="text"]').appendChild(line);
    bindCommitRich(line, v => updateTodo(item, t.id, "text", v));
    const nDate = r.querySelector('[data-role="date"]');
    { const sb = r.querySelector(".todo-item-sub"); r.querySelector(".todo-text-row").appendChild(sb); sb.classList.add("todo-row-date"); }
    wrapDateField(nDate, t.date, "Date (optional)");
    nDate.onchange = (e) => updateTodo(item, t.id, "date", e.target.value || "");
    const nNotes = createRichTextLine(richIsEmpty(t.notes) ? "" : t.notes, "Add a note…", "todo-eyebrow");
    r.querySelector('[data-holder="notes"]').appendChild(nNotes);
    bindCommitRich(nNotes, v => updateTodo(item, t.id, "notes", v));
    if(t.locked){ line.contentEditable = "false"; nNotes.contentEditable = "false"; }
    r.querySelector('[data-role="lock"]').onclick = () => updateTodo(item, t.id, "locked", !t.locked);
    bindConfirmDelete(r.querySelector('[data-role="remove"]'), () => removeTodo(item, t.id), "&times;");
    r.dataset.itemId = item.id; r.dataset.todoId = t.id;
    if(showTag && t.title) r.querySelector(".todo-item-main").prepend(titleTagEl(item, t.title));
    bindPointerDrag(r.querySelector('[data-role="drag"]'), r, "todo", item.id, t.id);
    return r;
  };
  const buildRow = (t) => {
    if(t.kind === "note") return buildNoteRow(t);
    const r = el(`
      <div class="todo-item-row ${t.done ? "is-done" : ""} ${t.locked ? "is-locked" : ""} ${t.urgent ? "is-urgent" : ""}">
        <span class="todo-drag" title="Drag to reorder" data-role="drag">&#10303;</span>
        <button class="todo-done ${t.done ? "on" : ""}" data-role="done" title="${t.done ? "Mark not done" : "Mark done"}" ${t.locked ? "disabled" : ""}>${t.done ? "&#10003;" : ""}</button>
        <div class="todo-item-main">
          <div class="todo-text-row">
            <div class="todo-text-holder" data-holder="text"></div>
            <button class="urgent-toggle ${t.urgent ? "on" : ""}" data-role="urgent" title="${t.urgent ? "Not urgent" : "Mark urgent"}" ${t.locked ? "disabled" : ""}>Urgent</button>
          </div>
          <div class="todo-item-notes" data-holder="notes"></div>
          <div class="todo-item-sub">
            <input type="date" class="step-note-date-input" value="${isValidDate(t.done ? t.doneAt : t.date) ? (t.done ? t.doneAt : t.date) : ""}" data-role="date" ${t.locked ? "disabled" : ""} />
          </div>
        </div>
        ${lockButtonHTML(t)}
        <button class="ec-remove todo-remove" title="${t.locked ? "Unlock to delete" : "Delete to-do"}" data-role="remove" ${t.locked ? "disabled" : ""}>&times;</button>
      </div>
    `);
    const textLine = createRichTextLine(t.text || "", "What needs doing…", "todo-task-input");
    r.querySelector('[data-holder="text"]').appendChild(textLine);
    bindCommitRich(textLine, v => updateTodo(item, t.id, "text", v));
    const dateInput = r.querySelector('[data-role="date"]');
    {  // compact: the date sits at the right of the task's own line instead of on a row of its own
      const sb = r.querySelector(".todo-item-sub");
      r.querySelector(".todo-text-row").appendChild(sb);
      sb.classList.add(t.done ? "todo-done-date" : "todo-row-date");
    }
    const dateKey = t.done ? "doneAt" : "date";
    wrapDateField(dateInput, t.done ? t.doneAt : t.date, t.done ? "Completed date" : "Target date");
    dateInput.onchange = (e) => updateTodo(item, t.id, dateKey, e.target.value || "");
    const notesLine = createRichTextLine(richIsEmpty(t.notes) ? "" : t.notes, "Add a note…", "todo-eyebrow");
    r.querySelector('[data-holder="notes"]').appendChild(notesLine);
    bindCommitRich(notesLine, v => updateTodo(item, t.id, "notes", v));
    if(t.locked){
      textLine.contentEditable = "false";
      notesLine.contentEditable = "false";
    }
    r.querySelector('[data-role="done"]').onclick = () => { if(!t.locked) updateTodo(item, t.id, "done", !t.done); };
    r.querySelector('[data-role="urgent"]').onclick = () => { if(!t.locked) updateTodo(item, t.id, "urgent", !t.urgent); };
    r.querySelector('[data-role="lock"]').onclick = () => updateTodo(item, t.id, "locked", !t.locked);
    const rm = r.querySelector('[data-role="remove"]');
    if(rm) bindConfirmDelete(rm, () => removeTodo(item, t.id), "&times;");
    if(showTag && t.title) r.querySelector(".todo-item-main").prepend(titleTagEl(item, t.title));
    r.dataset.itemId = item.id; r.dataset.todoId = t.id;
    bindPointerDrag(r.querySelector('[data-role="drag"]'), r, "todo", item.id, t.id);
    return r;
  };
  for(const t of pendingRows.concat(logRows)) wrap.appendChild(buildRow(t));

  const isOpen = todoAddOpen.has(addKey);
  const add = el(`
    <div class="todo-add-wrap">
      <button class="todo-add-btn" data-role="add-toggle" type="button">+ Add</button>
      <div class="todo-add-form" ${isOpen ? "" : "hidden"}>
        <div class="todo-add-modes">
          <button type="button" data-mode="todo">To-do</button><button type="button" data-mode="note">Note</button>${canTitle ? `<button type="button" data-mode="title">Title</button>` : ""}
        </div>
        ${canTitle ? `<input type="text" class="step-note-input" list="title-list-${item.id}" placeholder="Another title in this estate…" data-role="add-title" hidden />
        <datalist id="title-list-${item.id}">${(item.titles || []).map(t => `<option value="${escapeHtml(stripTags(t))}"></option>`).join("")}</datalist>` : ""}
        <input type="text" class="step-note-input" placeholder="Add a to-do…" data-role="add-text" />
        <div class="todo-add-form-row">
          <input type="date" class="step-note-date-input" data-role="add-date" />
          <button class="btn btn-sm" data-role="add-submit" type="button">Add</button>
          <button class="btn btn-sm btn-ghost" data-role="add-close" type="button">Close</button>
        </div>
      </div>
    </div>
  `);
  const form = add.querySelector(".todo-add-form");
  const addDate = add.querySelector('[data-role="add-date"]');
  wrapDateField(addDate, "", "Target date");
  const addText = add.querySelector('[data-role="add-text"]');
  const dateWrap = addDate.closest(".date-field") || addDate;
  let mode = todoAddMode.get(addKey) || "todo";
  const applyMode = () => {
    add.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
    addText.placeholder = mode === "note" ? "Write a note…" : (mode === "title" ? "First to-do for it (optional)…" : "Add a to-do…");
    const ti = add.querySelector('[data-role="add-title"]'); if(ti) ti.hidden = mode !== "title";
    const disp = dateWrap.querySelector ? dateWrap.querySelector(".date-field-display.placeholder") : null;
    addDate.dataset.ph = mode === "note" ? "Date (optional)" : "Target date";
    if(disp) disp.textContent = addDate.dataset.ph;
    todoAddMode.set(addKey, mode);
  };
  add.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; applyMode(); addText.focus(); });
  applyMode();
  const submit = () => {
    if(mode === "title"){
      const ti = add.querySelector('[data-role="add-title"]');
      const name = ti.value.replace(/\s+/g, " ").trim();
      if(!name){ ti.focus(); return; }
      const stored = attachTitleRecord(item, name);
      if(!item.actionTitles) item.actionTitles = [];
      if(!item.actionTitles.includes(stored)) item.actionTitles.push(stored);
      todoAddMode.set(addKey, "todo");
      todoAddOpen.delete(addKey);
      if(addText.value.trim()) addTodo(item, addText.value, addDate.value || "", stored, "todo");
      else { scheduleSave(); render(); }
      return;
    }
    if(!addText.value.trim()) return;
    todoAddOpen.delete(addKey);   // the form closes once the item is published
    addTodo(item, addText.value, addDate.value || "", onlyTitle, mode);
  };
  add.querySelector('[data-role="add-toggle"]').onclick = () => {
    if(form.hidden){ form.hidden = false; todoAddOpen.add(addKey); addText.focus(); }
    else { form.hidden = true; todoAddOpen.delete(addKey); }
  };
  add.querySelector('[data-role="add-submit"]').onclick = submit;
  add.querySelector('[data-role="add-close"]').onclick = () => { form.hidden = true; todoAddOpen.delete(addKey); };
  addText.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
  const addTitleInput = add.querySelector('[data-role="add-title"]');
  if(addTitleInput) addTitleInput.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); addText.focus(); } });
  if(todoAddFocus === addKey){
    todoAddFocus = null;
    setTimeout(() => { try{ addText.focus(); }catch(e){} }, 0);
  }
  add.dataset.itemId = item.id;
  wrap.appendChild(add);
  return wrap;
}

function buildProgressRow(item, t, opts){
  const isNote = t.kind === "note";
  const when = isNote ? (isValidDate(t.date) ? `Note ${fmtDateShort(t.date)}` : (isValidDate(t.createdAt) ? `Note ${fmtDateShort(t.createdAt)}` : "Note")) : t.done
    ? (isValidDate(t.doneAt) ? `Done ${fmtDateShort(t.doneAt)}` : "Done")
    : (isValidDate(t.createdAt) ? `Added ${fmtDateShort(t.createdAt)}` : "Open");
  const row = el(`
    <div class="progress-row ${t.locked ? "is-locked" : ""}">
      <div class="progress-when">${escapeHtml(when)}</div>
      <div class="progress-body">
        <div data-holder="ptag"></div>
        <div class="progress-text ${t.done ? "is-done" : ""}">${t.text}</div>
        ${stripTags(t.notes) ? `<div class="progress-notes">${t.notes}</div>` : ""}
        ${!isNote && isValidDate(t.date) ? `<div class="progress-notes">Target ${fmtDateShort(t.date)}</div>` : ""}
        ${t.done ? `<div class="progress-completed"><span class="progress-completed-label">Completed</span><input type="date" class="step-note-date-input" value="${isValidDate(t.doneAt) ? t.doneAt : ""}" data-role="doneat" ${t.locked ? "disabled" : ""} /></div>` : ""}
      </div>
      ${t.urgent && !t.done ? `<span class="pill pill-urgent">URGENT</span>` : ""}
      <span class="pill ${isNote ? "pill-pending" : (t.done ? "pill-onplan" : "pill-pending")}">${isNote ? "note" : (t.done ? "done" : "open")}</span>
      ${t.done && !t.locked ? `<button class="btn btn-sm btn-ghost" data-role="reopen">Reopen</button>` : ""}
      ${t.done ? lockButtonHTML(t) : ""}
      <button class="btn btn-sm btn-ghost progress-delete" data-role="pdelete" ${t.locked ? "disabled title=\"Unlock to delete\"" : ""}>Delete</button>
    </div>
  `);
  if(opts && opts.showTitle && t.title) row.querySelector('[data-holder="ptag"]').appendChild(titleTagEl(item, t.title));
  const reopen = row.querySelector('[data-role="reopen"]');
  if(reopen) reopen.onclick = () => updateTodo(item, t.id, "done", false);
  bindConfirmDelete(row.querySelector('[data-role="pdelete"]'), () => removeTodo(item, t.id), "Delete");
  const lockBtn = row.querySelector('[data-role="lock"]');
  if(lockBtn) lockBtn.onclick = () => updateTodo(item, t.id, "locked", !t.locked);
  const doneAtInput = row.querySelector('[data-role="doneat"]');
  if(doneAtInput){
    wrapDateField(doneAtInput, t.doneAt, "Completed date");
    doneAtInput.onchange = (e) => updateTodo(item, t.id, "doneAt", e.target.value || "");
  }
  return row;
}
/** Estate-page "Progress": the full history of this estate's to-dos, newest first. */
function renderTodoProgressPanel(item){
  migrateTodos(item);
  const all = item.todos.filter(t => !richIsEmpty(t.text) && (t.kind === "note" || t.done));
  const stamp = (t) => (t.kind === "note" ? (isValidDate(t.date) ? t.date : t.createdAt) : (t.done ? t.doneAt : t.createdAt)) || "";
  all.sort((a, b) => stamp(a) < stamp(b) ? 1 : stamp(a) > stamp(b) ? -1 : 0);
  const panel = el(`<div class="panel"><div class="panel-head"><div><h2>Progress</h2></div></div><div class="panel-pad"><div id="progress-list"></div></div></div>`);
  const list = panel.querySelector("#progress-list");
  if(!all.length){
    list.appendChild(el(`<div class="section-note">Finished to-dos and notes for this estate are recorded here.</div>`));
    return panel;
  }
  for(const t of all) list.appendChild(buildProgressRow(item, t, { showTitle: true }));
  return panel;
}

/** The finished layout: ■ TITLE – Estate / ○ notes / ■ red to-dos. Inline styles so it pastes into Word or email intact.
 *  With editable=true every line is a live text field (data-k says which stored field it feeds). */
function buildTodoDocHTML(items, heading, editable){
  const RED = "#E0301E", INK = "#000000";
  const esc = escapeHtml;
  // Wrap a piece of text as an editable field bound to stored data.
  const fld = (k, attrs, inner) => editable ? `<span class="doc-edit" contenteditable="true" data-k="${k}" ${attrs}>${inner}</span>` : inner;
  const dateTxt = (r) => isValidDate(r.date) ? ` (${esc(fmtDateShort(r.date))})` : "";
  const subUl = (arr) => `<ul data-ul="sub" style="list-style-type:circle;padding-left:24px;margin:2px 0;color:${INK};">${lineLis(arr)}</ul>`;
  const lineLis = (arr) => arr.map(x => `<li>${fld(x.k, x.attrs, x.html)}${x.after || ""}${x.sub && x.sub.length ? subUl(x.sub) : ""}</li>`).join("");
  const pill = (t) => t.urgent ? `<span contenteditable="false" style="background:${RED};color:#FFFFFF;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:9px;">URGENT</span> ` : "";
  const todoLi = (item, t, margin) => {
    const nl = splitNoteLines(t.notes).map(l => ({ k: "tnotes", attrs: `data-item="${item.id}" data-todo="${t.id}"`, html: l }));
    let r = `<li style="${margin}color:${RED};">${pill(t)}${fld("todo", `data-item="${item.id}" data-todo="${t.id}"`, t.text)}${isValidDate(t.date) ? ` (${esc(fmtDateShort(t.date))})` : ""}`;
    if(nl.length) r += subUl(nl);
    return r + `</li>`;
  };
  let h = (heading && stripTags(heading)) ? `<div style="font-weight:bold;margin:0 0 4px 0;color:${INK};">${heading}</div>` : "";
  h += `<ul data-ul="top" style="list-style-type:square;margin:0;padding-left:28px;color:${INK};">`;
  for(const item of items){
    if(item.id === GENERAL_ID){
      for(const n of openNotes(item)){
        const tl = splitNoteLines(n.text), sl = splitNoteLines(n.notes).map(l => ({ k: "nnotes", attrs: `data-item="${item.id}" data-todo="${n.id}"`, html: l }));
        tl.forEach((l, i) => { h += `<li style="margin:10px 0;color:${INK};">${fld("ntext", `data-item="${item.id}" data-todo="${n.id}"`, l)}${i === 0 ? dateTxt(n) : ""}${i === tl.length - 1 && sl.length ? subUl(sl) : ""}</li>`; });
      }
      for(const t of sortedTodos(openTodos(item))) h += todoLi(item, t, "margin:10px 0;");
      continue;
    }
    const secs = todoSections(item);
    const sections = secs || [{ tag: null, label: todoTitlesLabel(item) }];
    sections.forEach((sec, si) => {
      const headText = `${sec.label ? esc(sec.label) + " - " : ""}${esc(item.name)}`;
      h += `<li data-entry="${item.id}" style="margin:10px 0;">${fld("head", `data-item="${item.id}" data-label="${esc(sec.label)}"${sec.tag === null ? "" : ` data-tag="${esc(sec.tag)}"`}`, headText)}`;
      if(si === 0){
        // Note lines, each tagged with the field it came from (estate-level notes sit under the first title).
        const lines = [];
        migrateEstateContacts(item);
        for(const e of todoContactEntries(item)) lines.push({ k: "contact", attrs: `data-item="${item.id}" data-ec="${item.estateContacts.indexOf(e.ec)}"`, html: e.html });
        for(const l of splitNoteLines(item.notes)) lines.push({ k: "inotes", attrs: `data-item="${item.id}"`, html: l });
        for(const n of openNotes(item)){
          splitNoteLines(n.text).forEach((l, i) => lines.push({ k: "ntext", attrs: `data-item="${item.id}" data-todo="${n.id}"`, html: l, after: i === 0 ? dateTxt(n) : "" }));
          const sl = splitNoteLines(n.notes).map(l => ({ k: "nnotes", attrs: `data-item="${item.id}" data-todo="${n.id}"`, html: l }));
          if(sl.length && lines.length && lines[lines.length - 1].attrs.includes(`data-todo="${n.id}"`) && lines[lines.length - 1].k === "ntext") lines[lines.length - 1].sub = sl;
          else for(const x of sl) lines.push(x);
        }
        if(lines.length) h += `<ul data-ul="notes" style="list-style-type:circle;padding-left:24px;margin:2px 0;">${lineLis(lines)}</ul>`;
      }
      const todos = sortedTodos(openTodos(item)).filter(t => !secs || (t.title || "") === sec.tag || (sec.withUntagged && !t.title));
      if(todos.length){
        h += `<ul data-ul="todos" style="list-style-type:square;padding-left:24px;margin:2px 0;">`;
        for(const t of todos) h += todoLi(item, t, "");
        h += `</ul>`;
      }
      h += `</li>`;
    });
  }
  return h + `</ul>`;
}

/** Make the Formatted view editable: each line saves straight back into the stored data, so the
 *  Working list, Estate pages and Title pages show the same text.
 *  Return adds a new bullet after the current one (same kind); Tab on an empty new bullet switches note <-> to-do. */
function bindFormattedEditing(docEl){
  const RED = "#E0301E";
  const findItem = (id) => id === GENERAL_ID ? getGeneralItem() : STATE.data.items.find(i => i.id === id);
  const groupSel = (k, item, todo) => `[data-k="${k}"][data-item="${item}"]` + (todo ? `[data-todo="${todo}"]` : "");
  const initial = new WeakMap();
  const isRec = (k) => k === "todo" || k === "ntext" || k === "nnotes" || k === "tnotes";
  const focusEnd = (f) => {
    f.focus();
    const r = document.createRange(); r.selectNodeContents(f); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  const dropRecord = (item, todoId) => { const i = (item.todos || []).findIndex(x => x.id === todoId); if(i > -1) item.todos.splice(i, 1); };
  const discard = (f, focusPrev) => {
    delete f.dataset.draft;   // so the blur fired by removing it does nothing
    const item = findItem(f.dataset.item);
    if(item && (f.dataset.k === "todo" || f.dataset.k === "ntext") && f.dataset.todo) dropRecord(item, f.dataset.todo);
    const prev = Array.from(docEl.querySelectorAll("[data-k]")); const idx = prev.indexOf(f);
    const li = f.closest("li"); if(li) li.remove();
    if(focusPrev && idx > 0) focusEnd(prev[idx - 1]);
    scheduleSave();
  };
  /** Build an empty bullet of the given kind ("todo" | "note" | "sub-notes" | "sub-todo-notes") after afterLi. */
  const spawn = (f, kind) => {
    const item = findItem(f.dataset.item);
    if(!item) return null;
    migrateTodos(item);
    const afterLi = f.closest("li");
    const isGen = item.id === GENERAL_ID;
    let li, span;
    const mk = (k, attrs) => { span = document.createElement("span"); span.className = "doc-edit"; span.contentEditable = "true"; span.dataset.k = k; span.dataset.item = item.id; for(const a in attrs) span.dataset[a] = attrs[a]; span.dataset.draft = "1"; li = document.createElement("li"); li.appendChild(span); };
    if(kind === "tnotes" || kind === "nnotes" || kind === "inotes"){
      mk(kind, kind === "inotes" ? {} : { todo: f.dataset.todo });
      afterLi.after(li);
    }else{
      // Which array record are we after (for ordering) and which title to inherit.
      const afterId = (afterLi.querySelector('[data-k="todo"],[data-k="ntext"]') || {}).dataset ? (afterLi.querySelector('[data-k="todo"],[data-k="ntext"]').dataset.todo) : "";
      const afterRec = (item.todos || []).find(x => x.id === afterId);
      const anyTodo = (item.todos || []).find(x => !x.done && x.kind !== "note" && x.title);
      const rec = { id: uid("tk"), text: "", date: "", notes: "", done: false, createdAt: todayISO(), doneAt: "", title: kind === "todo" ? (afterRec && afterRec.kind !== "note" ? (afterRec.title || "") : (afterRec ? "" : (anyTodo ? anyTodo.title : ""))) : "" };
      if(kind === "note") rec.kind = "note";
      const at = afterRec ? item.todos.indexOf(afterRec) + 1 : item.todos.length;
      item.todos.splice(at, 0, rec);
      mk(kind === "todo" ? "todo" : "ntext", { todo: rec.id });
      if(isGen){
        li.style.cssText = `margin:10px 0;color:${kind === "todo" ? RED : "#000"};`;
        const top = docEl.querySelector('ul[data-ul="top"]');
        const afterTop = afterLi && afterLi.parentElement === top;
        if(afterTop) afterLi.after(li); else top.appendChild(li);
      }else{
        const entry = f.closest("li[data-entry]");
        const want = kind === "todo" ? "todos" : "notes";
        let ul = entry.querySelector(`:scope > ul[data-ul="${want}"]`);
        if(!ul){
          ul = document.createElement("ul"); ul.dataset.ul = want;
          ul.style.cssText = `list-style-type:${want === "todos" ? "square" : "circle"};padding-left:24px;margin:2px 0;`;
          const other = entry.querySelector(`:scope > ul[data-ul="todos"]`);
          if(want === "notes" && other) other.before(ul); else entry.appendChild(ul);
        }
        if(kind === "todo") li.style.color = RED;
        if(afterLi.parentElement === ul) afterLi.after(li); else ul.appendChild(li);
      }
    }
    wire(span); initial.set(span, "");
    return span;
  };
  /** Flip a bullet between note and to-do (data changes, then the whole page redraws from the data so every view agrees). */
  const convertBullet = (f, force) => {
    const k = f.dataset.k;
    const item = findItem(f.dataset.item);
    if(!item || !(k === "todo" || k === "ntext" || k === "inotes" || k === "contact" || k === "tnotes" || k === "nnotes")) return;
    if(document.activeElement === f) f.blur();                 // commit any pending typing first
    migrateTodos(item);
    const anyTodo = (item.todos || []).find(x => !x.done && x.kind !== "note" && x.title);
    let focusId = "";
    if(k === "todo" || k === "ntext"){
      const t = (item.todos || []).find(x => x.id === f.dataset.todo);
      if(!t) return;
      if(k === "todo"){ t.kind = "note"; }
      else { delete t.kind; }
      recordChange(item.id, "item", item.id, item.name, "todoKind", "Changed type", k === "todo" ? "To-do" : "Note", k === "todo" ? "Note" : "To-do");
      focusId = t.id;
    }else{
      // A sub-line (estate note, contact line, or a line under a to-do) becomes its own to-do.
      const text = sanitizeRichHTML(f.innerHTML);
      if(richIsEmpty(text)) return;
      const li = f.closest("li");
      let parentRec = null;
      f.removeAttribute("data-k");   // so it no longer counts in its group
      if(k === "inotes") item.notes = Array.from(docEl.querySelectorAll(groupSel("inotes", item.id, ""))).map(g => sanitizeRichHTML(g.innerHTML)).filter(x => !richIsEmpty(x)).join("<br>");
      else if(k === "contact"){ const ec = (item.estateContacts || [])[+f.dataset.ec]; if(ec) ec.todoLine = ""; }
      else{
        parentRec = (item.todos || []).find(x => x.id === f.dataset.todo);
        if(parentRec) parentRec.notes = Array.from(docEl.querySelectorAll(groupSel(k, item.id, f.dataset.todo))).map(g => sanitizeRichHTML(g.innerHTML)).filter(x => !richIsEmpty(x)).join("<br>");
      }
      if(li) li.remove();
      const rec = { id: uid("tk"), text, date: "", notes: "", done: false, createdAt: todayISO(), doneAt: "", title: force === "note" ? "" : (parentRec && parentRec.kind !== "note" ? (parentRec.title || "") : "") };
      if(force === "note") rec.kind = "note";
      const at = parentRec ? item.todos.indexOf(parentRec) + 1 : item.todos.length;
      item.todos.splice(at, 0, rec);
      recordChange(item.id, "item", item.id, item.name, force === "note" ? "noteAdd" : "todoAdd", force === "note" ? "Note added (from a sub-note)" : "To-do added (from a note line)", "", stripTags(text));
      focusId = rec.id;
    }
    scheduleSave();
    renderOverviewInPlace();
    const nd = document.querySelector("#todo-doc");
    const nf = nd && nd.querySelector(`[data-todo="${focusId}"][data-k="todo"], [data-todo="${focusId}"][data-k="ntext"]`);
    if(nf) focusEnd(nf);
  };
  // Small chip beside the line you're on: shows its type and flips it.
  const host = docEl.parentElement;
  host.style.position = "relative";
  const bar = document.createElement("div");
  bar.className = "doc-chip-bar"; bar.style.display = "none";
  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "doc-type-chip";
  const dateIn = document.createElement("input");
  dateIn.type = "date"; dateIn.className = "doc-date-input"; dateIn.title = "Optional date";
  bar.appendChild(dateIn); bar.appendChild(chip);
  host.appendChild(bar);
  let chipFor = null;
  chip.addEventListener("mousedown", (e) => e.preventDefault());
  chip.addEventListener("click", () => { const f = chipFor; bar.style.display = "none"; if(f) convertBullet(f); });
  dateIn.addEventListener("change", () => {
    const f = chipFor; if(!f) return;
    const item = findItem(f.dataset.item); if(!item) return;
    const t = (item.todos || []).find(x => x.id === f.dataset.todo); if(!t) return;
    const v = isValidDate(dateIn.value) ? dateIn.value : "";
    if(v === (t.date || "")) return;
    if(document.activeElement === f) f.blur();
    recordChange(item.id, "item", item.id, item.name, "todoDate", "Date", t.date || "", v);
    t.date = v; scheduleSave();
    const id = t.id, k = f.dataset.k;
    renderOverviewInPlace();
    const nd = document.querySelector("#todo-doc");
    const nf = nd && nd.querySelector(`[data-todo="${id}"][data-k="${k}"]`);
    if(nf) focusEnd(nf);
  });
  docEl.addEventListener("focusin", (e) => {
    const f = e.target.closest && e.target.closest("[data-k]");
    if(!f || f.dataset.k === "head"){ bar.style.display = "none"; chipFor = null; return; }
    chipFor = f;
    const hasRec = f.dataset.k === "todo" || f.dataset.k === "ntext";
    dateIn.style.display = hasRec ? "" : "none";
    if(hasRec){ const it = findItem(f.dataset.item); const t = it && (it.todos || []).find(x => x.id === f.dataset.todo); dateIn.value = t && isValidDate(t.date) ? t.date : ""; }
    const isTodo = f.dataset.k === "todo";
    chip.innerHTML = `<span class="doc-type-dot" style="background:${isTodo ? RED : "#000"}"></span>${isTodo ? "To-do" : "Note"}`;
    chip.title = `Click (or press Tab) to make this a ${isTodo ? "Note" : "To-do"}`;
    bar.style.display = "";
    const place = () => {
      if(chipFor !== f || !f.isConnected) return;
      const hr = host.getBoundingClientRect(), fr = (f.getClientRects()[0] || f.getBoundingClientRect());
      const cr = bar.getBoundingClientRect();
      // Centre the chip on the first line of this bullet.
      const z = (host.offsetHeight ? hr.height / host.offsetHeight : 1) || 1;   // page zoom: rects are zoomed, CSS offsets are not
      bar.style.top = Math.max(0, (fr.top - hr.top + (fr.height - cr.height) / 2) / z) + "px";
    };
    place(); requestAnimationFrame(place); setTimeout(place, 120);
  });
  const hideBar = () => setTimeout(() => { if(!docEl.contains(document.activeElement) && !bar.contains(document.activeElement)){ bar.style.display = "none"; chipFor = null; } }, 0);
  docEl.addEventListener("focusout", hideBar);
  bar.addEventListener("focusout", hideBar);
  /** The note/to-do record behind a line, if any. */
  const recOf = (f) => { const it = findItem(f.dataset.item); return it ? (it.todos || []).find(x => x.id === f.dataset.todo) : null; };
  /** A new empty sub-bullet at the top of a record's sub-list. */
  const addSubLine = (f) => {
    const item = findItem(f.dataset.item), rec = recOf(f);
    if(!item || !rec) return null;
    const k = rec.kind === "note" ? "nnotes" : "tnotes";
    const li = f.closest("li");
    let ul = li.querySelector(':scope > ul[data-ul="sub"]');
    if(!ul){ ul = document.createElement("ul"); ul.dataset.ul = "sub"; ul.style.cssText = "list-style-type:circle;padding-left:24px;margin:2px 0;color:#000;"; li.appendChild(ul); }
    const span = document.createElement("span");
    span.className = "doc-edit"; span.contentEditable = "true"; span.dataset.k = k; span.dataset.item = item.id; span.dataset.todo = rec.id; span.dataset.draft = "1";
    const nli = document.createElement("li"); nli.appendChild(span);
    ul.prepend(nli);
    wire(span); initial.set(span, "");
    return span;
  };
  /** Estate-note / contact line -> a note of its own (so it can carry sub-notes), then add an empty sub-bullet under it. */
  const promoteThenSub = (pf) => {
    const k = pf.dataset.k;
    const item = findItem(pf.dataset.item);
    if(!item) return;
    const text = sanitizeRichHTML(pf.innerHTML);
    if(richIsEmpty(text)) return;
    migrateTodos(item);
    pf.removeAttribute("data-k");
    if(k === "inotes") item.notes = Array.from(docEl.querySelectorAll(groupSel("inotes", item.id, ""))).map(g => sanitizeRichHTML(g.innerHTML)).filter(x => !richIsEmpty(x)).join("<br>");
    else { const ec = (item.estateContacts || [])[+pf.dataset.ec]; if(ec) ec.todoLine = ""; }
    const rec = { id: uid("tk"), text, date: "", notes: "", done: false, createdAt: todayISO(), doneAt: "", title: "", kind: "note" };
    item.todos.push(rec);
    recordChange(item.id, "item", item.id, item.name, "noteAdd", "Note added (from an estate note line)", "", stripTags(text));
    scheduleSave();
    renderOverviewInPlace();
    const nd = document.querySelector("#todo-doc");
    const nf = nd && nd.querySelector(`[data-todo="${rec.id}"][data-k="ntext"]`);
    if(nf){ const n = nd.__addSub && nd.__addSub(nf); if(n) focusEnd(n); else focusEnd(nf); }
  };
  /** Tab on an EMPTY new bullet (as in Word / Google Docs): indent it under the bullet above, making it a sub-bullet. */
  const indentEmpty = (f) => {
    const li = f.closest("li"), prevLi = li && li.previousElementSibling;
    const pf = prevLi && prevLi.querySelector(":scope > [data-k]");
    if(!pf || pf.dataset.k === "head") return;
    const pk = pf.dataset.k;
    if(pk === "todo" || pk === "ntext"){
      discard(f, false);
      const n = addSubLine(pf); if(n) focusEnd(n);
    }else if(pk === "inotes" || pk === "contact"){
      discard(f, false);
      promoteThenSub(pf);
    }
  };
  /** Shift+Tab: on an empty sub-bullet, pop it back out to a normal bullet after its parent; on a filled one, lift it out as its own bullet. */
  const outdentSub = (f) => {
    const parent = recOf(f);
    if(!parent) return;
    const kind = parent.kind === "note" ? "note" : "todo";
    if(richIsEmpty(f.innerHTML)){
      const parentLi = f.closest("li").parentElement.closest("li");
      const pf = parentLi && parentLi.querySelector(':scope > [data-k="todo"], :scope > [data-k="ntext"]');
      discard(f, false);
      if(pf){ const n = spawn(pf, kind); if(n) focusEnd(n); }
      return;
    }
    convertBullet(f, kind);
  };
  const kindOf = (f) => {
    const k = f.dataset.k;
    if(k === "todo") return "todo";
    if(k === "tnotes" || k === "nnotes") return k;
    if(k === "inotes" || k === "contact") return "inotes";
    if(k === "ntext") return "note";
    return "";
  };
  function wire(f){
    initial.set(f, f.innerHTML);
    f.addEventListener("keydown", (e) => {
      const empty = richIsEmpty(f.innerHTML);
      if(e.key === "Enter"){
        e.preventDefault();
        if(e.altKey || e.shiftKey){ document.execCommand("insertLineBreak"); return; }
        if(f.dataset.k === "head"){ f.blur(); return; }
        if(empty){ if(f.dataset.draft) discard(f, true); else f.blur(); return; }
        const kind = kindOf(f);
        if(!kind){ f.blur(); return; }
        const n = spawn(f, kind);
        if(n) focusEnd(n); else f.blur();
        return;
      }
      if(e.key === "Tab"){
        e.preventDefault();
        const k = f.dataset.k;
        if(e.shiftKey){ if(k === "tnotes" || k === "nnotes") outdentSub(f); return; }
        if(k === "head" || k === "tnotes" || k === "nnotes") return;
        if(empty && f.dataset.draft) indentEmpty(f);     // only an empty new bullet indents
        return;
      }
      if(e.key === "Backspace" && f.dataset.draft && empty){ e.preventDefault(); discard(f, true); return; }
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); insertLinkAtSelection(f); }
    });
    f.addEventListener("paste", (e) => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\r?\n/g, " ");
      document.execCommand("insertText", false, txt);
    });
    f.addEventListener("blur", () => {
      const k = f.dataset.k, item = findItem(f.dataset.item);
      if(!item || !f.isConnected) return;
      if(f.dataset.draft && richIsEmpty(f.innerHTML)){ discard(f, false); return; }
      const clean = k === "head" ? "" : sanitizeRichHTML(f.innerHTML);
      if(k === "head"){
        const raw = f.textContent.replace(/\s+/g, " ").trim();
        if(!raw){ f.innerHTML = initial.get(f); return; }
        const m = raw.match(/^(.+?)\s+[-–—]+\s+(.+)$/);
        const label = m ? m[1].trim() : "", name = m ? m[2].trim() : raw;
        const taggedSec = f.dataset.tag !== undefined && f.dataset.tag !== "";    // a title's own heading follows the title
        const shown = f.dataset.label !== undefined ? f.dataset.label : todoTitlesLabel(item);
        if(m && !taggedSec && label.toUpperCase() !== shown){
          const v = normalizeTitleHeading(item, label);
          recordChange(item.id, "item", item.id, item.name, "todoTitleLabel", "Action List heading", item.todoTitleLabel || "", v);
          item.todoTitleLabel = v;
          f.dataset.label = label.toUpperCase();
        }
        if(name !== item.name){
          recordChange(item.id, "item", item.id, item.name, "name", "Name", item.name, name);
          item.name = name;
        }
        initial.set(f, f.innerHTML); scheduleSave(); return;
      }
      const wasDraft = !!f.dataset.draft;
      if(!wasDraft && clean === sanitizeRichHTML(initial.get(f))) return;
      if(k === "todo"){
        const t = (item.todos || []).find(x => x.id === f.dataset.todo);
        if(!t) return;
        if(richIsEmpty(clean)){ f.innerHTML = initial.get(f); return; }   // can't blank a to-do here; use ✕ on the Working list
        recordChange(item.id, "item", item.id, item.name, wasDraft ? "todoAdd" : "todoText", wasDraft ? "To-do added" : "To-do text", String(t.text || ""), clean);
        t.text = clean; delete f.dataset.draft; initial.set(f, f.innerHTML); scheduleSave(); return;
      }
      if(k === "contact"){
        const ec = (item.estateContacts || [])[+f.dataset.ec];
        if(!ec) return;
        ec.todoLine = stripTags(clean).trim() ? clean : "";
        if(!ec.todoLine) (f.closest("li") || f).remove();
        else initial.set(f, f.innerHTML);
        scheduleSave(); return;
      }
      // Multi-line fields: the lines of one field are joined back together (a cleared line is deleted).
      const todoId = f.dataset.todo || "";
      const group = Array.from(docEl.querySelectorAll(groupSel(k, f.dataset.item, todoId)));
      const parts = group.map(g => sanitizeRichHTML(g.innerHTML)).filter(x => !richIsEmpty(x));
      const joined = parts.join("<br>");
      if(k === "inotes") item.notes = joined;
      else{
        const t = (item.todos || []).find(x => x.id === todoId);
        if(!t) return;
        if(k === "ntext") t.text = joined;
        else t.notes = joined;       // nnotes, tnotes
      }
      recordChange(item.id, "item", item.id, item.name, wasDraft && k === "ntext" ? "noteAdd" : "formattedEdit", wasDraft && k === "ntext" ? "Note added" : "Edited in Formatted view", "", stripTags(clean));
      group.forEach(g => { if(g === f) delete g.dataset.draft; if(g.dataset.draft) return;   // a freshly spawned empty bullet in this group stays put
        initial.set(g, g.innerHTML); if(richIsEmpty(g.innerHTML)){ const li = g.closest("li"), ul = li && li.parentElement; if(li) li.remove(); if(ul && ul.dataset.ul === "sub" && !ul.children.length) ul.remove(); } });
      scheduleSave();
    });
  }
  docEl.querySelectorAll("[data-k]").forEach(wire);
  docEl.__addSub = addSubLine;
}

/** Take an estate off the To-Do page: deletes its open to-dos and dismisses its hold follow-up (the estate itself is untouched). */
/** Keep an estate (and optionally one of its titles) on the Action List even with nothing active. */
function pinToActionList(item, title){
  if(!item || item.id === GENERAL_ID) return;
  item.actionPinned = true; item.actionHidden = false;
  if(title){
    if(!item.actionTitles) item.actionTitles = [];
    if(!item.actionTitles.includes(title)) item.actionTitles.push(title);
  }
  recordChange(item.id, "item", item.id, item.name, "actionPinned", "Added to Action List", "", title ? stripTags(title) : item.name);
  scheduleSave();
  render();
}
function removeTodoEntry(item){
  // Takes the estate off the Action List only. Its to-dos, notes and everything on the Details pages stay as they are.
  item.actionHidden = true;
  item.actionTitles = [];
  item.actionPinned = false;
  recordChange(item.id, "item", item.id, item.name, "actionHidden", "Removed from Action List", "", item.name);
  if(item.estateCategory === "hold" && isValidDate(item.holdFollowUpDate)) item.todoFollowUpDismissed = item.holdFollowUpDate;
  scheduleSave();
  render();
}
/** The quick-add form (estate/title + optional to-do). Used at the bottom of the Action List and in the top-bar "+ New item" pop-up. */
function buildQuickAdd(){
  const open = STATE.data.items.filter(i => !(i.stepActuals && i.stepActuals.target_rights_secured));
  for(const i of open) migrateTodos(i);
  const general = getGeneralItem();
  // Quick add: type an estate name or a title (autocompletes) and write a to-do.
  const options = []; // {label, item}
  for(const i of open){
    options.push({ label: i.name, item: i, title: "" });
    for(const t of (i.titles || [])){
      const tt = stripTags(t);
      if(tt) options.push({ label: `${tt} — ${i.name}`, item: i, title: t });
    }
  }
  options.push({ label: "General (no estate or title)", item: general, title: "" });
  options.sort((x, y) => byName(x.label, y.label));
  if(options.length){
    const add = el(`
      <div>
        <div class="step-note-add todo-add">
          <input type="text" class="step-note-input todo-add-estate" id="todo-add-estate" list="todo-add-list" placeholder="Estate or title — or type a new “Title - Estate” and press Enter…" autocomplete="off" />
          <input type="text" class="step-note-input" id="todo-add-text" placeholder="To-do (optional — blank just keeps the estate/title on the list)…" />
          <button class="btn btn-sm" id="todo-add-go" type="button">Add</button>
        </div>
        <div class="todo-add-msg section-note" id="todo-add-msg" style="display:none;"></div>
        <datalist id="todo-add-list">${options.map(o => `<option value="${escapeHtml(o.label)}"></option>`).join("")}</datalist>
      </div>
    `);
    const msg = add.querySelector("#todo-add-msg");
    const say = (t) => { msg.textContent = t; msg.style.display = t ? "" : "none"; };
    const resolve = (q) => {
      const query = q.trim().toLowerCase().replace(/\s*[-\u2013\u2014]+\s+/g, " \u2014 ").replace(/\s+/g, " ");
      if(!query) return { item: general, title: "" };
      const exact = options.filter(o => o.label.toLowerCase() === query);
      const hits = exact.length ? exact : options.filter(o => o.label.toLowerCase().includes(query));
      const ids = [...new Set(hits.map(o => o.item.id))];
      if(ids.length === 1) return { item: hits[0].item, title: hits.length === 1 ? hits[0].title : "" };
      if(!ids.length) return { err: "No estate or title matches that." };
      return { err: "That matches more than one estate — keep typing and pick one from the list." };
    };
    // Nothing matched: offer to create the estate and/or title right here.
    const offerCreate = (raw, text, auto) => {
      const typed = raw.trim();
      msg.innerHTML = ""; msg.style.display = "";
      const finish = (item, title) => {
        if(text) addTodo(item, text, "", title || "");
        else pinToActionList(item, title || "");
      };
      const sepMatch = typed.match(/^(.+?)\s+[-\u2013\u2014]+\s+(.+)$/);
      const findEstate = (name) => {
        const q = name.trim().toLowerCase();
        const exact = open.filter(i => i.name.toLowerCase() === q);
        if(exact.length === 1) return exact[0];
        const part = open.filter(i => i.name.toLowerCase().includes(q));
        return part.length === 1 ? part[0] : null;
      };
      const row = (label, onClick) => {
        const b = el(`<button class="btn btn-sm" type="button">${escapeHtml(label)}</button>`);
        b.onclick = onClick; return b;
      };
      const box = el(`<div class="todo-create-offer"></div>`);
      if(sepMatch){
        const tName = sepMatch[1].trim(), eName = sepMatch[2].trim();
        const est = findEstate(eName);
        if(auto){   // "Title - Estate" is unambiguous: create straight away
          if(est){ const t = attachTitleRecord(est, tName); finish(est, t); }
          else { const e2 = createEstateRecord(eName); const t = attachTitleRecord(e2, tName); finish(e2, t); }
          return;
        }
        if(est){
          box.appendChild(el(`<div>No title called “${escapeHtml(tName)}” on ${escapeHtml(est.name)} yet.</div>`));
          box.appendChild(row(`Create title “${tName}” on ${est.name}` + (text ? " and add the to-do" : ""), () => { const t = attachTitleRecord(est, tName); finish(est, t); }));
        }else{
          box.appendChild(el(`<div>No estate called “${escapeHtml(eName)}” yet.</div>`));
          box.appendChild(row(`Create estate “${eName}” with title “${tName}”` + (text ? " and add the to-do" : ""), () => { const e2 = createEstateRecord(eName); const t = attachTitleRecord(e2, tName); finish(e2, t); }));
        }
      }else{
        box.appendChild(el(`<div>“${escapeHtml(typed)}” isn’t an estate or title yet. Create it as:</div>`));
        const line = el(`<div class="todo-create-row"></div>`);
        line.appendChild(row(`New estate “${typed}”`, () => { const e2 = createEstateRecord(typed); finish(e2, ""); }));
        const sel = el(`<select class="todo-create-select">${open.slice().sort((a, b) => a.name.localeCompare(b.name)).map(i => `<option value="${escapeHtml(i.id)}">${escapeHtml(i.name)}</option>`).join("")}</select>`);
        line.appendChild(el(`<span class="todo-create-or">or new title on</span>`));
        line.appendChild(sel);
        line.appendChild(row("Create title", () => { const est = open.find(i => i.id === sel.value); if(!est) return; const t = attachTitleRecord(est, typed); finish(est, t); }));
        box.appendChild(line);
      }
      const cancel = el(`<button class="btn btn-sm btn-ghost" type="button">Cancel</button>`);
      cancel.onclick = () => say("");
      box.appendChild(cancel);
      msg.appendChild(box);
    };
    add.querySelector("#todo-add-go").onclick = () => doAdd();
    const doAdd = () => {
      const text = add.querySelector("#todo-add-text").value.trim();
      const r = resolve(add.querySelector("#todo-add-estate").value);
      if(r.err === "No estate or title matches that."){ offerCreate(add.querySelector("#todo-add-estate").value, text, true); return; }
      if(r.err){ say(r.err); return; }
      if(!text){
        if(r.item.id === GENERAL_ID){ say("Write the to-do text first."); return; }
        pinToActionList(r.item, r.title);       // no to-do: just keep it on the list
        return;
      }
      addTodo(r.item, text, "", r.title);
    };
    for(const id of ["#todo-add-text", "#todo-add-estate"]){
      add.querySelector(id).addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); if(id === "#todo-add-estate"){ const rr = resolve(add.querySelector("#todo-add-estate").value); if(rr.err === "No estate or title matches that.") offerCreate(add.querySelector("#todo-add-estate").value, add.querySelector("#todo-add-text").value.trim(), true); else add.querySelector("#todo-add-text").focus(); } else doAdd(); } });
    }
    return add;
  }
  return null;
}

function renderTodoTab(){
  const wrap = el(`<div></div>`);
  const view = STATE.todoView || "list";
  const head = el(`
    <div class="page-head">
      <div><h1 class="page-title">Action List</h1></div>
      <div class="todo-view-toggle">
        <button class="btn btn-sm ${view === "list" ? "" : "btn-ghost"}" data-view="list">Working list</button>
        <button class="btn btn-sm ${view === "formatted" ? "" : "btn-ghost"}" data-view="formatted">Formatted</button>
      </div>
    </div>
  `);
  const syncCollapseAll = () => {
    const btn = head.querySelector("#todo-collapse-all");
    if(!btn) return;
    const ents = Array.from(document.querySelectorAll(".todo-entry, .todo-subsec"));
    btn.textContent = ents.length && ents.every(x => x.classList.contains("collapsed")) ? "Expand all" : "Collapse all";
  };
  if(view === "list"){
    const ca = el(`<button class="btn btn-sm btn-ghost" id="todo-collapse-all" type="button" style="margin-right:8px;">Collapse all</button>`);
    head.querySelector(".todo-view-toggle").prepend(ca);
    ca.onclick = () => {
      const ents = Array.from(document.querySelectorAll(".todo-entry, .todo-subsec"));
      const collapse = !ents.every(x => x.classList.contains("collapsed"));
      for(const x of ents){
        x.classList.toggle("collapsed", collapse);
        const key = x.dataset.collapseKey || x.dataset.itemId;
        if(collapse) todoCollapsed.add(key); else todoCollapsed.delete(key);
      }
      saveCollapsed(); syncCollapseAll();
    };
    setTimeout(syncCollapseAll, 0);
  }
  head.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { STATE.todoView = b.dataset.view; renderOverviewInPlace(); });
  wrap.appendChild(head);

  const today = todayISO();
  const open = STATE.data.items.filter(i => !(i.stepActuals && i.stepActuals.target_rights_secured));
  for(const i of open) migrateTodos(i);
  const holdDate = () => null;   // a follow-up is a real to-do now (see ensureFollowUpTodos)
  ensureFollowUpTodos();
  // A to-do that was urgent keeps its box where it was for the rest of the day it is finished, so checking it off never makes the box jump away.
  const hasUrgent = (i) => (i.todos || []).some(t => t.urgent && t.kind !== "note" && !richIsEmpty(t.text) && (!t.done || t.doneAt === today));
  const general = getGeneralItem();
  const order = Array.isArray(STATE.data.todoOrder) ? STATE.data.todoOrder : [];
  const ordIdx = (i) => { const k = order.indexOf(i.id); return k === -1 ? 1e9 : k; };
  const entryLabel = (i) => { const sc = todoSections(i); return (sc ? sc[0].label : todoTitlesLabel(i)) || i.name; };
  const rows = open.concat([general])
    .filter(i => i.id === GENERAL_ID || (!i.actionHidden && (openTodos(i).length || openNotes(i).length || recentDoneTodos(i).length || holdDate(i) || i.actionPinned || (i.actionTitles && i.actionTitles.length && todoSections(i)))))
    .sort((a, b) => {
      // Urgent first, then General, then everything else alphabetically by title / estate.
      if(hasUrgent(a) !== hasUrgent(b)) return hasUrgent(a) ? -1 : 1;
      if((a.id === GENERAL_ID) !== (b.id === GENERAL_ID)) return a.id === GENERAL_ID ? -1 : 1;
      return byName(entryLabel(a), entryLabel(b));
    });

  if(view === "formatted"){
    const withTodos = rows.filter(i => openTodos(i).length || openNotes(i).length);
    const panel = el(`
      <div class="panel">
        <div class="panel-head"><div><h2>Formatted</h2></div><div><span class="todo-copy-msg" id="todo-copy-msg"></span> <button class="btn btn-sm" id="todo-pdf" title="Opens the print dialog: choose Save as PDF, or print directly">PDF / Print</button> <button class="btn btn-sm" id="todo-copy">Copy</button></div></div>
        <div class="panel-pad"><div id="todo-heading-holder" class="todo-heading-holder"></div><div class="todo-doc" id="todo-doc"></div></div>
      </div>
    `);
    const docEl = panel.querySelector("#todo-doc");
    const headingLine = createRichTextLine(STATE.data.todoHeading || "", "Heading (optional) — e.g. Rights Available:", "todo-heading-input");
    panel.querySelector("#todo-heading-holder").appendChild(headingLine);
    bindCommitRich(headingLine, v => { STATE.data.todoHeading = v; scheduleSave(); renderOverviewInPlace(); });
    if(withTodos.length){ docEl.innerHTML = buildTodoDocHTML(withTodos, "", true); bindFormattedEditing(docEl); }
    else docEl.appendChild(el(`<div class="section-note">No open to-dos yet.</div>`));
    if(withTodos.length) panel.querySelector(".panel-pad").appendChild(el(`<div class="section-note" style="margin-top:12px;">Click any line to edit. Return adds a new bullet below (same kind). On an empty new bullet, Tab indents it into a sub-bullet (Shift+Tab undoes it). The chip beside the line you’re on flips it between note and to-do. The date box beside it sets an optional date. Option+Return = line break within a bullet.</div>`));
    const msg = panel.querySelector("#todo-copy-msg");
    const cleanedDoc = () => {
      const c = docEl.cloneNode(true);
      c.querySelectorAll("[data-k]").forEach(f => { for(const a of Array.from(f.attributes)) if(a.name !== "style") f.removeAttribute(a.name); });
      c.querySelectorAll("[contenteditable]").forEach(f => f.removeAttribute("contenteditable"));
      c.querySelectorAll("[data-ul],[data-entry]").forEach(f => { f.removeAttribute("data-ul"); f.removeAttribute("data-entry"); });
      return c.innerHTML;
    };
    panel.querySelector("#todo-pdf").onclick = () => {
      const hd = stripTags(STATE.data.todoHeading) ? `<div style="font-weight:bold;font-size:15pt;margin:0 0 10pt 0;">${STATE.data.todoHeading}</div>` : "";
      const page = `<!doctype html><html><head><meta charset="utf-8"><title>Action List</title><style>
        @page { size: Letter; margin: 0.8in 0.9in; }
        html, body { margin:0; padding:0; background:#fff; }
        body { font-family: Arial, Helvetica, sans-serif; font-size:12pt; line-height:1.45; color:#000; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        ul { margin:0; }
        li { break-inside:avoid; page-break-inside:avoid; }
        a { color:inherit; }
      </style></head><body>${hd}${cleanedDoc()}</body></html>`;
      const old = document.getElementById("todo-print-frame"); if(old) old.remove();
      const fr = document.createElement("iframe");
      fr.id = "todo-print-frame";
      fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;";
      fr.srcdoc = page;
      fr.onload = () => { try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ msg.textContent = "Printing isn't available here"; setTimeout(() => { msg.textContent = ""; }, 3000); } };
      document.body.appendChild(fr);
    };
    panel.querySelector("#todo-copy").onclick = async () => {
      const hdText = stripTags(STATE.data.todoHeading);
      const hdHtml = hdText ? `<div style="font-weight:bold;margin:0 0 4px 0;">${STATE.data.todoHeading}</div>` : "";
      const cleanDoc = docEl.cloneNode(true);
      cleanDoc.querySelectorAll("[data-k]").forEach(f => { for(const a of Array.from(f.attributes)) if(a.name !== "style") f.removeAttribute(a.name); });
      cleanDoc.querySelectorAll("[contenteditable]").forEach(f => f.removeAttribute("contenteditable"));
      const html = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;">${hdHtml}${cleanDoc.innerHTML}</div>`;
      try{
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([(hdText ? hdText + "\n" : "") + docEl.innerText], { type: "text/plain" }),
        })]);
        msg.textContent = "Copied";
      }catch(e){
        const range = document.createRange(); range.selectNodeContents(docEl);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
        msg.textContent = ok ? "Copied" : "Select the text and copy it";
      }
      setTimeout(() => { msg.textContent = ""; }, 2500);
    };
    wrap.appendChild(panel);
    return wrap;
  }

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><h2>What needs doing</h2></div></div>
      <div class="panel-pad" data-role="list"></div>
    </div>
  `);
  const list = panel.querySelector('[data-role="list"]');
  if(!rows.length) list.appendChild(el(`<div class="section-note">No to-dos yet. Add one below, or on any estate's page.</div>`));
  for(const item of rows){
    const secs = todoSections(item);
    const titles = secs ? secs[0].label : todoTitlesLabel(item);
    const isGeneral = item.id === GENERAL_ID;
    const lines = isGeneral ? [] : todoContactEntries(item);
    const hd = holdDate(item);
    const entry = el(`
      <div class="todo-entry ${secs ? "has-secs" : ""} ${todoCollapsed.has(item.id) ? "collapsed" : ""}">
        <div class="todo-entry-head" data-role="open" title="${isGeneral ? "" : "Open estate"}">
          <button class="todo-collapse" type="button" data-role="collapse" title="Collapse / expand"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></button>
          ${titles ? `<span class="todo-entry-titles" spellcheck="false"></span> – ` : ""}<span class="todo-entry-name">${escapeHtml(item.name)}</span>${isGeneral ? `<span class="todo-entry-sub">not linked to an estate or title</span>` : ""}
          <span class="todo-entry-count">${openTodos(item).length ? openTodos(item).length + " to-do" + (openTodos(item).length > 1 ? "s" : "") : ""}${openTodos(item).length && openNotes(item).length ? ", " : ""}${openNotes(item).length ? openNotes(item).length + " note" + (openNotes(item).length > 1 ? "s" : "") : ""}</span>
          ${hd ? `<span class="pill ${hd < today ? "pill-late" : "pill-pending"}">${hd < today ? "follow-up overdue" : "follow up"} ${fmtDateShort(hd)}</span>` : ""}
          ${titles && !(secs && secs[0].tag) ? `<button class="todo-title-edit" type="button" title="Edit this heading (clear it to go back to automatic)">&#9998; Edit heading</button>` : ""}
          ${isGeneral ? "" : `<button class="btn btn-sm btn-ghost todo-entry-remove" data-role="entry-remove" title="Remove this whole entry from the Action List">Remove</button>`}
        </div>
        <div class="todo-lines"></div>
        <div data-holder="items"></div>
      </div>
    `);
    if(!lines.length) entry.querySelector(".todo-lines").remove();
    else{
      const box = entry.querySelector(".todo-lines");
      for(const ln of lines){
        const d = document.createElement("div");
        d.className = "rich-line todo-line todo-line-live";
        d.contentEditable = "true";
        d.innerHTML = ln.html;
        bindBulletShortcuts(d);
        d.addEventListener("keydown", (e) => {
          if(e.key === "Enter"){ e.preventDefault(); if(e.altKey || e.shiftKey) document.execCommand("insertLineBreak"); else d.blur(); }
          if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); insertLinkAtSelection(d); }
        });
        let committed = sanitizeRichHTML(d.innerHTML);
        d.addEventListener("blur", () => {
          const clean = sanitizeRichHTML(d.innerHTML);
          if(clean === committed) return;
          committed = clean;
          ln.ec.todoLine = stripTags(clean).trim() ? clean : "";
          if(!ln.ec.todoLine) d.remove();
          scheduleSave();
        });
        box.appendChild(d);
      }
    }
    // Estate notes: live, editable text (the same Additional Notes shown on the estate page)
    const liveNotes = document.createElement("div");
    liveNotes.className = "rich-line todo-notes-live";
    liveNotes.contentEditable = "true";
    liveNotes.setAttribute("data-placeholder", "Add notes…");
    liveNotes.innerHTML = item.notes || "";
    bindBulletShortcuts(liveNotes);
    bindCommitRich(liveNotes, v => { updateItemField(item, "notes", v); });
    liveNotes.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); liveNotes.blur(); }
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); insertLinkAtSelection(liveNotes); }
    });
    if(!isGeneral) entry.querySelector('[data-holder="items"]').before(liveNotes);
    entry.querySelector('[data-role="open"]').onclick = (ev) => { if(isGeneral) return; if(ev && ev.target && ev.target.closest && ev.target.closest(".todo-entry-titles.editing")) return; if(entry.querySelector(".todo-entry-titles.editing")) return; STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
    const tEl = entry.querySelector(".todo-entry-titles");
    if(tEl){
      const known = (item.titles || []).filter(t => stripTags(t));
      const paintLinks = () => {
        tEl.textContent = "";
        tEl.contentEditable = "false";
        const parts = titles.split(" / ");
        parts.forEach((part, i) => {
          if(i) tEl.appendChild(document.createTextNode(" / "));
          const match = known.find(t => stripTags(t).trim().toUpperCase() === part.trim().toUpperCase());
          const sp = document.createElement("span");
          sp.textContent = part;
          if(match){
            sp.className = "title-link";
            sp.title = "Open title page";
            sp.addEventListener("click", (e) => { e.stopPropagation(); openTitlePage(item, match); });
          }
          tEl.appendChild(sp);
        });
      };
      paintLinks();
      const editBtn = entry.querySelector(".todo-title-edit");
      let cancelled = false;
      const startEdit = (e) => {
        if(e) e.stopPropagation();
        if(secs && secs[0].tag) return;     // a title's own heading follows the title
        cancelled = false;
        tEl.textContent = titles;
        tEl.contentEditable = "true";
        tEl.classList.add("editing");
        tEl.focus();
        const r = document.createRange(); r.selectNodeContents(tEl);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      };
      if(editBtn) editBtn.addEventListener("click", startEdit);
      tEl.addEventListener("dblclick", startEdit);
      tEl.addEventListener("keydown", (e) => {
        if(!tEl.classList.contains("editing")) return;
        if(e.key === "Enter"){ e.preventDefault(); tEl.blur(); }
        if(e.key === "Escape"){ e.preventDefault(); cancelled = true; tEl.blur(); }
      });
      tEl.addEventListener("blur", () => {
        if(!tEl.classList.contains("editing")) return;
        tEl.classList.remove("editing");
        if(cancelled){ paintLinks(); return; }
        const typed = normalizeTitleHeading(item, (tEl.textContent || "").replace(/\s+/g, " ").trim());
        if(typed.toUpperCase() === titles){ paintLinks(); return; }
        item.todoTitleLabel = typed;
        recordChange(item.id, "item", item.id, item.name, "todoTitleLabel", "To-Do heading", titles, typed.toUpperCase());
        scheduleSave();
        renderOverviewInPlace();
      });
    }
    const er = entry.querySelector('[data-role="entry-remove"]');
    if(er) bindConfirmDelete(er, () => removeTodoEntry(item), "Remove", "Remove all?");
    entry.dataset.itemId = item.id;
    const colBtn = entry.querySelector('[data-role="collapse"]');
    colBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const now = entry.classList.toggle("collapsed");
      if(now) todoCollapsed.add(item.id); else todoCollapsed.delete(item.id);
      saveCollapsed();
      syncCollapseAll();
    });
    const itemsHolder = entry.querySelector('[data-holder="items"]');
    if(!secs){
      // A box whose items all belong to one title: new items must join that title, not land untitled
      // (untitled items would show up under the estate's other titles).
      const visAll = item.todos.filter(t => !richIsEmpty(t.text) && (t.kind === "note" || !t.done || isRecentDone(t)));
      const tags = Array.from(new Set(visAll.filter(t => t.title).map(t => t.title)));
      const ownL = matchTitlesIn(item, stripTags(item.todoTitleLabel || "").trim());
      if(ownL && ownL.length >= 2 && tags.every(t => ownL.includes(t))) itemsHolder.appendChild(renderTodoItemsEditor(item, { noTag: true }));
      else if(tags.length === 1 && item.id !== GENERAL_ID) itemsHolder.appendChild(renderTodoItemsEditor(item, { title: tags[0], exact: true, withUntagged: true, noTag: true }));
      else itemsHolder.appendChild(renderTodoItemsEditor(item, { noTag: true }));
    }
    else secs.forEach((sec, i) => {
      if(!i){
        const first = el(`<div class="todo-sec-first"></div>`);
        first.appendChild(renderTodoItemsEditor(item, { title: sec.tag, exact: true, withUntagged: sec.withUntagged || (item.todos.some(t => t.followUp && !richIsEmpty(t.text)) && !secs.some(x => x.withUntagged || !x.tag)) }));
        itemsHolder.appendChild(first);
        return;
      }
      const key = item.id + "|" + sec.tag;
      const box = el(`<div class="todo-subsec ${todoCollapsed.has(key) ? "collapsed" : ""}"></div>`);
      box.dataset.collapseKey = key;
      const sh = el(`<div class="todo-sub-head"><button class="todo-collapse" type="button" title="Collapse / expand"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></button>${sec.label ? `<span class="todo-entry-titles"><span class="title-link"></span></span> – ` : ""}<span class="todo-entry-name">${escapeHtml(item.name)}</span></div>`);
      const tl = sh.querySelector(".title-link");
      if(tl){
        tl.textContent = sec.label;
        if(sec.tag){ tl.title = "Open title page"; tl.addEventListener("click", () => openTitlePage(item, sec.tag)); }
      }
      sh.querySelector(".todo-entry-name").addEventListener("click", () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); });
      sh.querySelector(".todo-collapse").addEventListener("click", () => {
        const now = box.classList.toggle("collapsed");
        if(now) todoCollapsed.add(key); else todoCollapsed.delete(key);
        saveCollapsed(); syncCollapseAll();
      });
      if(sec.tag && !item.todos.some(t => (t.title === sec.tag || (sec.withUntagged && !t.title)) && !richIsEmpty(t.text))){
        const rm = el(`<button class="btn btn-sm btn-ghost todo-entry-remove" type="button" title="Take this empty title off the Action List (it stays on the estate)">Remove</button>`);
        rm.onclick = () => { item.actionTitles = (item.actionTitles || []).filter(t => t !== sec.tag); scheduleSave(); render(); };
        sh.appendChild(rm);
      }
      box.appendChild(sh);
      const body = el(`<div class="todo-sec-body"></div>`);
      body.appendChild(renderTodoItemsEditor(item, { title: sec.tag, exact: true, withUntagged: sec.withUntagged }));
      box.appendChild(body);
      itemsHolder.appendChild(box);
    });
    list.appendChild(entry);
  }

  const quickAdd = buildQuickAdd();
  if(quickAdd) panel.querySelector(".panel-pad").appendChild(quickAdd);
  wrap.appendChild(panel);
  return wrap;
}

function toggleTitleDevelop(item, title){

function renderTitleCard(item, title){

    ["Genre", td.genre], ["Original / adapted", td.originalOrAdapted], ["Episodes", td.episodeCount],

  ].map(([k, v]) => [k, stripTags(v)]).filter(([, v]) => v);

  const todos = item.todos
    .filter(t => !richIsEmpty(t.text) && (t.kind === "note" || t.done) && todoOnTitle(t, title, item))
    .sort((a, b) => {
      const sa = (a.kind === "note" ? (isValidDate(a.date) ? a.date : a.createdAt) : (a.done ? a.doneAt : a.createdAt)) || "", sb = (b.kind === "note" ? (isValidDate(b.date) ? b.date : b.createdAt) : (b.done ? b.doneAt : b.createdAt)) || "";
      return sa < sb ? 1 : sa > sb ? -1 : 0;
    });
  const card = el(`

      ${stripTags(td.notes) ? `<div class="title-card-logline">${td.notes}</div>` : ""}
      <div class="title-card-updates"></div>
    </div>
  `);
  card.querySelector('[data-role="open"]').onclick = () => { STATE.view = "detail"; STATE.currentItemId = item.id; render(); };
  card.querySelector('[data-role="open-title"]').onclick = () => openTitlePage(item, title);
  const upd = card.querySelector(".title-card-updates");
  if(todos.length){
    upd.appendChild(el(`<div class="todo-done-label">Updates &amp; progress</div>`));
    for(const t of todos) upd.appendChild(buildProgressRow(item, t));

/* ---- Title page: everything about one title --------------------------- */
function buildContactLinesBox(item){
  const box = document.createElement("div");
  box.className = "todo-lines";
  const entries = todoContactEntries(item);
  for(const ln of entries){
    const d = document.createElement("div");
    d.className = "rich-line todo-line todo-line-live";
    d.contentEditable = "true";
    d.innerHTML = ln.html;
    d.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){ e.preventDefault(); if(e.altKey || e.shiftKey) document.execCommand("insertLineBreak"); else d.blur(); }
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); insertLinkAtSelection(d); }
    });
    let committed = sanitizeRichHTML(d.innerHTML);
    d.addEventListener("blur", () => {
      const clean = sanitizeRichHTML(d.innerHTML);
      if(clean === committed) return;
      committed = clean;
      ln.ec.todoLine = stripTags(clean).trim() ? clean : "";
      if(!ln.ec.todoLine) d.remove();
      scheduleSave();
    });
    box.appendChild(d);
  }
  return box;
}

function renderSummaryBox(item){
  const seq = buildStepSequence(item);
  const completed = seq.filter(e => isValidDate(seqEntryActual(item, e)));

  // Every note across every step (preset + custom), each tagged with the
  // step it belongs to and dated (preferring the note's own date over its
  // creation timestamp).
  const allNotes = [];
  for(const entry of seq){
    const stepLbl = seqEntryLabel(item, entry);
    const notes = entry.kind === "preset"
      ? ((item.stepNotes && item.stepNotes[entry.field]) || [])
      : (entry.custom.notes || []);
    for(const n of notes){
      const d = isValidDate(n.date) ? n.date : (n.createdAt ? n.createdAt.slice(0, 10) : null);
      allNotes.push({ stepLabel: stepLbl, date: d, text: n.text });
    }
  }
  allNotes.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0);

  const next = computeNextStep(item);
  let nextLine;
  if(!next){
    nextLine = `<div class="summary-line summary-empty">All steps complete — Rights Secured.</div>`;
  }else{
    const bits = [escapeHtml(next.label)];
    if(next.pending && !next.holdFollowUp) bits.push(`waiting on a response${next.pendingDays !== null ? ` (${next.pendingDays}d)` : ""}`);
    if(next.text) bits.push(escapeHtml(next.text));
    nextLine = `<div class="summary-line">${bits.join(" — ")}</div>`;
  }

  const box = el(`
    <div class="summary-box">
      <div class="summary-box-header">
        <h3>${escapeHtml(item.name)}</h3>
        ${(item.titles && item.titles.length) ? `<div class="summary-titles" data-role="subtitles"></div>` : ""}

        <div class="summary-section-label">Progress</div>

          ? completed.map(e => `<div class="summary-line"><span class="summary-line-date">${fmtDateShort(seqEntryActual(item, e))}</span><span class="summary-line-body">${escapeHtml(seqEntryLabel(item, e))}</span></div>`).join("")
          : `<div class="summary-line summary-empty">No steps completed yet.</div>`}
      </div>
      <div class="summary-section">
        <div class="summary-section-label">Notes</div>

          ? allNotes.map(n => `<div class="summary-line"><span class="summary-line-date">${n.date ? fmtDateShort(n.date) : "No date"}</span><span class="summary-line-body"><span class="summary-note-meta">${escapeHtml(n.stepLabel)}</span>${n.text}</span></div>`).join("")
          : `<div class="summary-line summary-empty">No notes yet.</div>`}
      </div>
      <div class="summary-section">
